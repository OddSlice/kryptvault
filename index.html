      case 'deathseeker': p.deathseeker = 1;
                          p.critChance = Math.min(0.75, p.critChance + 0.15);
                          p.shotSpeed = Math.max(100, Math.round(p.shotSpeed * 0.9)); break;
    }
    // hard ceilings — no combination of stacks may break the simulation
    // (a level-3254 marathon proved every uncapped multiplier will be found)
    p.speed = Math.min(p.speed, 250);
    game.curseSpeedMult = Math.min(game.curseSpeedMult, 2.5);
    game.curseHpMult = Math.min(game.curseHpMult, 10);
    game.spawnHaste = Math.min(game.spawnHaste, 3);
  }

  // index of the draft card under a point, or -1
  function draftCardAt(mx, my) {
    for (var i = 0; i < game.cards.length; i++) {
      var c = game.cards[i];
      if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) return i;
    }
    return -1;
  }

  // shared by clicks, taps, number keys and Enter, for both draft screens
  function pickDraftCard(i) {
    if ((game.draftLock || 0) > 0 || !game.cards[i]) return;
    if (game.gameState === 'levelup') pickCard(i);
    else if (game.gameState === 'ascend') pickAscend(i);
  }

  function pickCard(i) {
    applyUpgrade(game.cards[i].upgrade);
    game.cards = [];
    // more levels banked from the same XP burst: draft again right away
    if (game.pendingLevelUps > 0) {
      game.pendingLevelUps--;
      triggerLevelUp();
      return;
    }
    if (game.advanceAfterLevel) {
      // a forced boss-kill level-up: proceed to the next wave intro
      game.advanceAfterLevel = false;
      beginWave(game.wave + 1);
    } else {
      game.gameState = 'playing';
    }
  }

  // ---------------------------------------------------------------------------
  // ASCENDANCY — draft screen, pick handling, and the spacebar active
  // ---------------------------------------------------------------------------
  function triggerAscend() {
    // the hero died in the same frame the boss fell: the run is over
    if (game.gameState === 'gameover') return;
    // the same frame can level you up and kill the boss: keep that draft for later
    if (game.gameState === 'levelup') game.pendingLevelUps = (game.pendingLevelUps || 0) + 1;
    game.gameState = 'ascend';
    game.draftLock = DRAFT_LOCK;
    game.cardFocus = 0;
    playLevelUp();
    var pair = ASCENDANCIES[currentClass] || ASCENDANCIES.warrior;
    var cardW = 150, cardH = 180, gap = 28;
    var totalW = pair.length * cardW + (pair.length - 1) * gap;
    var startX = (W - totalW) / 2;
    var cy = (H - cardH) / 2 + 8;
    game.cards = pair.map(function (a, i) {
      return { asc: a, x: startX + i * (cardW + gap), y: cy, w: cardW, h: cardH };
    });
  }

  function pickAscend(i) {
    applyAscendancy(game.cards[i].asc);
    game.cards = [];
    game.advanceAfterLevel = false;
    beginWave(game.wave + 1);
  }

  function applyAscendancy(a) {
    var p = game.player;
    p.ascendancy = a;
    p.abilityCd = 0;
    p.abilityMaxCd = a.cd;
    p.upgradesTaken['asc_' + a.id] = 1; // shows up in run analytics
    switch (a.id) {
      case 'juggernaut': p.ascendDR = 0.10; break;
      // berserker passive lives in spawnProjectile (needs live HP)
      case 'phantom':    p.speed += 15; break;
      case 'assassin':   p.critChance = Math.max(p.critChance, 0.2); break; // never lowers earlier picks
      case 'frostmage':  p.frost = Math.max(p.frost, 1); break;
      case 'lightmage':  p.homingBase = Math.max(p.homingBase, 0.10); break;
      case 'sniper':     p.shotSpeed = Math.round(p.shotSpeed * 1.25); break;
      case 'trapper':    p.pierce += 1; break;
      case 'demolitionist': p.boomRadiusMult = 1.4; break;
      case 'chainreactor':  p.chainBonus = 1; break;
    }
  }

  function castAbility() {
    var p = game.player;
    if (!p || !p.ascendancy || p.abilityCd > 0 || game.gameState !== 'playing') return;
    var a = p.ascendancy;
    p.abilityCd = a.cd;
    p.abilityMaxCd = a.cd;
    var target, ang, i, e, ddx, ddy;
    switch (a.id) {
      case 'juggernaut':
        // charge toward the nearest enemy (or facing if the room is clear)
        target = findNearestEnemy(p.x, p.y);
        ang = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facing === -1 ? Math.PI : 0);
        p.chargeT = 0.45;
        p.chargeVx = Math.cos(ang) * 320;
        p.chargeVy = Math.sin(ang) * 320;
        p.chargeHits = [];
        break;
      case 'berserker':
        // axe nova: everything nearby takes a heavy hit
        for (i = game.enemies.length - 1; i >= 0; i--) {
          e = game.enemies[i];
          ddx = e.x - p.x; ddy = e.y - p.y;
          if (ddx * ddx + ddy * ddy < 70 * 70) {
            e.hp -= 80;
            addDmg(80, 'ability');
            spawnFloatText(e.x, e.y, '80', a.color);
            e.hitFlash = 0.08;
            if (e.hp <= 0) { if (e.isBoss) killBoss(i, e); else killEnemy(i, e); }
          }
        }
        game.shakeTimer = 0.25;
        spawnRingParticles(p.x, p.y, a.color);
        break;
      case 'phantom':
        // blink along the current move direction (facing if standing still)
        var bdx = 0, bdy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) bdy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) bdy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) bdx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) bdx += 1;
        if (touchCtl.active && Math.abs(touchCtl.vx) + Math.abs(touchCtl.vy) > 0.2) {
          bdx = touchCtl.vx; bdy = touchCtl.vy;
        }
        if (bdx === 0 && bdy === 0) bdx = p.facing;
        var blen = Math.sqrt(bdx * bdx + bdy * bdy);
        bdx /= blen; bdy /= blen;
        spawnRingParticles(p.x, p.y, a.color);
        // step outward and keep the last spot that isn't inside a wall
        for (var step = 70; step >= 10; step -= 10) {
          var bx = clamp(p.x + bdx * step, p.w / 2, W - p.w / 2);
          var by = clamp(p.y + bdy * step, p.h / 2, H - p.h / 2);
          if (!boxHitsWall(bx, by, p.w, p.h)) { p.x = bx; p.y = by; break; }
        }
        p.invuln = Math.max(p.invuln, 0.8);
        break;
      case 'assassin':
        // fan of blades: a full ring of daggers at 1.5x damage
        for (i = 0; i < 12; i++) {
          spawnProjectile(p, (Math.PI * 2 / 12) * i, p.damage * 1.5);
        }
        break;
      case 'frostmage':
        for (i = 0; i < game.enemies.length; i++) {
          e = game.enemies[i];
          ddx = e.x - p.x; ddy = e.y - p.y;
          if (ddx * ddx + ddy * ddy < 90 * 90) {
            e.frozenT = 2;
            chill(e, 0.6, 3);
          }
        }
        spawnRingParticles(p.x, p.y, a.color);
        break;
      case 'lightmage':
        target = findNearestEnemy(p.x, p.y);
        ang = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facing === -1 ? Math.PI : 0);
        game.beams.push({ x: p.x, y: p.y, ang: ang, t: 0.25 });
        // hit everything within 12px of the ray
        var bcos = Math.cos(ang), bsin = Math.sin(ang);
        for (i = game.enemies.length - 1; i >= 0; i--) {
          e = game.enemies[i];
          ddx = e.x - p.x; ddy = e.y - p.y;
          var along = ddx * bcos + ddy * bsin;            // distance down the ray
          var off = Math.abs(-ddx * bsin + ddy * bcos);   // distance off the ray
          if (along > 0 && off < 12 + e.w / 2) {
            e.hp -= 90;
            addDmg(90, 'ability');
            spawnFloatText(e.x, e.y, '90', a.color);
            e.hitFlash = 0.08;
            if (e.hp <= 0) { if (e.isBoss) killBoss(i, e); else killEnemy(i, e); }
          }
        }
        break;
      case 'sniper':
        target = findNearestEnemy(p.x, p.y);
        ang = target ? Math.atan2(target.y - p.y, target.x - p.x) : (p.facing === -1 ? Math.PI : 0);
        spawnProjectile(p, ang, p.damage * 3);
        var mega = game.projectiles[game.projectiles.length - 1];
        mega.pierce = 99;
        mega.vx *= 1.8; mega.vy *= 1.8;
        mega.big = 1;
        break;
      case 'trapper':
        game.zones.push({ x: p.x, y: p.y, r: 40, t: 4, tick: 0 });
        break;
      case 'demolitionist':
        // MEGA BOMB: a huge blast at the nearest foe (or straight ahead) —
        // the Bombardier's answer to lone bosses
        target = findNearestEnemy(p.x, p.y);
        var mbx = target ? target.x : p.x + p.facing * 60;
        var mby = target ? target.y : p.y;
        game.pactBooms.push({ x: mbx, y: mby, dmg: 220, r: 70 * (p.boomRadiusMult || 1), color: '#ff7a2a' });
        game.shakeTimer = 0.4;
        spawnRingParticles(mbx, mby, a.color);
        break;
      case 'chainreactor':
        // DETONATE: mark every enemy on screen to explode in a rolling chain
        for (i = 0; i < game.enemies.length; i++) {
          e = game.enemies[i];
          if (e.isBoss) { e.hp -= 120; addDmg(120, 'ability'); e.hitFlash = 0.08; continue; }
          game.pactBooms.push({ x: e.x, y: e.y, dmg: 90, r: 40, color: '#ffb03a' });
        }
        if (game.boss && game.boss.hp <= 0) {
          var dbi = game.enemies.indexOf(game.boss);
          if (dbi !== -1) killBoss(dbi, game.boss);
        }
        game.shakeTimer = 0.35;
        break;
    }
    playPickup();
  }

  // small radial burst used by several ability visuals
  function spawnRingParticles(x, y, color) {
    for (var i = 0; i < 14; i++) {
      var ang = (Math.PI * 2 / 14) * i;
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * 90, vy: Math.sin(ang) * 90,
        life: 0.35, maxLife: 0.35, size: 2, color: color
      });
    }
  }

  // ---------------------------------------------------------------------------
  // UPDATE
  // ---------------------------------------------------------------------------
  function update(dt) {
    game.scanlineOffset = (game.scanlineOffset + 1) % 4;
    game.blinkTimer += dt;
    if (game.blinkTimer >= 0.5) { game.blinkTimer = 0; game.blinkOn = !game.blinkOn; }
    if (game.damageFlash > 0) game.damageFlash -= dt;
    if (game.shakeTimer > 0) game.shakeTimer -= dt;
    if (game.whiteFlash > 0) game.whiteFlash -= dt;
    if (game.waveBanner > 0) game.waveBanner -= dt;
    if (game.endlessBanner > 0) game.endlessBanner -= dt;
    if (game.draftLock > 0) game.draftLock -= dt;
    if (game.overLock > 0) game.overLock -= dt;
    for (var ti = game.toasts.length - 1; ti >= 0; ti--) {
      game.toasts[ti].t += dt;
      if (game.toasts[ti].t >= 3) game.toasts.splice(ti, 1);
    }

    // Wave intro card: freeze logic for 2s, then begin the wave.
    if (game.gameState === 'waveintro') {
      game.waveIntroTimer -= dt;
      if (game.waveIntroTimer <= 0) {
        game.gameState = 'playing';
        if (game.bossWave) spawnBoss();
      }
      return;
    }

    if (game.gameState !== 'playing') return;

    // a level banked while a screen was up (wave intro, another draft)
    if (game.pendingLevelUps > 0) {
      game.pendingLevelUps--;
      triggerLevelUp();
      return;
    }

    // run time only advances during actual play (not menus or pause)
    game.time += dt;

    // hit-stop: freeze the world for a few hundredths after a kill
    if (game.hitStop > 0) {
      game.hitStop -= dt;
      return;
    }

    var p = game.player;
    if (p.invuln > 0) p.invuln -= dt;
    if (p.abilityCd > 0) p.abilityCd -= dt;
    // vampire lifesteal budget refills once a second: 10 + 2 per stack
    p.vampTick -= dt;
    if (p.vampTick <= 0) {
      p.vampTick = 1;
      p.vampBudget = 10 + 2 * (p.vampire / 3);
    }

    // ----- juggernaut charge: unstoppable, tramples everything in the path -----
    if (p.chargeT > 0) {
      p.chargeT -= dt;
      p.invuln = Math.max(p.invuln, 0.1);
      var cnx = p.x + p.chargeVx * dt, cny = p.y + p.chargeVy * dt;
      cnx = clamp(cnx, p.w / 2, W - p.w / 2);
      cny = clamp(cny, p.h / 2, H - p.h / 2);
      if (!boxHitsWall(cnx, cny, p.w, p.h)) { p.x = cnx; p.y = cny; }
      else p.chargeT = 0; // slams into a wall
      for (var ch = game.enemies.length - 1; ch >= 0; ch--) {
        var ce = game.enemies[ch];
        if (p.chargeHits.indexOf(ce) !== -1) continue;
        var chdx = ce.x - p.x, chdy = ce.y - p.y;
        if (chdx * chdx + chdy * chdy < 20 * 20) {
          p.chargeHits.push(ce);
          ce.hp -= 60;
          addDmg(60, 'ability');
          spawnFloatText(ce.x, ce.y, '60', '#ff6a3a');
          ce.hitFlash = 0.08;
          if (ce.hp <= 0) { if (ce.isBoss) killBoss(ch, ce); else killEnemy(ch, ce); }
        }
      }
    }

    // ----- player movement -----
    // movement refuses any step into a wall, so a hero already inside one
    // could never walk out: get them free first
    if (boxHitsWall(p.x, p.y, p.w, p.h)) pushOutOfWalls(p);
    var dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    // virtual joystick (touch) overrides the keyboard when in use
    if (touchCtl.active && Math.abs(touchCtl.vx) + Math.abs(touchCtl.vy) > 0.2) {
      dx = touchCtl.vx; dy = touchCtl.vy;
    }
    p.moving = (dx !== 0 || dy !== 0);
    if (p.moving) {
      var len = Math.sqrt(dx * dx + dy * dy);
      dx /= len; dy /= len;
      // sand mounds: wade through at half speed
      var wade = softAt(p.x, p.y, p.w, p.h) ? 0.45 : 1;
      // axis-separated wall collision so the player slides along walls
      var pnx = p.x + dx * p.speed * wade * dt;
      var pny = p.y + dy * p.speed * wade * dt;
      if (!boxHitsWall(pnx, pny, p.w, p.h)) { p.x = pnx; p.y = pny; }
      else if (!boxHitsWall(pnx, p.y, p.w, p.h)) { p.x = pnx; }
      else if (!boxHitsWall(p.x, pny, p.w, p.h)) { p.y = pny; }
      if (dx < 0) p.facing = -1;
      else if (dx > 0) p.facing = 1;
      p.walkAnim += dt * 8;
    }
    // clamp to play area
    p.x = clamp(p.x, p.w / 2, W - p.w / 2);
    p.y = clamp(p.y, p.h / 2, H - p.h / 2);

    // ----- auto attack (frenzy pickup halves the cooldown) -----
    if (p.frenzyTimer > 0) p.frenzyTimer -= dt;
    p.attackTimer -= dt;
    if (p.attackTimer <= 0) {
      fireWeapon();
      p.attackTimer = p.attackCooldown * (p.frenzyTimer > 0 ? 0.5 : 1);
    }

    // ----- regen upgrade -----
    if (p.regen > 0 && p.hp < p.maxHp) {
      p.hp = Math.min(p.maxHp, p.hp + p.regen * p.healMult * dt);
    }

    // ----- static burst: periodic zap of the nearest foes -----
    if (p.staticLvl > 0) {
      p.staticTimer -= dt;
      if (p.staticTimer <= 0) {
        p.staticTimer = 2.5;
        var zapTargets = game.enemies.slice()
          .map(function (en2) { var zdx = en2.x - p.x, zdy = en2.y - p.y; return { e: en2, d: zdx * zdx + zdy * zdy }; })
          .filter(function (t2) { return t2.d < 180 * 180; })
          .sort(function (a2, b2) { return a2.d - b2.d; })
          .slice(0, 2 + p.staticLvl);
        var zapDmg = 70 + (p.staticLvl - 1) * 15;
        for (var zt = 0; zt < zapTargets.length; zt++) {
          var ze = zapTargets[zt].e;
          ze.hp -= zapDmg;
          ze.hitFlash = 0.1;
          addDmg(zapDmg, 'static');
          spawnFloatText(ze.x, ze.y, '' + zapDmg, '#f5f76e');
          game.zaps.push({ x1: p.x, y1: p.y, x2: ze.x, y2: ze.y, t: 0.15, jx: rand(-6, 6), jy: rand(-6, 6) });
          if (ze.hp <= 0) {
            var zi = game.enemies.indexOf(ze);
            if (zi !== -1) {
              if (ze.isBoss) killBoss(zi, ze); else killEnemy(zi, ze);
            }
          }
        }
        if (zapTargets.length) playPickup();
      }
    }
    for (var zz = game.zaps.length - 1; zz >= 0; zz--) {
      game.zaps[zz].t -= dt;
      if (game.zaps[zz].t <= 0) game.zaps.splice(zz, 1);
    }

    // ----- enemy spawning (continuous; slower trickle during boss waves) -----
    // gentle for the first few waves, then ramps to the same late-game pressure
    var spawnInterval = Math.max(0.25, 1.5 - game.wave * 0.1) / game.spawnHaste;
    if (game.bossWave) spawnInterval *= 1.8;
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      spawnEnemy();
      game.spawnTimer = spawnInterval;
    }

    // ----- update projectiles -----
    for (var i = game.projectiles.length - 1; i >= 0; i--) {
      var pr = game.projectiles[i];
      // homing steering — applied BEFORE the position update, capped at
      // 4deg/frame. Retargets at 10Hz, not every frame: the nearest-enemy
      // scan was O(projectiles x enemies) and the lag is imperceptible.
      if (pr.homing > 0) {
        pr.htT = (pr.htT || 0) - dt;
        // never steer back onto a monster this shot already went through:
        // piercing shots used to circle it for good and pile up
        if (!pr.ht || pr.ht.hp <= 0 || pr.htT <= 0 || pr.hitSet.indexOf(pr.ht) !== -1) {
          pr.ht = findNearestEnemy(pr.x, pr.y, pr.hitSet);
          pr.htT = 0.1;
        }
        var ht = pr.ht;
        if (ht) {
          var desired = Math.atan2(ht.y - pr.y, ht.x - pr.x);
          var cur = Math.atan2(pr.vy, pr.vx);
          var diff = desired - cur;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          // per second, not per frame: at 144 Hz it used to turn 2.4x harder
          var step = diff * Math.min(1, pr.homing * dt * 60);
          var maxStep = 4 * Math.PI / 180 * dt * 60;
          if (step > maxStep) step = maxStep;
          else if (step < -maxStep) step = -maxStep;
          var na = cur + step;
          var spd = Math.sqrt(pr.vx * pr.vx + pr.vy * pr.vy);
          pr.vx = Math.cos(na) * spd;
          pr.vy = Math.sin(na) * spd;
        }
      }
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      // wall impact — only on entry, so a piercing shot pays once per wall
      var hitWall = boxHitsWall(pr.x, pr.y, 6, 6);
      if (hitWall && !pr.inWall) {
        spawnWallSparks(pr.x, pr.y);
        // breakable blocks crumble after a few hits (Mario rules)
        if (hitWall.breakable) {
          hitWall.bhp--;
          bgDirty = true;
          if (hitWall.bhp <= 0) {
            var wcx = hitWall.x + hitWall.w / 2, wcy = hitWall.y + hitWall.h / 2;
            spawnDeathParticles(wcx, wcy, currentBiome().wallBorder);
            spawnDeathParticles(wcx, wcy, currentBiome().wallFill);
            walls.splice(walls.indexOf(hitWall), 1);
            game.shakeTimer = Math.max(game.shakeTimer, 0.12);
            if (hitWall.kind === 'ice') {
              // shattering ice chills everything nearby
              spawnDeathParticles(wcx, wcy, '#ffffff');
              for (var icn = 0; icn < game.enemies.length; icn++) {
                var ie = game.enemies[icn];
                var idx2 = ie.x - wcx, idy2 = ie.y - wcy;
                if (idx2 * idx2 + idy2 * idy2 < 55 * 55) {
                  chill(ie, 0.5, 2);
                }
              }
            } else if (hitWall.kind === 'gilded') {
              // the Vault pays out: guaranteed pickup + coins
              var loot = ['potion', 'frenzy', 'barrier'][randInt(0, 2)];
              game.pickups.push({ x: wcx, y: wcy, type: loot, t: 8 });
              game.coinsEarned += 15;
              spawnFloatText(wcx, wcy, '+15', '#FFD700');
            } else {
              maybeDropPickup(wcx, wcy);
            }
          }
        }
        if (pr.pierce > 0) {
          pr.pierce--;
        } else {
          game.projectiles.splice(i, 1);
          continue;
        }
      }
      pr.inWall = !!hitWall;
      if (pr.x < -8 || pr.x > W + 8 || pr.y < -8 || pr.y > H + 8) {
        game.projectiles.splice(i, 1);
      }
    }

    // ----- update enemies (chrono pickup freezes them solid) -----
    if (game.freezeTimer > 0) game.freezeTimer -= dt;
    var blasts = []; // bombers whose fuse ran out; they go off after this loop
    for (var j = game.enemies.length - 1; j >= 0; j--) {
      var e = game.enemies[j];
      if (e.hitFlash > 0) e.hitFlash -= dt;
      if (game.freezeTimer > 0) continue; // frozen: no moving, fusing, or shooting
      if (e.slowT > 0) e.slowT -= dt;
      // frost nova: frozen solid — no moving, fusing, or shooting
      if (e.frozenT > 0) { e.frozenT -= dt; continue; }
      // desired velocity: chase the player, plus decaying knockback.
      // cultists keep their distance and shoot instead of melee-rushing.
      var edx = p.x - e.x, edy = p.y - e.y;
      var ed = Math.sqrt(edx * edx + edy * edy) || 1;
      var chase = e.speed;
      if (e.type === 'cultist' || e.type === 'caster') {
        // keep range only once on screen: off-screen they never came in and
        // the edge timer blew them up in the player's face
        if (e.x > 16 && e.x < W - 16 && e.y > 16 && e.y < H - 16) {
          if (ed < 70) chase = -e.speed * 0.7;     // back away
          else if (ed < 110) chase = 0;            // hold range
        }
        e.shootTimer -= dt;
        if (e.shootTimer <= 0 && ed < 220) {
          e.shootTimer = e.type === 'caster' ? 2.2 : Math.max(1.2, 2.4 - game.cultistLevel * 0.2);
          var sa = Math.atan2(edy, edx);
          game.enemyShots.push({ x: e.x, y: e.y, vx: Math.cos(sa) * 100, vy: Math.sin(sa) * 100, col: e.shotCol });
        }
      }
      // bomber: arm the fuse near the player, flash, then detonate
      if (e.type === 'bomber') {
        if (e.fuse < 0 && ed < 26) e.fuse = 0.8;
        if (e.fuse >= 0) {
          e.fuse -= dt;
          chase = 0; // stands its ground while fusing
          if (e.fuse <= 0) { game.enemies.splice(j, 1); blasts.push(e); continue; }
        }
      }

      // boss specials
      if (e.isBoss) {
        e.aiTimer -= dt;
        if (e.kind === 'charger') {
          if (e.dashTimer > 0) {
            e.dashTimer -= dt;
            var dnx = e.x + e.dashVx * dt, dny = e.y + e.dashVy * dt;
            if (!boxHitsWall(dnx, dny, e.w, e.h)) { e.x = dnx; e.y = dny; }
            else e.dashTimer = 0; // slams into a wall
            chase = 0;
            if (e.dashTimer <= 0) {
              // signature: every dash ends in a radial shield slam
              for (var sl = 0; sl < 8; sl++) {
                var sla = (Math.PI * 2 / 8) * sl + Math.PI / 8;
                game.enemyShots.push({ x: e.x, y: e.y, vx: Math.cos(sla) * 95, vy: Math.sin(sla) * 95 });
              }
              game.shakeTimer = 0.3;
            }
          } else if (e.telegraph > 0) {
            e.telegraph -= dt;
            chase = 0;
            if (e.telegraph <= 0) {
              var da = Math.atan2(edy, edx);
              e.dashVx = Math.cos(da) * 300;
              e.dashVy = Math.sin(da) * 300;
              e.dashTimer = 0.5;
            }
          } else if (e.aiTimer <= 0) {
            e.telegraph = 0.8;
            e.aiTimer = 3.5;
          }
        } else if (e.kind === 'summoner') {
          if (ed < 130) chase = -e.speed;          // keeps its distance
          else if (ed < 170) chase = 0;
          if (e.aiTimer <= 0) {
            e.aiTimer = 4;
            e.volley = !e.volley;
            if (e.volley) {
              // signature: aimed three-bolt soul volley between summons
              var va = Math.atan2(edy, edx);
              for (var vb = -1; vb <= 1; vb++) {
                game.enemyShots.push({
                  x: e.x, y: e.y,
                  vx: Math.cos(va + vb * 0.22) * 115,
                  vy: Math.sin(va + vb * 0.22) * 115
                });
              }
              spawnFloatText(e.x, e.y - 18, 'PERISH!', '#b06ce8');
            } else if (game.enemies.length < 195) {
              for (var sm = 0; sm < 3; sm++) {
                spawnEnemyAt(enemyTypeForWave(game.wave), e.x + rand(-20, 20), e.y + rand(-20, 20));
              }
              spawnFloatText(e.x, e.y - 18, 'RISE!', '#b06ce8');
            }
          }
        } else if (e.kind === 'keeper') {
          // THE VAULT KEEPER: cycles dash / aimed fan / summons; below half
          // HP everything comes faster and the fan widens. Meant to kill
          // careless or underbuilt runs — the gate into the endless waves.
          var enraged = e.hp < e.maxHp * 0.5;
          if (e.dashTimer > 0) {
            e.dashTimer -= dt;
            var knx = e.x + e.dashVx * dt, kny = e.y + e.dashVy * dt;
            if (!boxHitsWall(knx, kny, e.w, e.h)) { e.x = knx; e.y = kny; }
            else e.dashTimer = 0;
            chase = 0;
            if (e.dashTimer <= 0) {
              // every charge detonates into a full ring
              for (var kr = 0; kr < 12; kr++) {
                var kra = (Math.PI * 2 / 12) * kr;
                game.enemyShots.push({ x: e.x, y: e.y, vx: Math.cos(kra) * 100, vy: Math.sin(kra) * 100 });
              }
              game.shakeTimer = 0.35;
            }
          } else if (e.telegraph > 0) {
            e.telegraph -= dt;
            chase = 0;
            if (e.telegraph <= 0) {
              var kda = Math.atan2(edy, edx);
              e.dashVx = Math.cos(kda) * 330;
              e.dashVy = Math.sin(kda) * 330;
              e.dashTimer = 0.55;
            }
          } else if (e.aiTimer <= 0) {
            e.aiTimer = enraged ? 2.2 : 3.2;
            e.phase = ((e.phase || 0) + 1) % 3;
            if (e.phase === 0) {
              e.telegraph = enraged ? 0.55 : 0.75;
            } else if (e.phase === 1) {
              var kfa = Math.atan2(edy, edx);
              var spreadN = enraged ? 3 : 2;
              for (var kf = -spreadN; kf <= spreadN; kf++) {
                game.enemyShots.push({
                  x: e.x, y: e.y,
                  vx: Math.cos(kfa + kf * 0.16) * 130,
                  vy: Math.sin(kfa + kf * 0.16) * 130
                });
              }
              spawnFloatText(e.x, e.y - 26, 'KNEEL!', '#c9a227');
            } else if (game.enemies.length < 195) {
              for (var kg = 0; kg < (enraged ? 4 : 3); kg++) {
                spawnEnemyAt(enemyTypeForWave(game.wave), e.x + rand(-26, 26), e.y + rand(-26, 26));
              }
              spawnFloatText(e.x, e.y - 26, 'GUARD ME!', '#c9a227');
            }
          }
        } else if (e.kind === 'spiral') {
          if (e.aiTimer <= 0) {
            e.aiTimer = 2.5;
            for (var sp = 0; sp < 12; sp++) {
              var spa = (Math.PI * 2 / 12) * sp + game.time;
              game.enemyShots.push({ x: e.x, y: e.y, vx: Math.cos(spa) * 80, vy: Math.sin(spa) * 80 });
            }
          }
          // signature: blink — fades out, then reappears beside the player
          if (e.blinkPhase > 0) {
            e.blinkPhase -= dt;
            chase = 0;
            if (e.blinkPhase <= 0) {
              var ba = rand(0, Math.PI * 2);
              e.x = clamp(p.x + Math.cos(ba) * 75, 20, W - 20);
              e.y = clamp(p.y + Math.sin(ba) * 75, 20, H - 20);
              pushOutOfWalls(e); // ghost, but never rematerialise inside a wall
              spawnDeathParticles(e.x, e.y, e.color);
            }
          } else {
            e.blinkTimer -= dt;
            if (e.blinkTimer <= 0) { e.blinkTimer = 6; e.blinkPhase = 0.7; }
          }
        }
      }

      var slowF = e.slowT > 0 ? (1 - (e.slowAmt || 0.3)) : 1; // frost shots
      // enemies wade through sand mounds too (wraiths float over)
      if (e.type !== 'wraith' && !e.ghost && softAt(e.x, e.y, e.w, e.h)) slowF *= 0.45;
      var mvx = (edx / ed) * chase * slowF + e.kx;
      var mvy = (edy / ed) * chase * slowF + e.ky;
      e.kx *= 0.85; e.ky *= 0.85;

      var ghost = (e.type === 'wraith' || e.ghost); // wraiths + THE REVENANT drift straight through walls
      if (!ghost) {
        // soft repulsion away from any wall within 20px — steering-based
        // avoidance so enemies flow around corners (no pathfinding)
        for (var wi = 0; wi < walls.length; wi++) {
          var wl = walls[wi];
          var wnx = clamp(e.x, wl.x, wl.x + wl.w);
          var wny = clamp(e.y, wl.y, wl.y + wl.h);
          var rdx = e.x - wnx, rdy = e.y - wny;
          var rd = Math.sqrt(rdx * rdx + rdy * rdy);
          if (rd > 0 && rd < 20) {
            var rf = (1 - rd / 20) * 60;
            mvx += (rdx / rd) * rf;
            mvy += (rdy / rd) * rf;
          }
        }
      }

      // axis-separated wall collision (full bounding box, not centre point)
      var enx = e.x + mvx * dt, eny = e.y + mvy * dt;
      if (ghost || !boxHitsWall(enx, eny, e.w, e.h)) {
        e.x = enx; e.y = eny;
      } else if (!boxHitsWall(enx, e.y, e.w, e.h)) {
        e.x = enx;
      } else if (!boxHitsWall(e.x, eny, e.w, e.h)) {
        e.y = eny;
      }
      // both axes blocked: stay put this frame

      // bosses never leave the arena once they're in (shots die at the edge,
      // so an off-screen boss couldn't be hit); they spawn above it, so wait
      if (e.isBoss) {
        if (e.x >= e.w / 2 && e.x <= W - e.w / 2 && e.y >= e.h / 2 && e.y <= H - e.h / 2) e.entered = true;
        if (e.entered) {
          e.x = clamp(e.x, e.w / 2, W - e.w / 2);
          e.y = clamp(e.y, e.h / 2, H - e.h / 2);
        }
      }

      // screen-edge danger countdown (bosses are immune)
      if (!e.isBoss) {
        var nearEdge = (e.x < 10 || e.x > W - 10 || e.y < 10 || e.y > H - 10);
        if (nearEdge) {
          if (!e.atEdge) { e.atEdge = true; e.edgeTimer = 0; }
          e.edgeTimer += dt;
          if (e.edgeTimer >= 1.5) {
            triggerShockwave(e.x, e.y);
            game.enemies.splice(j, 1);
            continue;
          }
        } else {
          e.atEdge = false;
          e.edgeTimer = 0;
        }
      }

      // contact with player (i-frames: damage at most once per 0.5s)
      if (Math.abs(p.x - e.x) < (p.w / 2 + e.w / 2) &&
          Math.abs(p.y - e.y) < (p.h / 2 + e.h / 2)) {
        // knock normal enemies back even during i-frames; boss is immovable
        if (!e.isBoss) {
          var kdx = (e.x - p.x) / ed;
          var kdy = (e.y - p.y) / ed;
          e.kx = kdx * 120;
          e.ky = kdy * 120;
        }
        // retribution: melee hits that land burn the attacker
        if (damagePlayer(e.contact, true) && p.retribution > 0) {
          var thorns = 60 + (p.retribution - 1) * 40;
          e.hp -= thorns;
          addDmg(thorns, 'pact');
          spawnFloatText(e.x, e.y, '' + thorns, '#8b0000');
          e.hitFlash = 0.08;
          if (e.hp <= 0) {
            if (e.isBoss) killBoss(j, e); else killEnemy(j, e);
            continue;
          }
        }
      }
    }
    // a blast kills its neighbours; doing that mid-loop shifted the list
    // under the loop, threw, and froze the game until a refresh
    for (var bl = 0; bl < blasts.length; bl++) explodeBomber(blasts[bl]);

    // ----- cultist projectiles (also frozen by chrono) -----
    for (var es = game.enemyShots.length - 1; es >= 0; es--) {
      var sh = game.enemyShots[es];
      if (game.freezeTimer > 0) break;
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      if (boxHitsWall(sh.x, sh.y, 5, 5)) {
        spawnWallSparks(sh.x, sh.y);
        game.enemyShots.splice(es, 1);
        continue;
      }
      if (Math.abs(sh.x - p.x) < (p.w / 2 + 3) && Math.abs(sh.y - p.y) < (p.h / 2 + 3)) {
        damagePlayer(10, false);
        game.enemyShots.splice(es, 1); // the bolt is spent either way
        continue;
      }
      if (sh.x < -8 || sh.x > W + 8 || sh.y < -8 || sh.y > H + 8) {
        game.enemyShots.splice(es, 1);
      }
    }

    // ----- magma blocks sear anyone pressed against them -----
    game.magmaTick = (game.magmaTick || 0) - dt;
    if (game.magmaTick <= 0) {
      game.magmaTick = 0.5;
      for (var mg = 0; mg < walls.length; mg++) {
        var mw = walls[mg];
        if (!mw.magma) continue;
        if (p.x + p.w / 2 > mw.x - 8 && p.x - p.w / 2 < mw.x + mw.w + 8 &&
            p.y + p.h / 2 > mw.y - 8 && p.y - p.h / 2 < mw.y + mw.h + 8) {
          if (damagePlayer(8, false)) spawnFloatText(p.x, p.y - 10, 'SEARED', '#ff7a2a');
          break;
        }
      }
    }

    // ----- dark pact: kill-explosions queued last tick detonate now -----
    if (game.pactBooms.length) {
      var booms = game.pactBooms;
      game.pactBooms = []; // chained kills queue into the fresh array
      for (var pb = 0; pb < booms.length; pb++) {
        var boom = booms[pb];
        var br = boom.r || 30;
        // a ring the size of the blast and no label (an unlabelled ring read as
        // the red SHOCKWAVE! edge warning); capped, a big chain queues hundreds
        if (game.shockwaves.length < 60) game.shockwaves.push({ x: boom.x, y: boom.y, t: 0.2, color: boom.color || '#9b59b6', label: '', r: br });
        for (var be = game.enemies.length - 1; be >= 0; be--) {
          var bEn = game.enemies[be];
          var bdx = bEn.x - boom.x, bdy = bEn.y - boom.y;
          if (bdx * bdx + bdy * bdy < br * br) {
            bEn.hp -= boom.dmg;
            addDmg(boom.dmg, 'pact');
            bEn.hitFlash = 0.08;
            if (bEn.hp <= 0) {
              if (bEn.isBoss) killBoss(be, bEn); else killEnemy(be, bEn);
            }
          }
        }
      }
    }

    // ----- spike-trap zones: shred and chill whoever stands inside -----
    for (var zn = game.zones.length - 1; zn >= 0; zn--) {
      var z = game.zones[zn];
      z.t -= dt; z.tick -= dt;
      if (z.t <= 0) { game.zones.splice(zn, 1); continue; }
      if (z.tick <= 0) {
        z.tick = 0.5;
        for (var ze = game.enemies.length - 1; ze >= 0; ze--) {
          var zEn = game.enemies[ze];
          var zdx = zEn.x - z.x, zdy = zEn.y - z.y;
          if (zdx * zdx + zdy * zdy < z.r * z.r) {
            zEn.hp -= 25;
            addDmg(25, 'ability');
            chill(zEn, 0.4, 0.8);
            zEn.hitFlash = 0.08;
            if (zEn.hp <= 0) { if (zEn.isBoss) killBoss(ze, zEn); else killEnemy(ze, zEn); }
          }
        }
      }
    }

    // ----- radiant-beam visuals fade -----
    for (var bm = game.beams.length - 1; bm >= 0; bm--) {
      game.beams[bm].t -= dt;
      if (game.beams[bm].t <= 0) game.beams.splice(bm, 1);
    }

    // ----- edge shockwave effects tick -----
    for (var sw = game.shockwaves.length - 1; sw >= 0; sw--) {
      game.shockwaves[sw].t += dt;
      if (game.shockwaves[sw].t >= 0.6) game.shockwaves.splice(sw, 1);
    }

    // ----- floating combat text -----
    for (var ft = game.floatTexts.length - 1; ft >= 0; ft--) {
      var f = game.floatTexts[ft];
      f.t += dt;
      f.y -= 24 * dt;
      if (f.t >= f.life) game.floatTexts.splice(ft, 1);
    }

    // ----- pickups: expire and collect -----
    for (var pk = game.pickups.length - 1; pk >= 0; pk--) {
      var pu = game.pickups[pk];
      pu.t -= dt;
      if (pu.t <= 0) { game.pickups.splice(pk, 1); continue; }
      var pdx = pu.x - p.x, pdy = pu.y - p.y;
      if (pdx * pdx + pdy * pdy < 12 * 12) {
        collectPickup(pu);
        game.pickups.splice(pk, 1);
      }
    }

    // ----- projectile vs enemy collisions -----
    for (var pi = game.projectiles.length - 1; pi >= 0; pi--) {
      var proj = game.projectiles[pi];
      var removed = false;
      for (var ei = game.enemies.length - 1; ei >= 0; ei--) {
        var en = game.enemies[ei];
        if (proj.hitSet.indexOf(en) !== -1) continue;
        // heavy shot stacks and fat shotgun pellets widen the hitbox
        var pad = 3 + p.projSize * 2 + (proj.fat ? 2 : 0);
        if (Math.abs(proj.x - en.x) < (en.w / 2 + pad) &&
            Math.abs(proj.y - en.y) < (en.h / 2 + pad)) {
          en.hp -= proj.damage;
          addDmg(proj.damage, 'shot');
          spawnFloatText(en.x, en.y, '' + Math.round(proj.damage), proj.crit ? '#ff9f1c' : '#ffe600');
          en.hitFlash = 0.08;
          // shotgun pellets shove non-boss enemies back
          if (proj.kb && !en.isBoss) {
            var kbLen = Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy) || 1;
            en.kx = (proj.vx / kbLen) * 140;
            en.ky = (proj.vy / kbLen) * 140;
          }
          // frost shots chill whatever they hit
          if (p.frost > 0) {
            chill(en, Math.min(0.6, 0.3 + (p.frost - 1) * 0.15), 1.0);
          }
          proj.hitSet.push(en);
          if (en.hp <= 0) {
            if (en.isBoss) killBoss(ei, en); else killEnemy(ei, en);
          }
          if (proj.pierce > 0) {
            proj.pierce--;
          } else if (proj.bounces > 0) {
            // ricochet: retarget the nearest unhit enemy within 120px
            var bTarget = null, bDist = 120 * 120;
            for (var bi2 = 0; bi2 < game.enemies.length; bi2++) {
              var cand = game.enemies[bi2];
              if (proj.hitSet.indexOf(cand) !== -1) continue;
              var bdx = cand.x - proj.x, bdy = cand.y - proj.y;
              var bd2 = bdx * bdx + bdy * bdy;
              if (bd2 < bDist) { bDist = bd2; bTarget = cand; }
            }
            if (bTarget) {
              proj.bounces--;
              var bAng = Math.atan2(bTarget.y - proj.y, bTarget.x - proj.x);
              var bSpd = Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy);
              proj.vx = Math.cos(bAng) * bSpd;
              proj.vy = Math.sin(bAng) * bSpd;
            } else {
              game.projectiles.splice(pi, 1);
              removed = true;
              break;
            }
          } else {
            game.projectiles.splice(pi, 1);
            removed = true;
            break;
          }
        }
      }
      if (removed) continue;
    }

    // ----- orbiting shield orbs -----
    if (p.orbs && p.orbs.length) {
      for (var oi = 0; oi < p.orbs.length; oi++) {
        var orb = p.orbs[oi];
        orb.angle += p.orbSpeed * dt;
        // forget expired per-monster cooldowns now and then (the map grew by
        // one entry per monster ever touched, for the whole run)
        orb.pruneT = (orb.pruneT || 0) + dt;
        if (orb.pruneT > 2) {
          orb.pruneT = 0;
          for (var hk in orb.hitCd) if (orb.hitCd[hk] < game.time) delete orb.hitCd[hk];
        }
        orb.x = p.x + Math.cos(orb.angle) * p.orbRadius;
        orb.y = p.y + Math.sin(orb.angle) * p.orbRadius;
        // collide with enemies (descending so splices are safe)
        for (var oe = game.enemies.length - 1; oe >= 0; oe--) {
          var oen = game.enemies[oe];
          var rr = oen.w / 2 + 10;
          var odx = orb.x - oen.x, ody = orb.y - oen.y;
          if (odx * odx + ody * ody < rr * rr) {
            var until = orb.hitCd[oen.uid] || 0;
            if (game.time >= until) {
              var orbDmg = p.bladeOrbit ? 40 : 15;
              oen.hp -= orbDmg;
              addDmg(orbDmg, 'orb');
              spawnFloatText(oen.x, oen.y, '' + orbDmg, '#00e5ff');
              oen.hitFlash = 0.08;
              orb.hitCd[oen.uid] = game.time + 0.3; // per-orb, per-enemy cooldown
              if (oen.hp <= 0) {
                if (oen.isBoss) killBoss(oe, oen); else killEnemy(oe, oen);
              }
            }
          }
        }
      }
    }

    // ----- update particles -----
    for (var pa = game.particles.length - 1; pa >= 0; pa--) {
      var part = game.particles[pa];
      part.life -= dt;
      if (part.life <= 0) { game.particles.splice(pa, 1); continue; }
      part.x += part.vx * dt;
      part.y += part.vy * dt;
      part.vx *= 0.92; part.vy *= 0.92;
    }

    // ----- wave completion (normal waves; boss waves end on boss death) -----
    // only from live play: the clearing kill can also open a level-up or end
    // the run, and starting the next wave here wiped that draft or game over
    if (!game.bossWave && game.waveKills >= game.waveTarget && game.gameState === 'playing') {
      beginWave(game.wave + 1);
    }
  }

  function killEnemy(index, en) {
    // the run already ended this frame and was saved: a kill now would show
    // on the results screen but never reach the save or the leaderboard
    if (game.gameState === 'gameover') { game.enemies.splice(index, 1); return; }
    spawnDeathParticles(en.x, en.y, en.color);
    var p = game.player;
    gainXP((en.xpVal || en.maxHp / 5) * p.xpMult);
    if (p.vampire > 0) {
      // v0.8: lifesteal is budgeted per second (10 + 2/stack) — kills/sec
      // no longer scale healing without limit, which was the immortality loop
      var vHeal = Math.min(p.vampire * p.healMult, p.vampBudget || 0);
      if (vHeal > 0) {
        p.vampBudget -= vHeal;
        p.hp = Math.min(p.maxHp, p.hp + vHeal);
      }
    }
    game.score++;
    game.waveKills++;
    game.coinsEarned += (1 + Math.floor(game.wave / 5)) * (1 + 0.25 * tomeLevel('frt')) * p.coinMult;
    // a tiny punch on a kill, at most every 0.25s: on every kill, chain kills
    // froze the whole game (two dead frames per kill frame)
    if (!(game.time - game.lastHitStop < 0.25)) {
      game.hitStop = Math.max(game.hitStop, 0.03);
      game.lastHitStop = game.time;
    }
    maybeDropPickup(en.x, en.y);
    // dark pact: kills detonate (queued — resolved next tick so we never
    // recurse into the enemies array mid-splice)
    if (p.pactLvl > 0 && !en.isBoss) {
      game.pactBooms.push({ x: en.x, y: en.y, dmg: 30 + (p.pactLvl - 1) * 15 });
    }
    // BOMBARDIER: every kill detonates a chunky AoE — the whole class fantasy,
    // and it chains (each blast-kill queues its own boom next tick)
    var kb = classDef(currentClass).killBoom;
    if (kb && !en.isBoss) {
      game.pactBooms.push({ x: en.x, y: en.y, dmg: kb.dmg,
        r: kb.radius * (p.boomRadiusMult || 1), color: '#ff7a2a' });
      if (p.chainBonus) { // CHAIN REACTOR passive: a second, wider ring
        game.pactBooms.push({ x: en.x, y: en.y, dmg: Math.round(kb.dmg * 0.6),
          r: kb.radius * (p.boomRadiusMult || 1) * 1.5, color: '#ffb03a' });
      }
    }
    game.enemies.splice(index, 1);
    // splitters burst into two fast minis
    if (en.type === 'splitter' && game.enemies.length < 198) {
      spawnEnemyAt('mini', en.x - 6, en.y);
      spawnEnemyAt('mini', en.x + 6, en.y);
    }
  }

  // Bomber self-destruct: hurts the player AND other enemies caught in it.
  // The caller has already taken the bomber out of game.enemies.
  function explodeBomber(e) {
    game.shockwaves.push({ x: e.x, y: e.y, t: 0, color: '#ff9f1c', label: 'BOOM!' });
    game.shakeTimer = 0.25;
    var p = game.player;
    var dx = p.x - e.x, dy = p.y - e.y;
    if (dx * dx + dy * dy < 50 * 50) {
      damagePlayer(25, false);
    }
    for (var i = game.enemies.length - 1; i >= 0; i--) {
      var o = game.enemies[i];
      var ox = o.x - e.x, oy = o.y - e.y;
      if (ox * ox + oy * oy < 50 * 50) {
        o.hp -= 40;
        o.hitFlash = 0.1;
        addDmg(40, 'other');
        if (o.hp <= 0) {
          if (o.isBoss) killBoss(i, o); else killEnemy(i, o);
        }
      }
    }
    spawnDeathParticles(e.x, e.y, '#ff9f1c');
  }

  // ---------------------------------------------------------------------------
  // PICKUPS — potions heal, bombs clear, frenzy doubles fire rate briefly
  // ---------------------------------------------------------------------------
  function maybeDropPickup(x, y) {
    if (game.pickups.length >= 6) return;
    var roll = Math.random();
    // lucky charm: each stack halves the roll = doubles every drop chance
    roll /= Math.pow(2, game.player.lucky || 0);
    var type = null;
    if (roll < 0.04) type = 'potion';
    else if (roll < 0.055) type = 'bomb';
    else if (roll < 0.07) type = 'frenzy';
    else if (roll < 0.085) type = 'barrier';
    else if (roll < 0.095) type = 'chrono';
    if (!type) return;
    game.pickups.push({ x: x, y: y, type: type, t: 8 });
  }

  function collectPickup(pk) {
    var p = game.player;
    playPickup();
    if (pk.type === 'potion') {
      var heal = Math.min(Math.round(25 * p.healMult), p.maxHp - p.hp);
      p.hp += heal;
      spawnFloatText(p.x, p.y, '+' + Math.round(heal), '#33ff66');
    } else if (pk.type === 'barrier') {
      p.barrier = 3;
      spawnFloatText(p.x, p.y, 'BARRIER!', '#00e5ff');
    } else if (pk.type === 'chrono') {
      game.freezeTimer = 2.5;
      spawnFloatText(p.x, p.y, 'TIME FREEZE!', '#8fd8ff');
    } else if (pk.type === 'bomb') {
      game.whiteFlash = 0.05;
      game.shakeTimer = 0.4;
      for (var i = game.enemies.length - 1; i >= 0; i--) {
        var e = game.enemies[i];
        e.hp -= 60;
        e.hitFlash = 0.1;
        addDmg(60, 'bomb');
        spawnFloatText(e.x, e.y, '60', '#ff9f1c');
        if (e.hp <= 0) {
          if (e.isBoss) killBoss(i, e); else killEnemy(i, e);
        }
      }
    } else if (pk.type === 'frenzy') {
      p.frenzyTimer = 5;
      spawnFloatText(p.x, p.y, 'FRENZY!', '#ffe600');
    }
  }

  function killBoss(index, en) {
    if (game.gameState === 'gameover') { game.enemies.splice(index, 1); game.boss = null; return; }
    game.lastBossName = en.name || 'THE BOSS';
    bossExplosion(en.x, en.y);
    if (en.name) spawnFloatText(en.x, en.y - 22, en.name + ' SLAIN', en.color);
    playBossDeath();
    game.coinsEarned += 25 * (1 + 0.25 * tomeLevel('frt')) * game.player.coinMult;
    game.whiteFlash = 0.05;       // flash white for ~3 frames at 60Hz
    game.shakeTimer = 0.5;
    game.hitStop = 0.2;           // dramatic freeze-frame
    game.score++;
    game.enemies.splice(index, 1);
    game.boss = null;
    // first boss grants the ascendancy draft; later bosses a normal level-up.
    game.advanceAfterLevel = true;
    if (!game.player.ascendancy) {
      triggerAscend();
    } else {
      gainXP(xpForNext() - game.xp + 1); // guarantees exactly one level-up
    }
  }

  // Single entry point for anything that hurts the player: respects i-frames
  // and barrier charges, handles death.
  function damagePlayer(amount, shake) {
    var p = game.player;
    if (p.invuln > 0) return;
    if (p.barrier > 0) {
      p.barrier--;
      p.invuln = 0.4;
      spawnFloatText(p.x, p.y - 10, 'BLOCKED', '#00e5ff');
      playPickup();
      return;
    }
    // warriors shrug off 15% of all incoming damage (innate armor);
    // iron skin stacks and the juggernaut ascendancy multiply on top
    if (currentClass === 'warrior') amount = amount * 0.85;
    if (p.ascendDR > 0) amount = amount * (1 - p.ascendDR);
    if (p.armor > 0) amount = amount * (1 - p.armor);
    amount = Math.max(1, Math.round(amount));
    p.hp -= amount;
    p.invuln = 0.5;
    game.damageFlash = 0.1;
    if (shake) game.shakeTimer = 0.3;
    playHit();
    if (p.hp <= 0) {
      p.hp = 0;
      endRun();
    }
    return true; // a real hit landed (callers use this for retribution)
  }

  // An enemy survived 1.5s at a screen edge: detonate it.
  function triggerShockwave(x, y) {
    game.shockwaves.push({ x: x, y: y, t: 0 });
    var p = game.player;
    var dx = p.x - x, dy = p.y - y;
    if (dx * dx + dy * dy < 120 * 120) {
      damagePlayer(20, true);
    }
  }

  // The only place persistent records are written — never mid-run.
  function endRun() {
    if (game.gameState === 'gameover') return;
    game.gameState = 'gameover';
    game.overLock = 0.8;
    game.shakeTimer = 0;   // don't freeze a mid-shake frame into the results backdrop
    gameOverBg = null;
    game.newRecord = false;
    if (game.wave > runData.bestWave) { runData.bestWave = game.wave; game.newRecord = true; }
    if (game.score > runData.bestKills) { runData.bestKills = game.score; game.newRecord = true; }
    if (game.level > runData.bestLevel) { runData.bestLevel = game.level; game.newRecord = true; }
    runData.totalRuns++;
    runData.totalKills += game.score;
    earnCoins(Math.round(game.coinsEarned));
    saveRunData();
    syncProgressUp(); // push immediately — a closed tab must not lose the run
    submitScore();
    setMusicTrack('lobby'); // back to the mellow menu loop
  }

  // ---------------------------------------------------------------------------
  // RENDER HELPERS
  // ---------------------------------------------------------------------------
  function text(str, x, y, size, color, align) {
    ctx.font = size + 'px "Press Start 2P", monospace';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    // 1px black shadow
    ctx.fillStyle = '#000';
    ctx.fillText(str, x + 1, y + 1);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function pad(num, len) {
    var s = '' + num;
    while (s.length < len) s = '0' + s;
    return s;
  }

  // ---------------------------------------------------------------------------
  // RENDER WORLD
  // ---------------------------------------------------------------------------
  function drawFloor() {
    var useSheet = !useProceduralSprites && sheetReady;
    var B = currentBiome();
    for (var i = 0; i < floorTiles.length; i++) {
      var t = floorTiles[i];
      if (useSheet) {
        var tile = t.variant === 2 ? TILE.floorAlt : (t.variant === 1 ? TILE.wall : TILE.floor);
        drawTile(tile, t.x, t.y, TILE_SIZE, TILE_SIZE, false);
        if (t.variant === 1) {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(t.x, t.y, TILE_SIZE, TILE_SIZE);
        }
      } else {
        var sh = t.shade;
        if (t.variant === 1) sh = Math.floor(sh * 0.5);
        else if (t.variant === 2) sh = sh + 10;
        ctx.fillStyle = 'rgb(' + sh + ',' + sh + ',' + (sh + 6) + ')';
        ctx.fillRect(t.x, t.y, TILE_SIZE, TILE_SIZE);
        // subtle grid lines
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(t.x, t.y, TILE_SIZE, 1);
        ctx.fillRect(t.x, t.y, 1, TILE_SIZE);
      }
    }
    // biome palette wash over the whole floor (walls draw on top, unaffected)
    if (B.tint) {
      ctx.fillStyle = B.tint;
      ctx.fillRect(0, 0, W, H);
    }
    // sparse biome texture specks (embers/ice glints/pebbles), deterministic
    // per tile so they don't shimmer frame to frame
    if (B.speck) {
      ctx.fillStyle = B.speck;
      for (var s = 0; s < floorTiles.length; s++) {
        var ft = floorTiles[s];
        if (ft.shade % 6 === 0 && ft.variant === 0) {
          ctx.fillRect(ft.x + (ft.shade % 13), ft.y + (ft.shade % 11), 2, 2);
        }
      }
    }
  }

  function drawWalls() {
    // NOTE: the sheet tile at (0,144) is the slime sprite in this packing, so
    // walls always use the boxy procedural style to stay visually distinct.
    var B = currentBiome();
    for (var i = 0; i < walls.length; i++) {
      var wl = walls[i];
      if (wl.soft) {
        // sand mound: pale, round-shouldered, borderless — reads passable
        ctx.fillStyle = 'rgba(214,178,110,0.75)';
        ctx.fillRect(wl.x + 1, wl.y + 1, wl.w - 2, wl.h - 2);
        ctx.fillStyle = 'rgba(240,210,150,0.8)';
        ctx.fillRect(wl.x + 3, wl.y + 2, wl.w - 6, 3);
        ctx.fillStyle = 'rgba(120,90,50,0.5)';
        for (var sd = 0; sd < 6; sd++) {
          ctx.fillRect(wl.x + 3 + ((sd * 11 + wl.x) % Math.max(1, wl.w - 6)),
                       wl.y + 5 + ((sd * 7 + wl.y) % Math.max(1, wl.h - 8)), 2, 2);
        }
        continue;
      }
      ctx.fillStyle = wl.tileVariant === 1 ? B.wallAlt : B.wallFill;
      ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
      // 1px border
      ctx.fillStyle = B.wallBorder;
      ctx.fillRect(wl.x, wl.y, wl.w, 1);
      ctx.fillRect(wl.x, wl.y + wl.h - 1, wl.w, 1);
      ctx.fillRect(wl.x, wl.y, 1, wl.h);
      ctx.fillRect(wl.x + wl.w - 1, wl.y, 1, wl.h);
      // inner shadow along top/left for 8-bit depth
      ctx.fillStyle = B.wallShadow;
      ctx.fillRect(wl.x + 1, wl.y + 1, wl.w - 2, 1);
      ctx.fillRect(wl.x + 1, wl.y + 1, 1, wl.h - 2);
      // per-biome texture pass (details are deterministic per 16px cell so
      // nothing shimmers frame to frame; only inferno veins animate)
      if (B.texture === 'strata') {
        // horizontal sandstone strata instead of block seams
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        for (var st = 6; st < wl.h; st += 6) ctx.fillRect(wl.x + 1, wl.y + st, wl.w - 2, 1);
      } else if (B.texture === 'ice') {
        // faint seams + diagonal cracks + white glints
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        for (var ix = 16; ix < wl.w; ix += 16) ctx.fillRect(wl.x + ix, wl.y, 1, wl.h);
        for (var iy = 16; iy < wl.h; iy += 16) ctx.fillRect(wl.x, wl.y + iy, wl.w, 1);
        for (var cy2 = 0; cy2 + 16 <= wl.h; cy2 += 16) {
          for (var cx2 = 0; cx2 + 16 <= wl.w; cx2 += 16) {
            var ih = ((wl.x + cx2) * 7 + (wl.y + cy2) * 13) % 5;
            if (ih === 0) {
              ctx.fillStyle = 'rgba(220,240,255,0.35)';
              for (var dstep = 0; dstep < 4; dstep++) {
                ctx.fillRect(wl.x + cx2 + 4 + dstep * 2, wl.y + cy2 + 4 + dstep * 2, 2, 1);
              }
            } else if (ih === 2) {
              ctx.fillStyle = 'rgba(255,255,255,0.5)';
              ctx.fillRect(wl.x + cx2 + 10, wl.y + cy2 + 6, 2, 2);
            }
          }
        }
      } else if (B.texture === 'ember') {
        // deep seams (the pulsing molten veins draw live in drawEmberVeins)
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (var ex = 16; ex < wl.w; ex += 16) ctx.fillRect(wl.x + ex, wl.y, 1, wl.h);
        for (var ey = 16; ey < wl.h; ey += 16) ctx.fillRect(wl.x, wl.y + ey, wl.w, 1);
      } else if (B.texture === 'vault') {
        // gilded strongbox panels: deep seams with gold studs at the joints
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for (var gx = 16; gx < wl.w; gx += 16) ctx.fillRect(wl.x + gx, wl.y, 1, wl.h);
        for (var gy = 16; gy < wl.h; gy += 16) ctx.fillRect(wl.x, wl.y + gy, wl.w, 1);
        ctx.fillStyle = '#c9a227';
        for (var jy = 0; jy <= wl.h; jy += 16) {
          for (var jx = 0; jx <= wl.w; jx += 16) {
            ctx.fillRect(wl.x + Math.min(jx, wl.w - 2) + (jx ? -1 : 1), wl.y + Math.min(jy, wl.h - 2) + (jy ? -1 : 1), 2, 2);
          }
        }
      } else {
        // catacombs brick: 16px seams so big chunks read as tiled blocks
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        for (var sx2 = 16; sx2 < wl.w; sx2 += 16) ctx.fillRect(wl.x + sx2, wl.y, 1, wl.h);
        for (var sy2 = 16; sy2 < wl.h; sy2 += 16) ctx.fillRect(wl.x, wl.y + sy2, wl.w, 1);
      }
      // magma: searing orange rim so the danger reads before it burns
      if (wl.magma) {
        ctx.fillStyle = 'rgba(255,110,30,0.8)';
        ctx.fillRect(wl.x - 1, wl.y - 1, wl.w + 2, 1);
        ctx.fillRect(wl.x - 1, wl.y + wl.h, wl.w + 2, 1);
        ctx.fillRect(wl.x - 1, wl.y - 1, 1, wl.h + 2);
        ctx.fillRect(wl.x + wl.w, wl.y - 1, 1, wl.h + 2);
      }
      // gilded: a treasure glint marks the loot blocks
      if (wl.kind === 'gilded') {
        ctx.fillStyle = '#ffe08a';
        ctx.fillRect(wl.x + 3, wl.y + 3, 3, 2);
        ctx.fillRect(wl.x + 4, wl.y + 2, 1, 4);
      }
      // ice: frosty top sheen
      if (wl.kind === 'ice') {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(wl.x + 2, wl.y + 2, wl.w - 4, 2);
      }
      // breakable blocks wear a chipped face; cracks deepen per hit taken
      if (wl.breakable) {
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(wl.x + 2, wl.y + 2, 4, 1);
        ctx.fillRect(wl.x + 2, wl.y + 2, 1, 3);
        var dmg = (wl.bhpMax || 3) - (wl.bhp || 0); // hits taken (fresh ice showed 4 cracks)
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        for (var ck = 0; ck <= dmg * 3; ck++) {
          var ckx = wl.x + 2 + ((ck * 7 + wl.x) % Math.max(1, wl.w - 6));
          var cky = wl.y + 3 + ((ck * 11 + wl.y) % Math.max(1, wl.h - 8));
          ctx.fillRect(ckx, cky, 2, 4);
          ctx.fillRect(ckx - 2, cky + 3, 2, 2);
        }
      }
    }
  }

  // Inferno's animated molten veins — the only time-varying part of the
  // background, drawn live over the cached floor+walls image.
  function drawEmberVeins() {
    for (var i = 0; i < walls.length; i++) {
      var wl = walls[i];
      for (var vy = 0; vy + 16 <= wl.h; vy += 16) {
        for (var vx = 0; vx + 16 <= wl.w; vx += 16) {
          if (((wl.x + vx) * 7 + (wl.y + vy) * 13) % 3 === 1) {
            var glow = 0.65 + 0.3 * Math.sin(game.time * 3 + vx + vy);
            ctx.fillStyle = 'rgba(255,100,30,' + glow.toFixed(2) + ')';
            ctx.fillRect(wl.x + vx + 3, wl.y + vy + 9, 7, 2);
            ctx.fillRect(wl.x + vx + 8, wl.y + vy + 5, 2, 4);
          }
        }
      }
    }
  }

  // The floor and walls are static for a whole wave, so they render once
  // into an offscreen canvas; every frame then pays a single drawImage
  // instead of ~600 rects. Rebuilt on wave changes (and when the sprite
  // sheet finishes loading, since the floor uses it).
  var bgCache = document.createElement('canvas');
  bgCache.width = W; bgCache.height = H;
  var bgDirty = true;
  var bgUsedSheet = null;

  function drawBackground() {
    var useSheet = !useProceduralSprites && sheetReady;
    if (bgDirty || bgUsedSheet !== useSheet) {
      var old = ctx;
      ctx = bgCache.getContext('2d');
      // finally: if a draw here threw, every later frame would go into the
      // cache instead of the screen
      try {
        ctx.clearRect(0, 0, W, H);
        drawFloor();
        drawWalls();
      } finally { ctx = old; }
      bgDirty = false;
      bgUsedSheet = useSheet;
    }
    ctx.drawImage(bgCache, 0, 0);
    if (currentBiome().texture === 'ember') drawEmberVeins();
  }

  function drawPickups() {
    for (var i = 0; i < game.pickups.length; i++) {
      var pk = game.pickups[i];
      // blink during the last 2 seconds before despawning
      if (pk.t < 2 && Math.floor(pk.t * 6) % 2 === 0) continue;
      var x = Math.round(pk.x), y = Math.round(pk.y);
      if (pk.type === 'potion') {
        // classic red healing potion: pops against every biome floor
        ctx.fillStyle = '#8a5a2b';
        ctx.fillRect(x - 2, y - 9, 4, 2);        // cork
        ctx.fillStyle = '#dddddd';
        ctx.fillRect(x - 2, y - 7, 4, 3);        // glass neck
        ctx.fillStyle = '#ff2d2d';
        ctx.fillRect(x - 4, y - 4, 8, 8);        // round flask body
        ctx.fillRect(x - 5, y - 2, 10, 5);       // bulge
        ctx.fillStyle = '#ff9a9a';
        ctx.fillRect(x - 3, y - 3, 2, 3);        // shine
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - 3, y - 3, 1, 1);        // glint
      } else if (pk.type === 'bomb') {
        ctx.fillStyle = '#222233';
        ctx.fillRect(x - 5, y - 4, 10, 9);
        ctx.fillStyle = '#555566';
        ctx.fillRect(x - 4, y - 3, 3, 3);
        ctx.fillStyle = '#ff9f1c';
        ctx.fillRect(x + 2, y - 7, 2, 3);        // lit fuse
      } else if (pk.type === 'frenzy') {
        ctx.fillStyle = '#ffe600';
        ctx.fillRect(x - 1, y - 7, 3, 6);        // lightning bolt
        ctx.fillRect(x - 3, y - 2, 5, 3);
        ctx.fillRect(x, y + 1, 3, 6);
      } else if (pk.type === 'barrier') {
        ctx.strokeStyle = '#00e5ff';             // shield bubble
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(x - 2, y - 2, 4, 4);
      } else if (pk.type === 'chrono') {
        ctx.fillStyle = '#ffffff';               // clock face
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#223344';
        ctx.fillRect(x, y - 4, 1, 4);            // hands
        ctx.fillRect(x, y, 3, 1);
      }
    }
  }

  function drawFloatTexts() {
    for (var i = 0; i < game.floatTexts.length; i++) {
      var f = game.floatTexts[i];
      ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
      text(f.txt, f.x, f.y, 6, f.color, 'center');
      ctx.globalAlpha = 1;
    }
  }

  // Pulsing warning rings on edge enemies + expanding shockwave rings.
  function drawEdgeEffects() {
    for (var i = 0; i < game.enemies.length; i++) {
      var e = game.enemies[i];
      if (e.atEdge) {
        var r = 16 + Math.sin(game.time * Math.PI * 4) * 4; // 12..20px, 0.5s cycle
        ctx.strokeStyle = 'rgba(255,45,45,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    for (var s = 0; s < game.shockwaves.length; s++) {
      var sw = game.shockwaves[s];
      if (sw.t < 0.4) {
        var prog = sw.t / 0.4;
        ctx.strokeStyle = sw.color || '#ff4444';
        ctx.globalAlpha = 0.8 * (1 - prog);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, prog * (sw.r || (sw.label === 'BOOM!' ? 50 : 80)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (sw.label !== '') {
        ctx.globalAlpha = Math.max(0, 1 - sw.t / 0.6);
        text(sw.label || 'SHOCKWAVE!', sw.x, sw.y - 24, 8, sw.color || '#ff2d2d', 'center');
        ctx.globalAlpha = 1;
      }
    }
  }

  // Permanent red strips along all four edges: the edges are dangerous.
  function drawEdgeTint() {
    ctx.fillStyle = 'rgba(255,0,0,0.15)';
    ctx.fillRect(0, 0, W, 4);
    ctx.fillRect(0, H - 4, W, 4);
    ctx.fillRect(0, 4, 4, H - 8);
    ctx.fillRect(W - 4, 4, 4, H - 8);
  }

  // THE BOMBARDIER: no sheet sprite, so drawn procedurally at any position and
  // scale — a stout helmeted sapper in an orange vest cradling a fuse-lit bomb.
  // Reused by the player, the class-select card, and the wardrobe preview.
  function drawBombardierAt(cx, cy, u, f, vest) {
    function R(ox, oy, w, h, col) {
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(cx + ox * u), Math.round(cy + oy * u), Math.ceil(w * u), Math.ceil(h * u));
    }
    R(-4, 5, 3, 3, '#3a2a20'); R(1, 5, 3, 3, '#3a2a20');       // legs
    R(-5, -3, 10, 9, vest);                                     // vest / body
    R(-5, -3, 10, 2, 'rgba(0,0,0,0.28)');                       // vest shade
    R(-4, -2, 2, 8, '#5a3a20');                                 // bandolier strap
    R(-5, -8, 10, 5, '#2a2a35');                                // helmet
    R(-5, -8, 10, 1, '#454555');                                // helmet rim
    R(f > 0 ? 1 : -3, -6, 2, 2, '#ffe08a');                     // goggle eye
    var bx = f * 6;                                             // bomb out front
    R(bx - 2, 1, 5, 5, '#1a1a22');
    R(bx - 1, 2, 2, 2, '#3a3a48');
    R(bx + f, -1, 1, 2, '#ff9f1c');                             // fuse
    if (game.time % 0.4 < 0.2) R(bx + f, -2, 1, 1, '#ffe600');  // spark
  }

  function bombardierVest() {
    var s = skinById('bombardier', equippedSkinId('bombardier'));
    return s && s.chroma ? chromaColor() : (s && s.tint ? s.tint : '#ff8c1a');
  }

  function drawBombardierSprite(p, bob) {
    drawBombardierAt(Math.round(p.x), Math.round(p.y) + bob, 1, p.facing, bombardierVest());
  }

  function drawPlayer() {
    var p = game.player;
    // blink while invulnerable so the i-frames read clearly
    if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) return;
    var dx = Math.round(p.x - 8);
    var dy = Math.round(p.y - 8);
    var bob = (p.moving && Math.floor(p.walkAnim) % 2 === 0) ? -1 : 0;
    // equipped hero skin: reskins the actual sprite (no obstructing aura)
    var skin = skinById(currentClass, equippedSkinId(currentClass));
    var tint = skin && skin.chroma ? chromaColor() : (skin ? skin.tint : null);
    var tile = classDef(currentClass).tile;
    var drew;
    if (currentClass === 'bombardier') {
      drawBombardierSprite(p, bob);
      drew = true;
    } else if (tint) {
      // epic skins get a tight 1px chroma glow that hugs the sprite (not a
      // ring): behind it, 1px out on every side
      if (skin.chroma) {
        ctx.globalAlpha = 0.25 + 0.15 * Math.sin(game.time * 6);
        drawTintedTile(tile, dx - 1, dy - 1 + bob, 18, 18, p.facing === -1, tint, 1);
        ctx.globalAlpha = 1;
      }
      drew = drawTintedTile(tile, dx, dy + bob, 16, 16, p.facing === -1, tint, skin.chroma ? 0.62 : 0.5);
    } else {
      drew = drawTile(tile, dx, dy + bob, 16, 16, p.facing === -1);
    }
    if (!drew) {
      // procedural: body uses the skin tint if any, else white
      ctx.fillStyle = tint || '#fff';
      ctx.fillRect(Math.round(p.x - 6), Math.round(p.y - 8) + bob, 12, 16);
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(Math.round(p.x - 2), Math.round(p.y - 8) + bob, 4, 4);
      // a little eye to show facing
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.round(p.x - 2 + (p.facing === 1 ? 2 : 0)), Math.round(p.y - 2) + bob, 2, 2);
    }
    // class-coloured marker under the hero
    ctx.fillStyle = classDef(currentClass).color;
    ctx.fillRect(Math.round(p.x - 6), Math.round(p.y + 9), 12, 2);
    // frenzy aura
    if (p.frenzyTimer > 0) {
      ctx.strokeStyle = 'rgba(255,230,0,' + (0.3 + 0.3 * Math.abs(Math.sin(game.time * 10))) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);
      ctx.stroke();
    }
    // barrier bubble (one notch fades per charge)
    if (p.barrier > 0) {
      ctx.strokeStyle = 'rgba(0,229,255,' + (0.25 + 0.15 * p.barrier) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawEnemyHpBar(e) {
    var bx = Math.round(e.x - 8), by = Math.round(e.y - 13);
    ctx.fillStyle = '#000';
    ctx.fillRect(bx - 1, by - 1, 18, 5);
    ctx.fillStyle = '#3a0000';
    ctx.fillRect(bx, by, 16, 3);
    ctx.fillStyle = e.elite ? '#FFD700' : '#ff2d2d';
    ctx.fillRect(bx, by, Math.round(16 * clamp(e.hp / e.maxHp, 0, 1)), 3);
  }

  // Cultists are always drawn procedurally — a hooded purple figure that
  // reads as "different" next to the spritesheet enemies.
  function drawCultist(e) {
    var col = e.hitFlash > 0 ? '#fff' : '#5b2c8e';
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(e.x - 6), Math.round(e.y - 4), 12, 11);   // robe
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#7d3cc8';
    ctx.fillRect(Math.round(e.x - 4), Math.round(e.y - 8), 8, 6);     // hood
    ctx.fillStyle = '#ff44aa';
    ctx.fillRect(Math.round(e.x - 3), Math.round(e.y - 5), 2, 2);     // glowing eyes
    ctx.fillRect(Math.round(e.x + 1), Math.round(e.y - 5), 2, 2);
  }

  function drawEnemy(e) {
    if (e.isBoss) { drawBoss(e); return; }
    var dx = Math.round(e.x - 8);
    var dy = Math.round(e.y - 8);
    // elite aura: pulsing gold ring behind the sprite
    if (e.elite) {
      ctx.strokeStyle = 'rgba(255,215,0,' + (0.5 + 0.3 * Math.sin(game.time * 6 + e.animPhase)) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.w / 2 + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (e.type === 'wraith') {
      ctx.globalAlpha = 0.65 + 0.2 * Math.sin(game.time * 5 + e.animPhase);
      var wdrew = drawTile(e.tile, dx, dy, 16, 16, false);
      if (!wdrew) {
        ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#ccccff';
        ctx.fillRect(Math.round(e.x - 6), Math.round(e.y - 7), 12, 12);
        ctx.fillRect(Math.round(e.x - 7), Math.round(e.y + 3), 3, 3);
        ctx.fillRect(Math.round(e.x + 4), Math.round(e.y + 3), 3, 3);
        ctx.fillStyle = '#222244';
        ctx.fillRect(Math.round(e.x - 4), Math.round(e.y - 4), 2, 3);
        ctx.fillRect(Math.round(e.x + 2), Math.round(e.y - 4), 2, 3);
      } else if (e.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(dx, dy, 16, 16);
      }
      ctx.globalAlpha = 1;
      drawEnemyHpBar(e);
      return;
    }
    if (e.type === 'bomber') {
      // round dark bomb-creature; flashes white-orange while fusing
      var fusing = e.fuse >= 0;
      var flash = fusing && Math.floor(e.fuse * 10) % 2 === 0;
      ctx.fillStyle = e.hitFlash > 0 || flash ? '#ffffff' : '#552211';
      ctx.fillRect(Math.round(e.x - 6), Math.round(e.y - 5), 12, 11);
      ctx.fillStyle = flash ? '#ff9f1c' : '#ff7733';
      ctx.fillRect(Math.round(e.x - 4), Math.round(e.y - 3), 8, 7);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.round(e.x - 3), Math.round(e.y - 1), 2, 2);
      ctx.fillRect(Math.round(e.x + 1), Math.round(e.y - 1), 2, 2);
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(Math.round(e.x), Math.round(e.y - 8), 2, 3); // fuse
      drawEnemyHpBar(e);
      return;
    }
    if (e.type === 'splitter' || e.type === 'mini') {
      var ss = e.type === 'splitter' ? 20 : 10;
      var sdrew = e.skinTint
        ? drawTintedTile(e.tile, Math.round(e.x - ss / 2), Math.round(e.y - ss / 2), ss, ss, false, e.skinTint, e.skinAlpha || 0.3, true)
        : drawTile(e.tile, Math.round(e.x - ss / 2), Math.round(e.y - ss / 2), ss, ss, false);
      if (!sdrew) {
        ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
        ctx.fillRect(Math.round(e.x - ss / 2), Math.round(e.y - ss / 3), ss, Math.round(ss * 0.66));
        ctx.fillRect(Math.round(e.x - ss / 3), Math.round(e.y - ss / 2), Math.round(ss * 0.66), Math.round(ss / 3));
      } else if (e.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(Math.round(e.x - ss / 2), Math.round(e.y - ss / 2), ss, ss);
      }
      drawEnemyHpBar(e);
      return;
    }
    if (e.type === 'cultist') {
      drawCultist(e);
      drawEnemyHpBar(e);
      return;
    }
    var drew = e.skinTint
      ? drawTintedTile(e.tile, dx, dy, 16, 16, false, e.skinTint, e.skinAlpha || 0.3, true)
      : drawTile(e.tile, dx, dy, 16, 16, false);
    if (drew) {
      if (e.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(dx, dy, 16, 16);
      }
      if (e.slowT > 0 || game.freezeTimer > 0) {
        ctx.fillStyle = 'rgba(140,215,255,0.35)'; // frost / chrono chill
        ctx.fillRect(dx, dy, 16, 16);
      }
      // the biome caster levitates a spell orb in its bolt colour
      if (e.type === 'caster') {
        var bob = Math.round(Math.sin(game.time * 4 + e.animPhase) * 2);
        ctx.fillStyle = e.shotCol || '#b06ce8';
        ctx.fillRect(dx + 13, dy - 4 + bob, 3, 3);
      }
    } else {
      var col = e.hitFlash > 0 ? '#fff' : e.color;
      if (e.type === 'slime') {
        // green blob
        ctx.fillStyle = col;
        ctx.fillRect(Math.round(e.x - 7), Math.round(e.y - 3), 14, 9);
        ctx.fillRect(Math.round(e.x - 5), Math.round(e.y - 6), 10, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(Math.round(e.x - 3), Math.round(e.y - 1), 2, 2);
        ctx.fillRect(Math.round(e.x + 1), Math.round(e.y - 1), 2, 2);
      } else {
        ctx.fillStyle = col;
        ctx.fillRect(Math.round(e.x - 7), Math.round(e.y - 7), 14, 14);
        ctx.fillStyle = '#000';
        ctx.fillRect(Math.round(e.x - 4), Math.round(e.y - 3), 2, 2);
        ctx.fillRect(Math.round(e.x + 2), Math.round(e.y - 3), 2, 2);
      }
    }
    drawEnemyHpBar(e);
  }

  function drawBoss(e) {
    // pulse ±2px around the kind's own size on a 1-second sine cycle
    var ds = (e.drawSize || 32) + Math.sin(game.time * Math.PI * 2) * 2;
    var dsr = Math.round(ds);
    var bx = Math.round(e.x - dsr / 2);
    var by = Math.round(e.y - dsr / 2);
    // kind-coloured ring so each boss reads differently
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, dsr / 2 + 5, 0, Math.PI * 2);
    ctx.stroke();
    // charger telegraph: violent white flashing + shake before the dash
    var tg = e.telegraph > 0 && Math.floor(e.telegraph * 12) % 2 === 0;
    if (e.telegraph > 0 && game.gameState === 'playing') { bx += randInt(-2, 2); by += randInt(-2, 2); }
    if (e.kind === 'summoner') {
      drawNecromancer(e, bx, by, dsr, tg);
      return;
    }
    if (e.kind === 'keeper') {
      drawKeeper(e, bx, by, dsr, tg);
      return;
    }
    if (e.kind === 'spiral') {
      // spectral: translucent, and fades right out while winding up a blink
      var ga = 0.62 + 0.18 * Math.sin(game.time * 5);
      if (e.blinkPhase > 0) ga *= clamp(e.blinkPhase / 0.7, 0.15, 1);
      ctx.globalAlpha = ga;
    }
    var drew = drawTile(e.tile, bx, by, dsr, dsr, false);
    if (drew) {
      if (e.hitFlash > 0 || tg) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(bx, by, dsr, dsr);
      }
    } else {
      ctx.fillStyle = (e.hitFlash > 0 || tg) ? '#fff' : e.color;
      ctx.fillRect(bx, by, dsr, dsr);
      ctx.fillStyle = '#000';
      ctx.fillRect(bx + 6, by + 8, 4, 4);
      ctx.fillRect(bx + dsr - 10, by + 8, 4, 4);
    }
    ctx.globalAlpha = 1;
    // boss uses the big dedicated HUD bar, so no small bar here.
  }

  // THE VAULT KEEPER: a walking strongbox — hulking dark-iron body with
  // gold trim, a glowing keyhole on the chest, burning violet eyes.
  function drawKeeper(e, bx, by, dsr, tg) {
    var u = dsr / 16;
    var flash = e.hitFlash > 0 || tg;
    function px(x, y, w, h, col) {
      ctx.fillStyle = flash && col !== '#b06ce8' ? '#ffffff' : col;
      ctx.fillRect(Math.round(bx + x * u), Math.round(by + y * u), Math.ceil(w * u), Math.ceil(h * u));
    }
    // massive iron body
    px(2, 3, 12, 11, '#2a2035');
    px(3, 2, 10, 1, '#2a2035');
    // gold banding
    px(2, 3, 12, 1, '#c9a227');
    px(2, 9, 12, 1, '#c9a227');
    px(2, 13, 12, 1, '#c9a227');
    px(2, 3, 1, 11, '#c9a227');
    px(13, 3, 1, 11, '#c9a227');
    // rivets
    px(3, 4, 1, 1, '#e8cf6a'); px(12, 4, 1, 1, '#e8cf6a');
    px(3, 12, 1, 1, '#e8cf6a'); px(12, 12, 1, 1, '#e8cf6a');
    // burning violet eyes under the brow band
    px(5, 5, 2, 2, '#b06ce8');
    px(9, 5, 2, 2, '#b06ce8');
    if (game.time % 0.8 < 0.4) { px(5.5, 5.5, 1, 1, '#e8d4ff'); px(9.5, 5.5, 1, 1, '#e8d4ff'); }
    // the keyhole: circle + slot, glowing when enraged
    var hot = e.hp < e.maxHp * 0.5 && game.time % 0.5 < 0.25;
    px(7, 10, 2, 1.5, hot ? '#ff5a3a' : '#c9a227');
    px(7.5, 11.5, 1, 1.5, hot ? '#ff5a3a' : '#c9a227');
    // stubby legs
    px(4, 14, 3, 2, '#171021');
    px(9, 14, 3, 2, '#171021');
  }

  // THE NECROMANCER has no matching tile on the sheet, so it is drawn
  // procedurally (same style family as the cultist, scaled up): tattered
  // purple robe, hooded skull face, glowing green eyes, soul-orb staff.
  function drawNecromancer(e, bx, by, dsr, tg) {
    var u = dsr / 16; // one logical pixel on a 16px design grid
    var flash = e.hitFlash > 0 || tg;
    function px(x, y, w, h, col) {
      ctx.fillStyle = flash && col !== '#59ff8e' ? '#ffffff' : col;
      ctx.fillRect(Math.round(bx + x * u), Math.round(by + y * u), Math.ceil(w * u), Math.ceil(h * u));
    }
    // tattered robe (jagged hem)
    px(3, 6, 10, 8, '#3a1f5e');
    px(2, 13, 3, 3, '#3a1f5e'); px(7, 14, 3, 2, '#3a1f5e'); px(11, 13, 3, 3, '#3a1f5e');
    // hood
    px(4, 2, 8, 3, '#5b2c8e');
    px(3, 4, 10, 3, '#5b2c8e');
    // skull face inside the hood shadow
    px(5, 4.5, 6, 3.5, '#e8e0d0');
    // glowing green eyes
    px(6, 5, 1.5, 1.5, '#59ff8e');
    px(8.5, 5, 1.5, 1.5, '#59ff8e');
    // staff with a flickering soul-orb
    px(13.5, 3, 1, 12, '#7a5a30');
    px(12.75, 1.5, 2.5, 2.5, '#59ff8e');
    if (game.time % 1 < 0.5) px(13.25, 2, 1.5, 1.5, '#b6ffce');
  }

  function drawOrbs() {
    var p = game.player;
    if (!p.orbs || !p.orbs.length) return;
    for (var i = 0; i < p.orbs.length; i++) {
      var orb = p.orbs[i];
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(orb.x - 3), Math.round(orb.y - 3), 6, 6);
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(Math.round(orb.x - 2), Math.round(orb.y - 2), 4, 4);
    }
  }

  function drawProjectiles() {
    // heavy shot / fat pellets / sniper arrow scale the actual sprite —
    // no halo boxes (they stacked into an opaque smear at high counts)
    var baseScale = 1 + Math.min(4, game.player.projSize) * 0.18;
    for (var i = 0; i < game.projectiles.length; i++) {
      var pr = game.projectiles[i];
      var pscale = baseScale * (pr.fat ? 1.25 : 1) * (pr.big ? 1.6 : 1);
      var scaled = pscale > 1.01;
      if (scaled) {
        ctx.save();
        ctx.translate(pr.x, pr.y);
        ctx.scale(pscale, pscale);
        ctx.translate(-pr.x, -pr.y);
      }
      // class identity: rogues throw daggers, warriors spinning axes,
      // rangers arrows, the mage keeps his glowing orbs
      if (currentClass === 'rogue') { drawDagger(pr); }
      else if (currentClass === 'warrior') { drawAxe(pr); }
      else if (currentClass === 'ranger') { drawArrow(pr); }
      else if (currentClass === 'bombardier') { drawBomb(pr); }
      else {
        // glow + core
        ctx.fillStyle = 'rgba(255,230,0,0.3)';
        ctx.fillRect(Math.round(pr.x - 3), Math.round(pr.y - 3), 6, 6);
        ctx.fillStyle = '#ffe600';
        ctx.fillRect(Math.round(pr.x - 2), Math.round(pr.y - 2), 4, 4);
      }
      if (scaled) ctx.restore();
    }
    // enemy shots: biome casters fire in their own colour, everything else
    // stays magenta so hostile bolts never look like the player's
    for (var s = 0; s < game.enemyShots.length; s++) {
      var sh = game.enemyShots[s];
      ctx.fillStyle = 'rgba(255,60,255,0.3)';
      ctx.fillRect(Math.round(sh.x - 3), Math.round(sh.y - 3), 6, 6);
      ctx.fillStyle = sh.col || '#ff44aa';
      ctx.fillRect(Math.round(sh.x - 2), Math.round(sh.y - 2), 4, 4);
    }
  }

  // Bombardier bomb: a round dark bomb tumbling through the air with a lit,
  // sparking fuse. Kills detonate it (handled in killEnemy).
  function drawBomb(pr) {
    var x = Math.round(pr.x), y = Math.round(pr.y);
    ctx.fillStyle = '#1a1a22';
    ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.fillStyle = '#3a3a48';
    ctx.fillRect(x - 2, y - 2, 2, 2);
    ctx.fillStyle = '#8a5a2b';           // stubby fuse
    ctx.fillRect(x + 2, y - 5, 1, 3);
    ctx.fillStyle = game.time % 0.2 < 0.1 ? '#ffe600' : '#ff9f1c'; // sparking tip
    ctx.fillRect(x + 2, y - 6, 1, 1);
  }

  // Ranger arrow: long thin shaft pointing along its flight direction, with a
  // steel head and amber fletching. Reads as a fast projectile at range.
  function drawArrow(pr) {
    ctx.save();
    ctx.translate(Math.round(pr.x), Math.round(pr.y));
    ctx.rotate(Math.atan2(pr.vy, pr.vx)); // 0deg art points along +x (travel dir)
    ctx.fillStyle = '#2a2135';    // dark outline
    ctx.fillRect(-8, -2, 16, 4);
    ctx.fillStyle = '#c99a3a';    // wooden shaft
    ctx.fillRect(-7, -1, 11, 2);
    ctx.fillStyle = '#e8eef8';    // steel head
    ctx.fillRect(4, -2, 4, 4);
    ctx.fillStyle = '#e0a030';    // fletching
    ctx.fillRect(-7, -2, 2, 4);
    ctx.restore();
  }

  // Rogue dagger: slim steel blade pointing along its flight direction,
  // dark-outlined to match the Tiny Dungeon sprite style.
  function drawDagger(pr) {
    ctx.save();
    ctx.translate(Math.round(pr.x), Math.round(pr.y));
    ctx.rotate(Math.atan2(pr.vy, pr.vx) + Math.PI / 2); // art points up
    ctx.fillStyle = '#2a2135';    // outline silhouette
    ctx.fillRect(-2, -6, 4, 8);
    ctx.fillRect(-3, 0, 6, 2);
    ctx.fillStyle = '#b8c4d4';
    ctx.fillRect(-1, -5, 2, 6);   // blade
    ctx.fillStyle = '#e8eef8';
    ctx.fillRect(-1, -5, 1, 3);   // edge shine
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-2, 0, 4, 1);    // crossguard
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(-1, 1, 2, 3);    // grip
    ctx.restore();
  }

  // Warrior axe: twin-bladed, dark-outlined, spinning as it flies.
  function drawAxe(pr) {
    ctx.save();
    ctx.translate(Math.round(pr.x), Math.round(pr.y));
    ctx.rotate(Math.atan2(pr.vy, pr.vx) + game.time * 14);
    ctx.fillStyle = '#2a2135';    // outline silhouette
    ctx.fillRect(-6, -6, 5, 8);
    ctx.fillRect(1, -6, 5, 8);
    ctx.fillRect(-2, -6, 4, 12);
    ctx.fillStyle = '#7a5a30';
    ctx.fillRect(-1, -5, 2, 10);  // haft
    ctx.fillStyle = '#b8c4d4';
    ctx.fillRect(-5, -5, 3, 6);   // left blade
    ctx.fillRect(2, -5, 3, 6);    // right blade
    ctx.fillStyle = '#e8eef8';
    ctx.fillRect(-5, -5, 1, 6);   // edge shine
    ctx.fillRect(4, -5, 1, 6);
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < game.particles.length; i++) {
