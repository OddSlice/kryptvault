<script>
(function () {
  'use strict';

  var GAME_VERSION = '1.2.1';
  var ITCH_URL = 'https://oddslice.itch.io/kryptvault';
  // The server (leaderboard, accounts, saves, crash reports) lives on Vercel.
  // On kryptvault.vercel.app and its preview deploys the short /api/... paths
  // reach it; anywhere else, such as the copy uploaded to itch.io or a file
  // opened from disk, the game has to use the full address.
  var apiHost = window.location.hostname || '';
  var API_BASE = /(^|\.)vercel\.app$/.test(apiHost) || /^(localhost|127\.0\.0\.1)$/.test(apiHost) ? '' : 'https://kryptvault.vercel.app';

  // ---------------------------------------------------------------------------
  // CRASH REPORTS: errors the game catches are sent to /api/errors so a new bug
  // shows up the same day instead of when a player mentions it. Anonymous:
  // the error, version, device and what the game was doing; never names, tags
  // or vault keys. At most 5 per visit, each distinct error once.
  // ---------------------------------------------------------------------------
  var reportSid = Math.random().toString(36).slice(2, 10);
  var reportsSent = 0, reportSeen = {};
  function reportError(err, kind) {
    try {
      if (reportsSent >= 5) return;
      var msg = String((err && err.message) || err || 'unknown').slice(0, 300);
      var stack = String((err && err.stack) || '').slice(0, 2000);
      // page-level errors only when they come from the game itself (browser
      // extensions and other scripts throw on this page too)
      if (kind !== 'frame' && stack.indexOf(location.origin) === -1) return;
      var where = (stack.split('\n')[1] || '').trim();
      if (reportSeen[msg + where]) return;
      reportSeen[msg + where] = true;
      reportsSent++;
      var st = null;
      if (game) {
        var pl = game.player || {};
        st = { s: game.gameState, wave: game.wave, lvl: game.level, cls: currentClass,
               asc: pl.ascendancy ? pl.ascendancy.id : null, en: (game.enemies || []).length, t: Math.round(game.time || 0) };
      }
      // sent as plain text: from another site (itch.io) a JSON body would need
      // a permission round-trip first, which some browsers refuse for a
      // keepalive request; the server reads the JSON out of the text
      fetch(API_BASE + '/api/errors', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        keepalive: true,
        body: JSON.stringify({ v: GAME_VERSION, kind: kind, msg: msg, stack: stack, state: st,
          ua: String(navigator.userAgent || '').slice(0, 300),
          scr: window.innerWidth + 'x' + window.innerHeight + '@' + (window.devicePixelRatio || 1), sid: reportSid })
      }).catch(function () {});
    } catch (e) { /* reporting must never cause an error of its own */ }
  }
  window.addEventListener('error', function (e) { reportError(e.error || e.message, 'error'); });
  window.addEventListener('unhandledrejection', function (e) { reportError(e.reason, 'promise'); });

  // CANVAS & RESOLUTION
  // ---------------------------------------------------------------------------
  var W = 480, H = 270;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  // Hidden text fields for the typed screens. The game reads raw key events,
  // which works on desktop but never raises a soft keyboard on mobile (and soft
  // keyboards send no e.code anyway). Focusing a real <input> inside the tap
  // gesture pops the mobile keyboard, and its value drives the field so on-
  // screen typing works regardless of key codes. One input per typed screen.
  function makeHiddenInput(maxLen) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = maxLen;
    inp.autocapitalize = 'characters';
    inp.autocomplete = 'off';
    inp.setAttribute('autocorrect', 'off');
    inp.spellcheck = false;
    inp.setAttribute('aria-hidden', 'true');
    inp.tabIndex = -1;
    // visually hidden but still focusable; 16px font stops iOS auto-zoom
    inp.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;' +
      'opacity:0.01;border:0;padding:0;margin:0;font-size:16px;background:transparent;' +
      'color:transparent;caret-color:transparent;z-index:-1;pointer-events:none;';
    document.body.appendChild(inp);
    return inp;
  }
  var nameInput = makeHiddenInput(3);
  var loginInput = makeHiddenInput(20); // slack for #/space the user may type

  function focusHiddenInput(inp, val) {
    inp.value = val;
    try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
  }
  function blurHiddenInput(inp) {
    if (document.activeElement === inp) inp.blur();
  }
  // thin wrappers kept for the name-entry call sites
  function focusNameInput() { focusHiddenInput(nameInput, nameDraft); }
  function blurNameInput() { blurHiddenInput(nameInput); }

  // soft-keyboard / desktop typing into the initials field -> nameDraft

    g.gain.setValueAtTime(0.05, t);

    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.07);
  }

  // White-noise burst for the combat percussion (8-bit snare/hat).
  function musicNoise(t, dur, vol) {
    var len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.linearRampToValueAtTime(0, t + dur);
    src.connect(g); g.connect(masterGain);
    src.start(t);
  }

  function scheduleMusic() {
    if (!audioCtx || musicMuted) return;
    var tr = MUSIC_TRACKS[music.track];
    var stepDur = tr.stepDur;
    // a background tab or a long stall leaves the schedule behind the clock:
    // pick up from now instead of playing every missed note at once
    if (music.nextTime < audioCtx.currentTime) music.nextTime = audioCtx.currentTime + 0.05;
    while (music.nextTime < audioCtx.currentTime + 0.3) {
      var s = music.step;
      var t = music.nextTime;
      if (tr.doom) {
        // riff-driven doom rock: 32-step riff of power chords + drum tables
        var rs = s % tr.riff.length;
        var root = tr.riff[rs];
        if (root) powerChord(root, t, stepDur * 0.9, 0.05);
        var dlead = tr.lead[rs];
        if (dlead) musicNote(dlead, t, stepDur * 1.5, 'square', 0.032);
        if (tr.kick[rs])  doomKick(t);
        if (tr.snare[rs]) doomSnare(t);
        if (rs % 2 === 1) musicNoise(t, 0.015, 0.014); // offbeat hat tick
      } else {
        // legacy chiptune (lobby)
        if (s % 2 === 0) musicNote(tr.bass[(s / 2) % tr.bass.length | 0], t, stepDur * 1.8, tr.bassType, tr.bassVol);
        var lead = tr.lead[s % tr.lead.length];
        if (lead) musicNote(lead, t, stepDur * 0.8, 'square', tr.leadVol);
        if (tr.drums) {
          var ds = s % 8;
          if (ds === 0) musicNote(55, t, stepDur * 0.9, 'square', 0.07);
          if (ds === 4) musicNoise(t, 0.05, 0.05);
          if (ds === 6) musicNoise(t, 0.02, 0.02);
        }
      }
      music.nextTime += stepDur;
      music.step++;
    }
  }

  function startMusic() {
    if (music.playing || !audioCtx || musicMuted) return;
    music.playing = true;
    music.step = 0;
    music.nextTime = audioCtx.currentTime + 0.05;
    music.timer = setInterval(scheduleMusic, 80);
  }

  function stopMusic() {
    if (music.timer) clearInterval(music.timer);
    music.timer = null;
    music.playing = false;
  }

  // Switch loops (lobby <-> combat); restarts the scheduler on a track change.
  function setMusicTrack(name) {
    if (music.track === name && music.playing) return;
    music.track = name;
    stopMusic();
    startMusic();
  }

  // Each biome has its own doom-rock combat track (combat0..combat4).
  function combatTrackName() {
    var w = game.wave || 1;
    if (w > 50) return 'combat0';                 // endless: back to the catacombs stomp
    if (w > 40) return 'combat4';                 // THE VAULT: the dread march
    return 'combat' + (Math.floor((w - 1) / 10) % 4);
  }

  function musicTrackForState() {
    var s = game.gameState;
    return (s === 'playing' || s === 'waveintro' || s === 'levelup' || s === 'ascend' || s === 'paused')
      ? combatTrackName() : 'lobby';
  }

  function toggleMute() {
    musicMuted = !musicMuted;
    try { localStorage.setItem('kryptvault_muted', musicMuted ? '1' : '0'); } catch (e) {}
    if (musicMuted) stopMusic();
    else { music.track = musicTrackForState(); startMusic(); }
  }

  // separate switch for sound effects (players asked for a music-only mode
  // and a fully silent mode)
  function toggleSfx() {
    sfxMuted = !sfxMuted;
    try { localStorage.setItem('kryptvault_sfx_muted', sfxMuted ? '1' : '0'); } catch (e) {}
  }


  // ---------------------------------------------------------------------------
  // INPUT
  // ---------------------------------------------------------------------------
  var keys = {};
  var mouse = { x: 0, y: 0 };
  // on-screen ability button; the HUD moves it to wherever it draws the
  // ability socket each frame. Desktop can just press SPACE.
  var ABILITY_BTN = { x: 6, y: H - 44, w: 26, h: 26 };
  // generous invisible tap zone around the bottom-right ability socket so
  // right thumbs don't have to hit it exactly
  var THUMB_CAST = { x: W - 60, y: H - 60, w: 60, h: 60 };

  function overAbilityBtn(p) {
    return game.gameState === 'playing' && game.player && game.player.ascendancy &&
           p.x >= ABILITY_BTN.x && p.x <= ABILITY_BTN.x + ABILITY_BTN.w &&
           p.y >= ABILITY_BTN.y && p.y <= ABILITY_BTN.y + ABILITY_BTN.h;
  }

  function overThumbCast(p) {
    return game.gameState === 'playing' && game.player && game.player.ascendancy &&
           p.x >= THUMB_CAST.x && p.y >= THUMB_CAST.y;
  }

  window.addEventListener('keydown', function (e) {
    // Ctrl/Cmd/Alt shortcuts belong to the browser (Ctrl+F used to toggle
    // sound, and Ctrl+D left D held down once the bookmark dialog took the key-up)
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    ensureAudio();
    lastInput = 'key';
    keys[e.code] = true;
    var s = game.gameState, c = e.code;
    if (!c && e.key === 'Enter') c = 'Enter'; // phone keyboards' Go/Return have no e.code
    if (s === 'nameentry') {
      if (c === 'Escape') { if (!e.repeat) goBack(); }
      else if (c === 'Enter' || c === 'NumpadEnter') confirmName();
      else if (document.activeElement !== nameInput) {
        // fallback for when the hidden input isn't handling keys; when it IS
        // focused, its 'input' event is the single source of truth (no dupes)
        if (/^Key[A-Z]$/.test(c) && nameDraft.length < 3) {
          nameDraft += c.slice(3);
        } else if (c === 'Backspace') {
          nameDraft = nameDraft.slice(0, -1);
          e.preventDefault();
        }
      }
    } else if (s === 'login') {
      if (c === 'Escape') { if (!e.repeat) goBack(); }
      else if (c === 'Enter' || c === 'NumpadEnter') tryLoginSubmit();
      else if (document.activeElement !== loginInput) {
        // fallback physical-key entry when the hidden input isn't capturing keys;
        // when it IS focused, its 'input' event is the single source of truth
        var pos = loginForm.buf.length;
        if (/^Key[A-Z]$/.test(c)) {
          var letter = c.slice(3);
          if (pos < 3 || (pos >= 7 && pos < 15)) loginForm.buf += letter;
        } else if (/^(Digit|Numpad)[0-9]$/.test(c)) {
          var digit = c.slice(-1);
          if ((pos >= 3 && pos < 7) || (pos >= 7 && pos < 15)) loginForm.buf += digit;
        } else if (c === 'Backspace') {
          loginForm.buf = loginForm.buf.slice(0, -1);
          if (loginForm.state !== 'checking') loginForm.state = 'idle';
          e.preventDefault();
        }
      }
    } else if (s === 'levelup' || s === 'ascend') {
      if (!e.repeat) draftKey(c);
    } else if (s === 'playing') {
      if (c === 'Space') castAbility();
      else if ((c === 'KeyP' || c === 'Escape') && !e.repeat) game.gameState = 'paused';
    } else if (s === 'paused') {
      if (c === 'KeyP' || c === 'Escape') { if (!e.repeat) game.gameState = 'playing'; }
      else menuKey(c, e);
    } else if (UI_NAV_STATES[s]) {
      menuKey(c, e);
    }
    if (s !== 'nameentry' && s !== 'login') {
      if (c === 'KeyM') toggleMute();
      else if (c === 'KeyF') toggleSfx();
    }
    // Prevent arrow keys / space scrolling the page.
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(c) !== -1) {
      e.preventDefault();
    }
  });

  // Arrow keys / WASD move menu focus, Enter or Space activates, Esc goes
  // back; plus a few per-screen shortcuts.
  function menuKey(c, e) {
    var s = game.gameState;
    if (c === 'ArrowUp' || c === 'KeyW') uiNav(0, -1);
    else if (c === 'ArrowDown' || c === 'KeyS') uiNav(0, 1);
    else if (c === 'ArrowLeft' || c === 'KeyA') uiNav(-1, 0);
    else if (c === 'ArrowRight' || c === 'KeyD') uiNav(1, 0);
    // Enter only: Space is the ability key, and players are still mashing
    // it when a run ends, so it must not click through game over
    else if (c === 'Enter' || c === 'NumpadEnter') { if (!e.repeat) uiActivate(); }
    else if ((c === 'Escape' || c === 'Backspace') && !e.repeat) {
      if (s === 'gameover') { if (!(game.overLock > 0)) leaveGameOver(false); }
      else if (BACK_STATES[s]) goBack();
    }
    var digit = /^(Digit|Numpad)([1-9])$/.exec(c);
    var n = digit ? parseInt(digit[2], 10) - 1 : -1;
    if (s === 'title') {
      if (c === 'KeyR') game.gameState = 'codex';
      else if (c === 'KeyT') game.gameState = 'settings';
      else if (c === 'KeyN') openAccount('title');
    } else if (s === 'settings') {
      if (c === 'KeyN') openAccount('settings');
    } else if (s === 'account') {
      if (n === 0) enterNameEntry('account');
      else if (n === 1) enterLogin();
    } else if (s === 'shop') {
      if (n >= 0 && n < SHOP_ITEMS.length) tryBuyShopItem(n);
    } else if (s === 'classselect') {
      if (n >= 0 && n < CLASSES.length) selectClassByIndex(n);
      else if (c === 'KeyI') classInfoOpen = !classInfoOpen;
    } else if (s === 'wardrobe') {
      if (c === 'KeyQ') { wardrobeClass = prevClassId(wardrobeClass); skinPending = null; }
      else if (c === 'KeyE') { wardrobeClass = nextClassId(wardrobeClass); skinPending = null; }
    }
  }

  // Level-up / ascendancy drafts: number keys pick directly, arrows browse,
  // Enter takes the focused card. (Space is deliberately NOT a pick key —
  // players mash it for their ability right as a draft pops up.)
  function draftKey(c) {
    var n = game.cards.length;
    if (!n) return;
    var digit = /^(Digit|Numpad)([1-9])$/.exec(c);
    if (digit) {
      var i = parseInt(digit[2], 10) - 1;
      if (i < n) pickDraftCard(i);
      return;
    }
    if (c === 'ArrowLeft' || c === 'KeyA') game.cardFocus = (game.cardFocus + n - 1) % n;
    else if (c === 'ArrowRight' || c === 'KeyD') game.cardFocus = (game.cardFocus + 1) % n;
    else if (c === 'Enter' || c === 'NumpadEnter') pickDraftCard(game.cardFocus);
  }
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  // from the canvas box itself (letterboxed by object-fit: contain), so a tap
  // lands where the button is drawn whatever size the browser gave the canvas
  function toGameCoords(clientX, clientY) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
    if (r && r.width > 0 && r.height > 0) {
      var s = Math.min(r.width / W, r.height / H);
      return { x: (clientX - r.left - (r.width - W * s) / 2) / s,
               y: (clientY - r.top - (r.height - H * s) / 2) / s };
    }
    return { x: (clientX - offsetX) / scale, y: (clientY - offsetY) / scale };
  }

  canvas.addEventListener('mousemove', function (e) {
    var p = toGameCoords(e.clientX, e.clientY);
    mouse.x = p.x; mouse.y = p.y;
    lastInput = 'mouse';
    uiHoverAt(p);
    if (game.gameState === 'levelup' || game.gameState === 'ascend') {
      var ci = draftCardAt(p.x, p.y);
      if (ci >= 0) game.cardFocus = ci;
    }
  });

  canvas.addEventListener('mousedown', ensureAudio);

  // ----- touch controls: drag anywhere = virtual joystick, tap = confirm -----
  // The first finger down steers. Any other finger is a tap (ability, pause,
  // a draft card, a menu button), so two-thumb play works.
  var touchCtl = { active: false, id: null, ox: 0, oy: 0, vx: 0, vy: 0, moved: false, state: '', locked: false };
  var touchTaps = {};   // second-finger touches: id -> { x, y, state, locked, moved }

  function releaseStick() {
    touchCtl.active = false; touchCtl.id = null;
    touchCtl.vx = 0; touchCtl.vy = 0;
  }
  function hasTouchId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].identifier === id) return true;
    return false;
  }
  // a touch counts as a tap only on the screen it started on, and not if it
  // started while a draft or game over was still locked against stray input
  function inputLocked() { return (game.draftLock || 0) > 0 || (game.overLock || 0) > 0; }
  function tapCounts(state, locked) { return state === game.gameState && !locked; }

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    ensureAudio();
    lastInput = 'touch';
    // the stick's finger is gone but its end was never reported (or its id is
    // being reused): let go, or every tap after this would be ignored
    if (touchCtl.active && (!hasTouchId(e.touches, touchCtl.id) || hasTouchId(e.changedTouches, touchCtl.id))) releaseStick();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var p = toGameCoords(t.clientX, t.clientY);
      mouse.x = p.x; mouse.y = p.y;
      // ability button (or the right-thumb corner zone) eats the touch
      if (overAbilityBtn(p) || overThumbCast(p)) { castAbility(); continue; }
      if (!touchCtl.active) {
        touchCtl.active = true;
        touchCtl.id = t.identifier;
        touchCtl.ox = p.x; touchCtl.oy = p.y;
        touchCtl.vx = 0; touchCtl.vy = 0;
        touchCtl.moved = false;
        touchCtl.state = game.gameState;
        touchCtl.locked = inputLocked();
      } else {
        touchTaps[t.identifier] = { x: p.x, y: p.y, state: game.gameState, locked: inputLocked(), moved: false };
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var p = toGameCoords(t.clientX, t.clientY);
      var tap = touchTaps[t.identifier];
      if (tap) {
        if (Math.abs(p.x - tap.x) > 6 || Math.abs(p.y - tap.y) > 6) tap.moved = true;
        continue;
      }
      if (t.identifier !== touchCtl.id) continue;
      var dx = (p.x - touchCtl.ox) / 28, dy = (p.y - touchCtl.oy) / 28;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > 1) { dx /= len; dy /= len; }
      if (len > 0.2) touchCtl.moved = true;
      touchCtl.vx = dx; touchCtl.vy = dy;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    ensureAudio(); // some phones only count the end of a touch as a gesture
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var wasTap = false;
      if (t.identifier === touchCtl.id) {
        wasTap = !touchCtl.moved && tapCounts(touchCtl.state, touchCtl.locked);
        releaseStick();
      } else if (touchTaps[t.identifier]) {
        var tap = touchTaps[t.identifier];
        delete touchTaps[t.identifier];
        wasTap = !tap.moved && tapCounts(tap.state, tap.locked);
      }
      if (wasTap) {
        // taps act like clicks on every non-playing screen
        var p = toGameCoords(t.clientX, t.clientY);
        mouse.x = p.x; mouse.y = p.y;
        handlePointerAt(p);
      }
    }
  }, { passive: false });

  // the phone cancels a touch when a system gesture takes over (home-bar
  // swipe, back swipe, a call banner). Without this the stick stayed held,
  // the hero kept walking, and every tap was ignored: it looked frozen.
  canvas.addEventListener('touchcancel', function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) delete touchTaps[e.changedTouches[i].identifier];
    if (hasTouchId(e.changedTouches, touchCtl.id)) releaseStick();
  });

  // focus lost (alt-tab, switching apps, the right-click menu): the key-ups
  // and touch-ends never arrive, so let go of everything and pause a live run
  function dropAllInput() {
    for (var k in keys) keys[k] = false;
    releaseStick();
    touchTaps = {};
    if (game.gameState === 'playing') game.gameState = 'paused';
  }
  window.addEventListener('blur', dropAllInput);
  document.addEventListener('visibilitychange', function () { if (document.hidden) dropAllInput(); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('click', function (e) {
    ensureAudio();
    var p = toGameCoords(e.clientX, e.clientY);
    mouse.x = p.x; mouse.y = p.y;
    handlePointerAt(p);
  });

  function handlePointerAt(p) {
    var s = game.gameState;
    // menu buttons registered by the screen drawn last frame
    if (uiButtonsState === s) {
      var hit = uiHit(p);
      if (hit && !hit.b.disabled) {
        if (hit.b.nav !== false) uiFocus = hit.i;
        if (hit.b.onClick) { playUiSelect(); hit.b.onClick(); }
        return;
      }
    }
    if (s === 'levelup' || s === 'ascend') {
      var ci = draftCardAt(p.x, p.y);
      if (ci >= 0) pickDraftCard(ci);
    } else if (s === 'playing') {
      if (overAbilityBtn(p)) { castAbility(); return; }
      var hp2 = HUD_PAUSE;
      if (hp2.w && p.x >= hp2.x && p.x <= hp2.x + hp2.w && p.y >= hp2.y && p.y <= hp2.y + hp2.h) game.gameState = 'paused';
    } else if (s === 'paused') {
      // tapping the dimmed arena outside the pause card resumes
      var pp = PAUSE_PANEL;
      if (p.x < pp.x || p.x > pp.x + pp.w || p.y < pp.y || p.y > pp.y + pp.h) game.gameState = 'playing';
    } else if (s === 'nameentry') {
      focusNameInput();          // re-raise the mobile keyboard
    } else if (s === 'login') {
      focusHiddenInput(loginInput, loginForm.buf);
    } else if (s === 'accountinfo') {
      finishAccountInfo();
    } else if (s === 'classselect') {
      classUnlockPending = null; // clicking empty space cancels an armed purchase
    } else if (s === 'wardrobe') {
      skinPending = null;
    }
  }

  var nameDraft = '';
  var afterName = 'play';     // where to go once the name/account step is done

  // Enter the initials screen from a user gesture, raising the mobile keyboard.
  function enterNameEntry(after) {
    nameDraft = '';
    afterName = after;
    game.gameState = 'nameentry';
    focusNameInput();
  }

  // Enter the login screen from a user gesture, raising the mobile keyboard.
  function enterLogin() {
    loginSeq++;
    loginForm.buf = '';
    loginForm.state = 'idle';
    game.gameState = 'login';
    focusHiddenInput(loginInput, '');
  }

  function finishNameStep() {
    if (afterName === 'play') enterClassSelect();
    else game.gameState = afterName === 'account' ? 'account' : 'title';
  }

  // name entry: lock in the initials and claim a fresh account
  function confirmName() {
    if (nameDraft.length !== 3) return;
    runData.name = nameDraft;
    // a fresh name means a fresh account
    runData.playerDisc = '';
    runData.playerSecret = '';
    runData.playerId = '';
    saveRunData();
    blurNameInput();
    game.gameState = 'accountinfo';
    registerAccount(false);
  }

  function finishAccountInfo() {
    if (account.state === 'created' || account.state === 'error') finishNameStep();
  }

  function tryLoginSubmit() {
    if (loginForm.buf.length === 15 && loginForm.state !== 'checking') submitLogin();
  }

  // ---------------------------------------------------------------------------
  // RANDOM HELPERS
  // ---------------------------------------------------------------------------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---------------------------------------------------------------------------
  // STATIC DUNGEON FLOOR (seeded once so it doesn't shimmer)
  // ---------------------------------------------------------------------------
  var TILE_SIZE = 16;

  // Biomes rotate every 10 waves (post-boss): palette swaps for floor + walls.
  // Design rule: floors stay mid-dark and desaturated so enemy contrast never
  // suffers — tints are low-alpha overlays, never bright fills.
  var BIOMES = [
    // cold grey-blue wash so the brown dirt floor reads as crypt stone, not
    // desert sand (players confused waves 1-10 with the Dunes)
    // skin: tint washed over melee enemy sprites; shot: the biome caster's bolt colour
    { name: 'THE CATACOMBS', tint: 'rgba(70,90,140,0.30)',    speck: '#6a7a92',      texture: 'brick',
      skin: null,      shot: '#e8e0d0',
      wallFill: '#334455', wallAlt: '#36475a', wallBorder: '#556677', wallShadow: '#223344' },
    { name: 'THE DUNES',     tint: 'rgba(210,140,30,0.14)',   speck: '#8a6a3a',      texture: 'strata',
      skin: '#c98a3a', shot: '#9ddb3a',
      wallFill: '#5d4a2e', wallAlt: '#66512f', wallBorder: '#8a734a', wallShadow: '#3e3220' },
    { name: 'THE FROST DEPTHS', tint: 'rgba(90,150,255,0.16)', speck: '#cfe8ff',     texture: 'ice',
      skin: '#7fd7ff', shot: '#7fd7ff',
      wallFill: '#2e4a63', wallAlt: '#325371', wallBorder: '#5d89a8', wallShadow: '#1e3242' },
    { name: 'THE INFERNO',   tint: 'rgba(200,30,10,0.14)',    speck: '#ff5a1c',      texture: 'ember',
      skin: '#ff5a3a', shot: '#ff7a2a',
      wallFill: '#3a2626', wallAlt: '#402a28', wallBorder: '#7a4033', wallShadow: '#241414' },
    // the boss biome: waves 41-50 climb to THE VAULT KEEPER
    { name: 'THE VAULT',     tint: 'rgba(70,35,110,0.26)',    speck: '#c9a227',      texture: 'vault',
      skin: '#c9a227', shot: '#c9a227',
      wallFill: '#2a2035', wallAlt: '#332744', wallBorder: '#c9a227', wallShadow: '#171021' }
  ];
  // 1-40: the four biome chapters; 41-50: THE VAULT (boss biome);
  // 51+: back into the catacombs for the endless waves.
  function currentBiome() {
    var w = game.wave || 1;
    if (w > 50) return BIOMES[0];
    if (w > 40) return BIOMES[4];
    return BIOMES[Math.floor((w - 1) / 10) % 4];
  }

  var floorTiles = [];
  function buildFloor() {
    floorTiles = [];
    var cols = Math.ceil(W / TILE_SIZE);
    var rows = Math.ceil(H / TILE_SIZE);
    for (var ry = 0; ry < rows; ry++) {
      for (var rx = 0; rx < cols; rx++) {
        var r = Math.random();
        var variant = 0;            // normal floor
        if (r < 0.12) variant = 1;  // shadow/dark tile
        else if (r < 0.20) variant = 2; // alt floor
        // procedural grey shade variation
        var shade = randInt(36, 52);
        floorTiles.push({ x: rx * TILE_SIZE, y: ry * TILE_SIZE, variant: variant, shade: shade });
      }
    }
  }
  buildFloor();

  // ---------------------------------------------------------------------------
  // UPGRADE DEFINITIONS

  function toastNeedCoins(price) {

  // Buy the next level of a tome with coins.
  function tryBuyShopItem(idx) {
    var item = SHOP_ITEMS[idx];
    if (!item) return;
    var lvl = runData.shop[item.id] || 0;
    if (lvl >= 5) return;
    var price = SHOP_PRICES[lvl];
    if (runData.coins < price) {
      toastNeedCoins(price);
      return;
    }
    spendCoins(price);
    runData.shop[item.id] = lvl + 1;
    // first level bought auto-equips it if there's a free slot (nice default)
    if (lvl === 0 && runData.equippedTomes.indexOf(item.id) === -1 &&
        runData.equippedTomes.length < MAX_EQUIPPED_TOMES) {
      runData.equippedTomes.push(item.id);
    }
    saveRunData();
    playPickup();
  }

  function isTomeEquipped(id) {
    return runData.equippedTomes.indexOf(id) !== -1;
  }

  // Equipped tome level (0 if not equipped, or in Daily where tomes are off for
  // a level playing field). Used everywhere a tome bonus is applied.
  function tomeLevel(id) {
    return isTomeEquipped(id) ? (runData.shop[id] || 0) : 0;
  }

  // opaque blend of hex over base: drawPanel paints the border colour under the
  // fill, so a see-through fill shows the border through it
  function mixHex(hex, base, t) {
    var a = hex.replace('#', ''), b = base.replace('#', ''), out = '#';
    for (var i = 0; i < 6; i += 2) {
      var v = Math.round(parseInt(b.slice(i, i + 2), 16) * (1 - t) + parseInt(a.slice(i, i + 2), 16) * t);
      out += (v < 16 ? '0' : '') + v.toString(16);
    }
    return out;
  }

  function hexToRgba(hex, a) {
    var h = hex.replace('#', '');
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // ---- hero skins ----
  function skinOwned(id) {
    // default skins are always owned/free
    return id.indexOf('_default') !== -1 || !!runData.skinsOwned[id];
  }
  function equippedSkinId(classId) {
    return runData.equippedSkins[classId] || (classId + '_default');
  }
  function skinById(classId, id) {
    var list = SKINS[classId] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return list[0];
  }
  function epicUnlocked() { return (runData.bestWave || 1) >= EPIC_SKIN_WAVE; }

  // The chroma tint colour for epic skins, morphing hue over time.
  function chromaColor() {
    return 'hsl(' + Math.floor((uiTime * 90) % 360) + ',95%,58%)';
  }

  // Buy (two-tap confirm), equip, or report why a skin can't be selected.
  function selectSkin(classId, id) {
    var skin = skinById(classId, id);
    if (!skin) return;
    if (skinOwned(id)) {
      skinPending = null;
      runData.equippedSkins[classId] = id;
      saveRunData();
      playPickup();
      return;
    }
    if (skin.tier === 'epic' && !epicUnlocked()) {
      skinPending = null;
      game.toasts.push({ txt: 'REACH WAVE ' + EPIC_SKIN_WAVE + ' TO UNLOCK', t: 0 });
      return;
    }
    if (skinPending === id) {
      skinPending = null;
      if (runData.coins >= skin.price) {
        spendCoins(skin.price);
        runData.skinsOwned[id] = true;
        runData.equippedSkins[classId] = id; // equip on purchase
        saveRunData();
        game.toasts.push({ txt: skin.name + ' UNLOCKED!', t: 0 });
      } else {
        toastNeedCoins(skin.price);
      }
    } else if (runData.coins >= skin.price) {
      skinPending = id;
    } else {
      toastNeedCoins(skin.price);
    }
  }

  // Toggle a tome in/out of the 3-slot loadout. Returns a message for the UI.
  function toggleTomeEquip(idx) {
    var item = SHOP_ITEMS[idx];
    if (!item) return;
    var pos = runData.equippedTomes.indexOf(item.id);
    if (pos !== -1) {
      runData.equippedTomes.splice(pos, 1);
      saveRunData();
      return;
    }
    if ((runData.shop[item.id] || 0) < 1) {
      game.toasts.push({ txt: 'BUY THIS TOME FIRST', t: 0 });
      return;
    }
    if (runData.equippedTomes.length >= MAX_EQUIPPED_TOMES) {
      game.toasts.push({ txt: 'ALL ' + MAX_EQUIPPED_TOMES + ' SLOTS ARE FULL. UNEQUIP ONE', t: 0 });
      return;
    }
    runData.equippedTomes.push(item.id);
    saveRunData();
  }

  // ---------------------------------------------------------------------------
  // PERSISTENT RUN DATA (localStorage)
  // ---------------------------------------------------------------------------
  // fresh-start key for the public release — deliberately no migration from
  // the pre-release cryptvault/kryptvault keys
  var SAVE_KEY = 'kryptvault_save';

  function defaultRunData() {
    return { bestWave: 1, bestKills: 0, bestLevel: 1, totalRuns: 0, totalKills: 0,
             unlockedClasses: false, name: '', coins: 0,
             // coins = coinsEarned - coinsSpent; both only grow, so merging
             // two devices by max can't refund a purchase or drop earnings
             coinsEarned: 0, coinsSpent: 0,
             seenFeedbackPrompt: false,
             playerDisc: '', playerSecret: '', playerId: '',
             shop: { vit: 0, mig: 0, swf: 0, wis: 0, frt: 0 },
             equippedTomes: [], // up to 3 tome ids active per run
             classesOwned: {}, // coin-unlocked classes (e.g. ranger); base 3 are free
             skinsOwned: {}, equippedSkins: {}, // coin-bought hero skins (per class)
             };
  }

  function earnCoins(n) {
    runData.coinsEarned += n;
    runData.coins = runData.coinsEarned - runData.coinsSpent;
  }
  function spendCoins(n) {
    runData.coinsSpent += n;
    runData.coins = runData.coinsEarned - runData.coinsSpent;
  }

  function saveRunData() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(runData)); } catch (e) { /* storage unavailable */ }
    progressDirty = true; // ship it upstream on the next sync tick
  }

  function sameKind(v, d) {
    if (Array.isArray(d)) return Array.isArray(v);
    if (d && typeof d === 'object') return !!v && typeof v === 'object' && !Array.isArray(v);
    if (typeof d === 'number') return typeof v === 'number' && isFinite(v);
    return typeof v === typeof d;
  }

  function loadRunData() {
    var def = defaultRunData();
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return def;
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || Array.isArray(data)) return def;
      var hadLoadout = Array.isArray(data.equippedTomes);
      var hadLedger = typeof data.coinsEarned === 'number' && typeof data.coinsSpent === 'number';
      // a missing or wrong-typed field (hand-edited or damaged save) falls
      // back to its default instead of breaking a screen later
      for (var k in def) if (!sameKind(data[k], def[k])) data[k] = def[k];
      for (var t in def.shop) if (!sameKind(data.shop[t], 0)) data.shop[t] = 0;
      // saves from before the earned/spent totals start from their balance; a
      // balance changed since by an older version of the game is kept too
      if (!hadLedger) { data.coinsEarned = data.coins; data.coinsSpent = 0; }
      var drift = data.coins - (data.coinsEarned - data.coinsSpent);
      if (drift > 0) data.coinsEarned += drift; else if (drift < 0) data.coinsSpent -= drift;
      // migrate players from the old always-on perks: auto-equip their 3
      // highest-level tomes, once (an empty loadout chosen later must stick)
      if (!hadLoadout) {
        var leveled = ['vit', 'mig', 'swf', 'wis', 'frt']
          .filter(function (id) { return (data.shop[id] || 0) > 0; })
          .sort(function (a, b) { return (data.shop[b] || 0) - (data.shop[a] || 0); });
        data.equippedTomes = leveled.slice(0, 3);
      }
      return data;
    } catch (e) {
      // malformed JSON from an older version — reset the stored key to defaults
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(def)); } catch (e2) {}
      return def;
    }
  }

  var runData = loadRunData();

  // ---------------------------------------------------------------------------
  // GLOBAL LEADERBOARD (Vercel functions in /api, backed by Neon Postgres)
  // ---------------------------------------------------------------------------
  var API_SCORES = API_BASE + '/api/scores';
  var API_RPC = API_BASE + '/api/rpc/';

  // cb gets the result, or undefined on a network error or after 10 seconds
  function sbRpc(fn, body, cb) {
    var done = false;
    function finish(v) { if (!done) { done = true; clearTimeout(timer); cb(v); } }
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); finish(undefined); }, 10000);
    fetch(API_RPC + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { return r.json(); })
      .then(finish)
      .catch(function () { finish(undefined); });
  }

  // ---------------------------------------------------------------------------
  // CROSS-DEVICE PROGRESS SYNC — the account carries your save, not just your
  // name. Progress uploads on every meaningful change (debounced) and comes
  // back down on login and on boot, merged so nothing earned is ever lost.
  // ---------------------------------------------------------------------------
  function collectProgress() {
    return {
      bestWave: runData.bestWave, bestKills: runData.bestKills, bestLevel: runData.bestLevel,
      totalRuns: runData.totalRuns, totalKills: runData.totalKills,
      coins: Math.round(runData.coins),
      coinsEarned: runData.coinsEarned, coinsSpent: runData.coinsSpent,
      shop: runData.shop, equippedTomes: runData.equippedTomes,
      classesOwned: runData.classesOwned,
      skinsOwned: runData.skinsOwned, equippedSkins: runData.equippedSkins,
      unlockedClasses: runData.unlockedClasses,
      seenFeedbackPrompt: runData.seenFeedbackPrompt
    };
  }

  // merge server progress into the local save: numbers take the max, owned
  // sets take the union — playing on two devices can only ever add up
  function applyProgress(sp) {
    if (!sp) return;
    ['bestWave', 'bestKills', 'bestLevel', 'totalRuns', 'totalKills'].forEach(function (k) {
      if (typeof sp[k] === 'number') runData[k] = Math.max(runData[k] || 0, sp[k]);
    });
    // coins: max of each total, never of the balance (that refunded purchases)
    var spSpent = typeof sp.coinsSpent === 'number' ? sp.coinsSpent : 0;
    var spEarned = typeof sp.coinsEarned === 'number' ? sp.coinsEarned
                 : (typeof sp.coins === 'number' ? sp.coins + spSpent : 0);
    runData.coinsEarned = Math.max(runData.coinsEarned, spEarned);
    runData.coinsSpent = Math.max(runData.coinsSpent, spSpent);
    runData.coins = Math.max(0, runData.coinsEarned - runData.coinsSpent);
    if (sp.shop) for (var t in runData.shop) runData.shop[t] = Math.max(runData.shop[t] || 0, sp.shop[t] || 0);
    if (sp.classesOwned) for (var c in sp.classesOwned) if (sp.classesOwned[c]) runData.classesOwned[c] = true;
    if (sp.skinsOwned) for (var sk in sp.skinsOwned) if (sp.skinsOwned[sk]) runData.skinsOwned[sk] = true;
    if (sp.equippedSkins) for (var es in sp.equippedSkins) {
      if (!runData.equippedSkins[es]) runData.equippedSkins[es] = sp.equippedSkins[es];
    }
    if (sp.equippedTomes && sp.equippedTomes.length && runData.equippedTomes.length === 0) {
      runData.equippedTomes = sp.equippedTomes.slice(0, 3);
    }
    if (sp.unlockedClasses) runData.unlockedClasses = true;
    if (sp.seenFeedbackPrompt) runData.seenFeedbackPrompt = true;
    saveRunData();
  }

  function syncProgressUp() {
    if (!runData.playerId || !runData.playerSecret) return;
    progressDirty = false;
    sbRpc('save_progress', {
      p_id: runData.playerId,
      p_secret: runData.playerSecret,
      p_progress: collectProgress()
    }, function (ok) {
      if (ok === undefined) progressDirty = true; // network failure: try again next tick
    });
  }

  // pull on boot so a device you logged into earlier catches up with
  // progress made elsewhere since (login_player doubles as the fetch)
  function syncProgressDown() {
    if (!runData.playerId || !runData.playerSecret || !runData.name) return;
    sbRpc('login_player', {
      p_name: runData.name, p_disc: runData.playerDisc, p_secret: runData.playerSecret
    }, function (res) {
      if (res && res.id) {
        applyProgress(res.progress);
        syncProgressUp(); // push the merged state back
      }
    });
  }

  // debounce: saveRunData marks dirty; a slow timer ships changes upstream
  var progressDirty = false;
  setInterval(function () {
    if (progressDirty) syncProgressUp();
  }, 8000);

  // ---------------------------------------------------------------------------
  // PLAYER ACCOUNTS — tag (MAR#1234) + secret vault key, portable across PCs
  // ---------------------------------------------------------------------------
  var account = { state: 'idle' };       // idle | creating | created | error
  var loginForm = { buf: '', state: 'idle' }; // buf: 3 letters + 4 digits + 8 key chars

  function playerTag() {
    if (!runData.name) return '';
    return runData.name + (runData.playerDisc ? '#' + runData.playerDisc : '');
  }

  // a reply that arrives after the player moved on (new name, left the login
  // screen, retried) is ignored: a late one used to swap accounts mid-run
  var registerSeq = 0, loginSeq = 0;

  function registerAccount(silentToast) {
    account.state = 'creating';
    var seq = ++registerSeq;
    sbRpc('register_player', { p_name: runData.name }, function (res) {
      if (seq !== registerSeq) return;
      if (res && res.disc) {
        runData.playerDisc = res.disc;
        runData.playerSecret = res.secret;
        runData.playerId = res.id;
        saveRunData();
        syncProgressUp(); // seed the fresh account with any local progress
        account.state = 'created';
        if (silentToast) {
          game.toasts.push({ txt: 'ACCOUNT CREATED: ' + playerTag(), t: 0 });
        }
      } else {
        account.state = 'error';
      }
    });
  }

  function submitLogin() {
    if (loginForm.buf.length !== 15) return;
    loginForm.state = 'checking';
    var nm = loginForm.buf.slice(0, 3);
    var dc = loginForm.buf.slice(3, 7);
    var ky = loginForm.buf.slice(7, 15);
    var seq = ++loginSeq;
    sbRpc('login_player', { p_name: nm, p_disc: dc, p_secret: ky }, function (res) {
      if (seq !== loginSeq) return;
      if (res && res.id) {
        runData.name = nm;
        runData.playerDisc = dc;
        runData.playerSecret = ky;
        runData.playerId = res.id;
        registerSeq++;  // a registration still in flight belongs to the old identity
        saveRunData(); // an account with no synced progress still has to stick
        // restore everything earned on other devices, then push the merge back
        applyProgress(res.progress);
        syncProgressUp();
        loginForm.state = 'idle';
        loginForm.buf = '';
        loginInput.value = '';
        game.toasts.push({ txt: 'LOGGED IN AS ' + playerTag(), t: 0 });
        if (game.gameState === 'login') game.gameState = 'title';
      } else {
        loginForm.state = res === null ? 'fail' : 'offline';
        loginForm.buf = loginForm.buf.slice(0, 7); // keep tag, clear the key
        loginInput.value = loginForm.buf;          // keep the field in sync
      }
    });
  }

  var leaderboard = { rows: [], state: 'idle', fetchedAt: 0, submitState: '', mode: 'normal' };

  function fetchLeaderboard() {
    if (leaderboard.state === 'loading') return;
    leaderboard.state = 'loading';
    // fetch deep, then keep only each player's best run so one grinder
    // can't occupy half the board
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    fetch(API_SCORES, { signal: ctrl ? ctrl.signal : undefined }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('scores ' + r.status); // an outage is not an empty board
      return r.json();
    }).then(function (rows) {
      if (!Array.isArray(rows)) throw new Error('bad scores');
      var best = [], seen = {};
      if (Array.isArray(rows)) {
        for (var i = 0; i < rows.length && best.length < 10; i++) {
          var tag = rows[i].name + '#' + (rows[i].disc || '');
          if (seen[tag]) continue;
          seen[tag] = true;
          best.push(rows[i]);
        }
      }
      leaderboard.rows = best;
      leaderboard.state = 'loaded';
      leaderboard.fetchedAt = Date.now();
    }).catch(function () {
      leaderboard.state = 'error';
    });
  }

  function maybeRefreshLeaderboard() {
    if (leaderboard.state === 'idle' || leaderboard.state === 'error' ||
        Date.now() - leaderboard.fetchedAt > 30000) {
      fetchLeaderboard();
    }
  }

  function submitScore() {
    if (!runData.name || runData.name.length !== 3) return;
    leaderboard.submitState = 'sending';
    fetch(API_SCORES, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: runData.name,
        wave: game.wave,
        kills: Math.min(99999, game.score),
        level: Math.min(99, game.level),
        cls: currentClass,
        mode: game.mode,
        disc: runData.playerDisc || null,
        player_id: runData.playerId || null,
        secret: runData.playerSecret || null, // proves the tag is yours (the server checks it)
        ver: GAME_VERSION,
        // build analytics: upgrade counts + chosen ascendancy (asc_* key)
        upgrades: game.player ? game.player.upgradesTaken : null
      })
    }).then(function (r) {
      leaderboard.submitState = r.ok ? 'done' : 'error';
      if (r.ok) fetchLeaderboard();
    }).catch(function () {
      leaderboard.submitState = 'error';
    });
  }

  function classDef(id) {
    for (var i = 0; i < CLASSES.length; i++) if (CLASSES[i].id === id) return CLASSES[i];
    return CLASSES[0];
  }
  function classIndex(id) {
    for (var i = 0; i < CLASSES.length; i++) if (CLASSES[i].id === id) return i;
    return 0;
  }
  function prevClassId(id) { return CLASSES[(classIndex(id) + CLASSES.length - 1) % CLASSES.length].id; }
  function nextClassId(id) { return CLASSES[(classIndex(id) + 1) % CLASSES.length].id; }

  }


  // Shared select/purchase logic for both click and number-key input.
  function selectClassByIndex(i) {
    var cls = CLASSES[i];
    if (!cls) return;
    if (classOwned(cls)) {
      classUnlockPending = null;
      currentClass = cls.id;
      startGame();
      return;
    }
    // locked class: first tap arms the buy, second confirms (guards a 10k misclick)
    if (classUnlockPending === cls.id) {
      classUnlockPending = null;
      if (runData.coins >= cls.price) {
        spendCoins(cls.price);
        runData.classesOwned[cls.id] = true;
        saveRunData();
        game.toasts.push({ txt: cls.name + ' UNLOCKED!', t: 0 });
      } else {
        toastNeedCoins(cls.price);
      }
    } else if (runData.coins >= cls.price) {
      classUnlockPending = cls.id;
    } else {
      toastNeedCoins(cls.price);
    }
  }

  // ---------------------------------------------------------------------------
  // PROCEDURAL DUNGEON WALLS (seeded per wave — same wave, same layout)
  // ---------------------------------------------------------------------------
  var walls = [];

  function generateWalls(waveNumber) {
    // seed MUST be re-derived from the wave number on every call so layouts
    // are reproducible — never reuse leftover PRNG state from a prior wave.
    // Daily challenge: everyone gets the same layouts for the same date.
    var seed = waveNumber * 9301 + 49297;
    var srand = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var sizes = [[32, 32], [32, 64], [64, 32]];
    var count = 8 + Math.floor(srand() * 5); // 8..12 chunks
    var out = [];
    for (var i = 0; i < count; i++) {
      for (var attempt = 0; attempt < 10; attempt++) {
        var size = sizes[Math.floor(srand() * 3)];
        var cw = size[0], ch = size[1];
        var x = Math.round(30 + srand() * (W - 60 - cw));
        var y = Math.round(30 + srand() * (H - 60 - ch));
        // keep clear of the player spawn at canvas centre (80px radius)
        var nx = clamp(W / 2, x, x + cw), ny = clamp(H / 2, y, y + ch);
        var cdx = W / 2 - nx, cdy = H / 2 - ny;
        if (cdx * cdx + cdy * cdy < 80 * 80) continue;
        // no overlap with already-placed walls
        var hit = false;
        for (var j = 0; j < out.length; j++) {
          var o = out[j];
          if (x < o.x + o.w && x + cw > o.x && y < o.y + o.h && y + ch > o.y) { hit = true; break; }
        }
        if (hit) continue;
        // each biome's special blocks behave differently (waves <= 50; the
        // endless crypt is solid):
        //   1-10  BRICK  breakable, 3 hits
        //   11-20 SAND   soft mound — wade through at half speed
        //   21-30 ICE    brittle, 2 hits; shattering chills nearby foes
        //   31-40 MAGMA  solid, sears anyone pressed against it
        //   41-50 GILDED tough (4 hits) but always drops loot
        var kind = null;
        if (waveNumber <= 50 && srand() < 0.3) {
          var bIdx = waveNumber > 40 ? 4 : Math.floor((waveNumber - 1) / 10) % 4;
          kind = ['brick', 'sand', 'ice', 'magma', 'gilded'][bIdx];
        }
        var wObj = { x: x, y: y, w: cw, h: ch, tileVariant: Math.floor(srand() * 2), kind: kind };
        if (kind === 'brick')  { wObj.breakable = true; wObj.bhp = 3; }
        else if (kind === 'ice')    { wObj.breakable = true; wObj.bhp = 2; }
        else if (kind === 'gilded') { wObj.breakable = true; wObj.bhp = 4; }
        if (wObj.breakable) wObj.bhpMax = wObj.bhp;
        else if (kind === 'sand')   { wObj.soft = true; }
        else if (kind === 'magma')  { wObj.magma = true; }
        out.push(wObj);
        break;
      }
    }
    return out;
  }

  // First wall intersecting a centred box, or null. Soft sand mounds never
  // block anything — they slow instead (see softAt).
  function boxHitsWall(cx, cy, bw, bh) {
    var l = cx - bw / 2, r = cx + bw / 2, t = cy - bh / 2, b = cy + bh / 2;
    for (var i = 0; i < walls.length; i++) {
      var wl = walls[i];
      if (wl.soft) continue;
      if (l < wl.x + wl.w && r > wl.x && t < wl.y + wl.h && b > wl.y) return wl;
    }
    return null;
  }

  // Is the box wading through a soft sand mound?
  function softAt(cx, cy, bw, bh) {
    var l = cx - bw / 2, r = cx + bw / 2, t = cy - bh / 2, b = cy + bh / 2;
    for (var i = 0; i < walls.length; i++) {
      var wl = walls[i];
      if (wl.soft && l < wl.x + wl.w && r > wl.x && t < wl.y + wl.h && b > wl.y) return true;
    }
    return false;
  }

  // Nudge an entity out of any wall it overlaps (used when a new wave's wall
  // layout lands on top of carried-over enemies or the player).
  function pushOutOfWalls(ent) {
    for (var tries = 0; tries < 4; tries++) {
      var wl = boxHitsWall(ent.x, ent.y, ent.w, ent.h);
      if (!wl) return;
      var dl = (ent.x + ent.w / 2) - wl.x;
      var dr = (wl.x + wl.w) - (ent.x - ent.w / 2);
      var du = (ent.y + ent.h / 2) - wl.y;
      var dd = (wl.y + wl.h) - (ent.y - ent.h / 2);
      var m = Math.min(dl, dr, du, dd);
      if (m === dl) ent.x -= dl + 1;
      else if (m === dr) ent.x += dr + 1;
      else if (m === du) ent.y -= du + 1;
      else ent.y += dd + 1;
      ent.x = clamp(ent.x, ent.w / 2, W - ent.w / 2);
      ent.y = clamp(ent.y, ent.h / 2, H - ent.h / 2);
    }
    if (!boxHitsWall(ent.x, ent.y, ent.w, ent.h)) return;
    // squeezed between two walls (the nudges bounced back and forth): search
    // outward for the nearest free spot instead of leaving it stuck inside
    var ox = ent.x, oy = ent.y;
    for (var r = 4; r <= 200; r += 4) {
      for (var a = 0; a < 16; a++) {
        var nx = clamp(ox + Math.cos(a * Math.PI / 8) * r, ent.w / 2, W - ent.w / 2);
        var ny = clamp(oy + Math.sin(a * Math.PI / 8) * r, ent.h / 2, H - ent.h / 2);
        if (!boxHitsWall(nx, ny, ent.w, ent.h)) { ent.x = nx; ent.y = ny; return; }
      }
    }
  }

  // ---------------------------------------------------------------------------
  // GAME STATE
  // ---------------------------------------------------------------------------
  var game = {
    gameState: 'title',
    enemies: [],
    projectiles: [],
    particles: [],
    wave: 1,
    xp: 0,
    level: 1,
    score: 0, // kills
    spawnTimer: 0,
    waveKills: 0,
    waveTarget: 0,
    waveIntroTimer: 0,    // countdown for the 'waveintro' card
    bossWave: false,      // is the current wave a boss wave?
    boss: null,           // reference to the live boss (or null)
    advanceAfterLevel: false, // after a forced boss level-up, start next wave
    damageFlash: 0,
    shakeTimer: 0,
    whiteFlash: 0,        // seconds of full-screen white flash (boss death)
    time: 0,              // running game time in seconds
    enemyUid: 0,          // unique id source for enemies
    scanlineOffset: 0,
    blinkTimer: 0,
    blinkOn: true,
    cards: [],
    shockwaves: [],       // active edge-shockwave effects
    enemyShots: [],       // cultist projectiles
    floatTexts: [],       // floating damage/heal numbers
    pickups: [],          // dropped potions/bombs/frenzy
    hitStop: 0,           // brief world freeze on kills (game feel)
    toasts: [],           // achievement popups
    zaps: [],             // static-burst lightning visuals
    beams: [],            // radiant-beam visuals (light mage active)
    zones: [],            // spike-trap damage zones (trapper active)
    pactBooms: [],        // dark pact: queued kill-explosions
    spawnHaste: 1,        // haste pact speeds up spawning
    freezeTimer: 0,       // chrono pickup freezes enemies
    coinsEarned: 0,       // coins banked at the end of the run
    mode: 'normal',       // kept for score-row compatibility
    waveBanner: 0,        // fading "WAVE NN" banner timer (continuous flow)
    curseHpMult: 1,       // cursed-upgrade modifiers, reset each run
    curseSpeedMult: 1,
    cultistLevel: 0,
    dmgDealt: 0,          // run summary stat
    dmgBySource: {},      // damage attribution per source (shot/orb/static/bomb/...)
    newRecord: false,     // did the last run break a personal best?
    player: null
  };

  // Tally damage dealt, both total and per-source (for the game-over breakdown).
  function addDmg(amount, source) {
    game.dmgDealt += amount;
    game.dmgBySource[source] = (game.dmgBySource[source] || 0) + amount;
  }

  function makePlayer() {
    return {
      x: W / 2, y: H / 2,
      w: 12, h: 16,
      speed: 80,
      hp: 100, maxHp: 100,
      facing: 1,
      moving: false,
      walkAnim: 0,
      attackCooldown: 0.8,
      attackTimer: 0,
      frenzyTimer: 0,    // pickup: halves cooldown while > 0
      invuln: 0,         // i-frames after taking a hit
      coinMult: 1,       // greed curse doubles this
      // upgrade-driven stats
      projectiles: 1,
      damage: 20,
      shotSpeed: 200,    // projectile velocity, reduced by some upgrade cons
      pierce: 0,
      homingBase: 0,     // innate homing (mage class) without the upgrade
      vampire: 0,
      xpMult: 1,
      shotgun: 0,        // shotgun blast level
      homing: 0,         // homing shot level
      shield: 0,         // orbiting shield level
      seekerSwarm: 0,    // evolution flags
      bladeOrbit: 0,
      railgun: 0,
      bulletstorm: 0,
      deathseeker: 0,
      frost: 0,          // slow-on-hit level
      ricochet: 0,       // bounce count
      regen: 0,          // HP per second
      staticLvl: 0,      // periodic zap level
      staticTimer: 2.5,
      healMult: 1,       // blood altar halves this
      barrier: 0,        // pickup: hits absorbed
      orbs: [],          // orbiting shield orbs
      orbRadius: 40,
      orbSpeed: 0,       // radians/sec
      // v0.5 card stats
      critMult: 2,       // crit damage multiplier (executioner raises it)
      projSize: 0,       // heavy shot stacks (bigger hitbox)
      armor: 0,          // iron skin: fraction of damage ignored
      lucky: 0,          // lucky charm: pickup drop multiplier stacks
      pactLvl: 0,        // dark pact: kills explode
      retribution: 0,    // thorns stacks
      boomRadiusMult: 1, // bombardier DEMOLITIONIST passive scales kill-blasts
      chainBonus: 0,     // bombardier CHAIN REACTOR passive: +1 wider ring
      vampBudget: 0,     // lifesteal available this second (refilled in update)
      vampTick: 0,       // refill timer
      // ascendancy (subclass drafted after the first boss)
      ascendancy: null,  // the chosen ASCENDANCIES entry
      abilityCd: 0,      // seconds until the active can fire again
      abilityMaxCd: 0,   // for the HUD cooldown sweep
      chargeT: 0,        // juggernaut: seconds of charge left
      chargeVx: 0, chargeVy: 0,
      chargeHits: null,  // enemies already trampled this charge
      critChance: 0,     // assassin passive
      ascendDR: 0,       // juggernaut passive (extra damage reduction)
      upgradesTaken: {}
    };
  }

  // Rebuild the orbiting-shield orbs from the current shield level.
  function rebuildOrbs() {
    var p = game.player;
    var count = 4 + p.shield;                              // 1st pick = 5 orbs, +1 each after
    if (p.bladeOrbit) count += 2;                          // evolution: +2 orbs
    p.orbSpeed = (190 + (p.shield - 1) * 35) * Math.PI / 180; // 190deg/s, +35 per extra pick
    if (p.bladeOrbit) p.orbSpeed *= 1.5;                   // evolution: faster spin
    var orbs = [];
    for (var i = 0; i < count; i++) {
      orbs.push({ angle: (Math.PI * 2 / count) * i, x: p.x, y: p.y, hitCd: {} });
    }
    p.orbs = orbs;
    p.orbRadius = 40;
  }

  function startGame() {
    game.particles = [];
    game.xp = 0;
    game.level = 1;
    game.score = 0;
    game.damageFlash = 0;
    game.shakeTimer = 0;
    game.whiteFlash = 0;
    game.time = 0;
    game.enemyUid = 0;
    game.advanceAfterLevel = false;
    game.pendingLevelUps = 0;
    game.draftLock = 0;
    game.newRecord = false;
    game.enemyShots = [];
    game.waveBanner = 0;
    game.endlessBanner = 0;
    game.curseHpMult = 1;
    game.curseSpeedMult = 1;
    game.cultistLevel = 0;
    game.dmgDealt = 0;
    game.dmgBySource = {};
    game.floatTexts = [];
    game.pickups = [];
    game.hitStop = 0;
    game.lastHitStop = -1;
    game.zaps = [];
    game.beams = [];
    game.zones = [];
    game.pactBooms = [];
    game.spawnHaste = 1;
    game.freezeTimer = 0;
    game.coinsEarned = 0;
    game.mode = 'normal';
    leaderboard.submitState = '';
    game.player = makePlayer();
    // every run starts with the chosen class's stats
    var cls = classDef(currentClass);
    var pl = game.player;
    pl.maxHp = cls.hp; pl.hp = cls.hp;
    pl.speed = cls.speed;
    pl.damage = cls.damage;
    pl.attackCooldown = cls.cooldown;
    pl.pierce = cls.pierce;
    pl.homingBase = cls.homingBase;
    if (cls.shotSpeed) pl.shotSpeed = cls.shotSpeed; // ranger: fast arrows
    // equipped tomes on top of class stats (only the 3 equipped apply; none in Daily)
    pl.maxHp += 20 * tomeLevel('vit'); pl.hp = pl.maxHp;
    pl.damage = Math.round(pl.damage * (1 + 0.1 * tomeLevel('mig')));
    pl.speed += 5 * tomeLevel('swf');
    pl.xpMult *= (1 + 0.1 * tomeLevel('wis'));
    buildFloor();
    beginWave(1);
    setMusicTrack(combatTrackName());
  }

  // Set up a wave. Wave 1 gets the frozen 2-second intro card; later waves
  // flow continuously — surviving enemies carry over and a banner fades in.
  function beginWave(n) {
    game.wave = n;
    game.bossWave = (n % 10 === 0); // bosses are biome finales (10/20/30...)
    // the Keeper has fallen: the crypt opens into the endless waves
    if (n === 51) game.endlessBanner = 5;
    // crossing into a new biome swaps the doom track (no-op mid-biome)
    if (music.playing) setMusicTrack(combatTrackName());
    game.boss = null;
    game.waveKills = 0;
    game.waveTarget = game.bossWave ? 1 : (15 + n * 5);
    game.spawnTimer = 0;
    game.shockwaves = [];
    walls = generateWalls(n);
    bgDirty = true; // new wall layout (and possibly biome) — recache the background
    // free anything the new wall layout trapped, and reset edge flags
    for (var ce = 0; ce < game.enemies.length; ce++) {
      pushOutOfWalls(game.enemies[ce]);
      game.enemies[ce].atEdge = false;
      game.enemies[ce].edgeTimer = 0;
    }
    if (game.player) pushOutOfWalls(game.player);
    if (n === 1) {
      game.enemies = [];
      game.projectiles = [];
      game.enemyShots = [];
      game.gameState = 'waveintro';
      game.waveIntroTimer = 2.0;
    } else {
      game.waveBanner = 2.0;
      game.gameState = 'playing';
      // no wave-transition heal — HP only changes from combat, pickups and upgrades
      if (game.bossWave) spawnBoss();
    }
  }

  // ---------------------------------------------------------------------------
  // ENEMY FACTORY
  // ---------------------------------------------------------------------------
  function enemyTypeForWave(wave) {
    var roll = Math.random();
    if (wave >= 5 && roll < 0.10) return 'wraith';
    if (wave >= 3 && roll < 0.22) return 'bomber';
    if (wave >= 2 && roll < 0.36) return 'splitter';
    if (wave >= 6 && roll < 0.44) return 'caster'; // the biome's ranged menace
    if (wave >= 4 && roll < 0.55) return 'orc';
    if (roll < 0.75) return 'skeleton';
    return 'slime';
  }

  var ENEMY_DATA = {
    skeleton: { hp: 30, color: '#8b9bb4', tile: TILE.skeleton },
    slime:    { hp: 50, color: '#43e1b3', tile: TILE.slime },
    orc:      { hp: 120, color: '#e84537', tile: TILE.orc },
    cultist:  { hp: 45, color: '#9b59b6', tile: TILE.skeleton },
    caster:   { hp: 40, color: '#b06ce8', tile: TILE.skeleton }, // biome mage: archer/spitter/ice mage/fire imp
    splitter: { hp: 70, color: '#7ad9a8', tile: TILE.slime },     // splits into minis
    mini:     { hp: 16, color: '#43e1b3', tile: TILE.slime },     // splitter offspring
    bomber:   { hp: 35, color: '#ff7733', tile: TILE.orc },       // suicide explosion
    wraith:   { hp: 25, color: '#ccccff', tile: { x: 16, y: 160 } } // ghost: ignores walls
  };

  function spawnEnemy() {
    if (game.enemies.length >= 200) return;
    var type = enemyTypeForWave(game.wave);
    // Dark Pact curse: ranged cultists join the spawn pool
    if (game.cultistLevel > 0 && Math.random() < 0.08 + 0.05 * game.cultistLevel) {
      type = 'cultist';
    }
    var data = ENEMY_DATA[type];
    // pick an edge (not corners): bias spawn away from exact corners
    var edge = randInt(0, 3);
    var x, y;
    if (edge === 0) { x = rand(20, W - 20); y = -16; }          // top
    else if (edge === 1) { x = W + 16; y = rand(20, H - 20); }  // right
    else if (edge === 2) { x = rand(20, W - 20); y = H + 16; }  // bottom
    else { x = -16; y = rand(20, H - 20); }                     // left

    spawnEnemyAt(type, x, y);
  }

  function spawnEnemyAt(type, x, y) {
    var data = ENEMY_DATA[type];
    // early-game ease: 5% softer at wave 1, fading to full by wave 6
    var ease = 1 - Math.max(0, 6 - game.wave) * 0.01;
    // difficulty scaling: +30% HP per wave (plus curses), faster, harder hits
    var hp = Math.round(data.hp * (1 + (game.wave - 1) * 0.3) * game.curseHpMult * ease);
    var speed = (40 + game.wave * 6) * game.curseSpeedMult * ease;
    var size = 14;
    if (type === 'cultist') speed *= 0.8;
    if (type === 'caster') speed *= 0.75;
    if (type === 'wraith') { speed *= 1.35; size = 12; }
    if (type === 'bomber') speed *= 1.15;
    if (type === 'splitter') { speed *= 0.8; size = 16; }
    if (type === 'mini') { speed *= 1.2; size = 10; }
    // cap: past this, enemies overshoot the player every frame and turn
    // into invisible ballistic ghosts (the wave-144 "spawning stopped" bug)
    speed = Math.min(speed, 300);
    var e = {
      type: type, isBoss: false, uid: game.enemyUid++,
      x: x, y: y,
      w: size, h: size,
      hp: hp, maxHp: hp,
      // XP follows base hp, not the scaled value, so curses/waves don't
      // feed the player more XP for the same kill
      xpVal: (data.hp / 5) * (1 + (game.wave - 1) * 0.1),
      color: data.color,
      tile: data.tile,
      speed: speed,
      contact: 10 + Math.floor(game.wave / 3) * 3,
      shootTimer: rand(1.0, 2.0),
      fuse: -1,            // bomber: countdown once armed
      elite: false,
      kx: 0, ky: 0,        // knockback velocity
      hitFlash: 0,
      animPhase: rand(0, Math.PI * 2)
    };
    // biome dress code: melee families wear the biome's palette as a wash,
    // the caster wears it boldly and fires bolts in the biome's colour
    var eB = currentBiome();
    if (type === 'caster') {
      e.skinTint = eB.skin || '#b06ce8';
      e.skinAlpha = 0.55;
      e.shotCol = eB.shot;
    } else if (eB.skin && (type === 'skeleton' || type === 'slime' || type === 'orc' ||
               type === 'splitter' || type === 'mini')) {
      e.skinTint = eB.skin;
      e.skinAlpha = 0.30;
    }
    // elite roll: rare gold-ringed variant, triple HP, juicy XP
    if (game.wave >= 3 && type !== 'mini' && Math.random() < 0.06) {
      e.elite = true;
      e.hp = e.maxHp = e.hp * 3;
      e.xpVal *= 2.5;
      e.speed *= 1.05;
      e.contact += 5;
      e.w += 2; e.h += 2;
    }
    // mid-screen spawns (summoner minions, splitter minis) must not start
    // inside a wall, or they would be stuck on both axes forever
    pushOutOfWalls(e);
    game.enemies.push(e);
    return e;
  }

  // Spawn a single boss from the top-centre of the canvas. Three kinds rotate
  // by boss number, each with its own name, sprite, size and signature move:
  //   charger  → THE WARDEN      (plumed knight; the dash ends in a radial slam)
  //   summoner → THE NECROMANCER (robed lich; alternates summons and soul volleys)
  //   spiral   → THE REVENANT    (giant ghost; phases walls, blinks to the player)
  var BOSS_KINDS = ['charger', 'summoner', 'spiral'];
  var BOSS_DEFS = {
    charger:  { name: 'THE WARDEN',      color: '#ffd700', tile: TILE.bossWarden,   size: 26, draw: 30, speed: 22 },
    summoner: { name: 'THE NECROMANCER', color: '#b06ce8', tile: null,              size: 30, draw: 36, speed: 28 },
    spiral:   { name: 'THE REVENANT',    color: '#7fe8dd', tile: TILE.bossRevenant, size: 24, draw: 32, speed: 30, ghost: true },
    // wave 50 finale: rotates every signature move, enrages below half HP
    keeper:   { name: 'THE VAULT KEEPER', color: '#c9a227', tile: null,             size: 34, draw: 46, speed: 26 }
  };

  function spawnBoss() {
    var kind = game.wave === 50 ? 'keeper'
             : BOSS_KINDS[(Math.round(game.wave / 10) - 1 + 300) % 3];
    var def = BOSS_DEFS[kind];
    // 1.3x: biome-finale bosses hit the end of a 10-wave arc, so they get a
    // little extra bulk over the old every-5 cadence
    var hp = Math.round((600 + game.wave * 80) * 1.3 * game.curseHpMult);
    if (kind === 'keeper') hp = Math.round(hp * 2.2); // the run's true wall
    var boss = {
      type: 'boss', isBoss: true, kind: kind, uid: game.enemyUid++,
      name: def.name, drawSize: def.draw, ghost: !!def.ghost,
      x: W / 2, y: -20,
      w: def.size, h: def.size,
      hp: hp, maxHp: hp,
      color: def.color,
      tile: def.tile,
      speed: def.speed,
      contact: 25,
      aiTimer: 3,          // time until next special (dash/summon/ring)
      dashTimer: 0,        // charger: remaining dash time
      dashVx: 0, dashVy: 0,
      telegraph: 0,        // charger: wind-up before the dash
      blinkTimer: 6,       // revenant: time until the next blink
      blinkPhase: 0,       // revenant: fading out pre-teleport while > 0
      volley: false,       // necromancer: alternates soul volley / summons
      kx: 0, ky: 0,
      hitFlash: 0,
      animPhase: 0
    };
    game.enemies.push(boss);
    game.boss = boss;
  }

  // ---------------------------------------------------------------------------
  // PARTICLES
  // ---------------------------------------------------------------------------
  function spawnDeathParticles(x, y, color) {
    for (var i = 0; i < 8; i++) {
      if (game.particles.length >= 500) break;
      var ang = (Math.PI * 2 / 8) * i + rand(-0.3, 0.3);
      var spd = rand(40, 110);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.5, maxLife: 0.5,
        size: 2,
        color: color
      });
    }
  }

  // Floating combat text (damage numbers, heals, pickups).
  function spawnFloatText(x, y, txt, color) {
    if (game.floatTexts.length >= 80) return;
    game.floatTexts.push({ x: x + rand(-4, 4), y: y - 8, txt: txt, color: color, t: 0, life: 0.55 });
  }

  // Small grey sparks where a projectile strikes a wall.
  function spawnWallSparks(x, y) {
    for (var i = 0; i < 3; i++) {
      if (game.particles.length >= 500) break;
      var ang = rand(0, Math.PI * 2);
      var spd = rand(30, 70);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.3, maxLife: 0.3,
        size: 2,
        color: '#99a3ad'
      });
    }
  }

  // Over-the-top boss death burst: 40 red/orange/gold 3x3 particles.
  function bossExplosion(x, y) {
    var cols = ['#ff2d2d', '#ff8c00', '#ffd700'];
    for (var i = 0; i < 40; i++) {
      if (game.particles.length >= 500) break;
      var ang = rand(0, Math.PI * 2);
      var spd = rand(100, 300);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1.2, maxLife: 1.2,
        size: 3,
        color: cols[randInt(0, 2)]
      });
    }
  }

  // ---------------------------------------------------------------------------
  // SHOOTING
  // ---------------------------------------------------------------------------
  // a weaker chill never replaces a stronger one that is still running
  // (frost shots used to cut the frost nova's 60% slow down to 30%)
  function chill(e, amt, secs) {
    if (!(e.slowT > 0) || amt >= (e.slowAmt || 0)) e.slowAmt = amt;
    e.slowT = Math.max(e.slowT || 0, secs);
  }

  function findNearestEnemy(px, py, skip) {
    var best = null, bestD = Infinity;
    for (var i = 0; i < game.enemies.length; i++) {
      var e = game.enemies[i];
      if (skip && skip.indexOf(e) !== -1) continue;
      var dx = e.x - px, dy = e.y - py;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  }

  function spawnProjectile(p, ang, dmg) {
    // berserker passive: +35% damage while below half HP
    if (p.ascendancy && p.ascendancy.id === 'berserker' && p.hp < p.maxHp * 0.5) {
      dmg *= 1.35;
    }
    // crits: chance from Keen Edge/Assassin, multiplier from Executioner
    var crit = p.critChance > 0 && Math.random() < p.critChance;
    if (crit) dmg *= p.critMult;
    game.projectiles.push({
      x: p.x, y: p.y,
      vx: Math.cos(ang) * p.shotSpeed,
      vy: Math.sin(ang) * p.shotSpeed,
      damage: dmg,
      crit: crit,
      pierce: p.railgun ? 99 : p.pierce,
      // deathseeker evolution: crits ricochet to another foe
      bounces: (crit && p.deathseeker) ? 1 : p.ricochet,
      // homing strength: 0.08 base, +0.04 per extra pick; mage has an
      // innate 0.06 without the upgrade.
      homing: Math.max(p.homingBase || 0, p.homing > 0 ? (0.08 + (p.homing - 1) * 0.04) : 0),
      hitSet: []
    });
  }

  function fireWeapon() {
    var p = game.player;
    var target = findNearestEnemy(p.x, p.y);
    if (!target) return;
    var baseAng = Math.atan2(target.y - p.y, target.x - p.x);

    // main fan (multishot)
    var n = p.projectiles;
    var spread = 15 * Math.PI / 180; // 15 degrees between shots
    for (var i = 0; i < n; i++) {
      spawnProjectile(p, baseAng + (i - (n - 1) / 2) * spread, p.damage);
    }

    // shotgun blast: 4 heavy knockback pellets over 50deg, +1 pellet & +10deg
    // per extra pick. Seeker Swarm evolution: +3 pellets at 0.85x.
    if (p.shotgun > 0) {
      var pellets = 4 + (p.shotgun - 1) + (p.seekerSwarm ? 3 : 0);
      var arc = (50 + (p.shotgun - 1) * 10) * Math.PI / 180;
      var pfac = p.seekerSwarm ? 0.85 : 0.75;
      for (var k = 0; k < pellets; k++) {
        var t = pellets > 1 ? (k / (pellets - 1) - 0.5) : 0;
        spawnProjectile(p, baseAng + t * arc, p.damage * pfac);
        var pel = game.projectiles[game.projectiles.length - 1];
        pel.kb = 1;      // pellets shove enemies back
        pel.fat = 1;     // and are drawn/collided fatter
      }
    }

    playShoot();
  }

  // ---------------------------------------------------------------------------
  // XP / LEVEL UP
  // ---------------------------------------------------------------------------
  // cheap first levels so the run gets going, steep later so it can't snowball
  function xpForNext() { return 30 + game.level * 45 + game.level * game.level * 8; }

  function gainXP(amount) {
    game.xp += amount;
    while (game.xp >= xpForNext()) {
      game.xp -= xpForNext();
      game.level++;
      // queue every level gained: one burst of XP can cross several levels,
      // and each one deserves its own draft (they used to overwrite each other)
      game.pendingLevelUps = (game.pendingLevelUps || 0) + 1;
    }
    if (game.pendingLevelUps > 0 && game.gameState === 'playing') {
      game.pendingLevelUps--;
      triggerLevelUp();
    }
  }

  function triggerLevelUp() {
    game.gameState = 'levelup';
    game.draftLock = DRAFT_LOCK;
    game.cardFocus = 0;
    playLevelUp();
    var taken = game.player.upgradesTaken;
    // an unlocked evolution is always offered (first card)
    var chosen = [];
    for (var ev = 0; ev < EVOLUTIONS.length && chosen.length === 0; ev++) {
      var evo = EVOLUTIONS[ev];
      var ready = !taken[evo.id];
      for (var nd = 0; nd < evo.needs.length; nd++) {
        if (!taken[evo.needs[nd]]) ready = false;
      }
      if (ready) chosen.push(evo);
    }
    // fill the remaining slots with distinct regular upgrades; maxed-out
    // cards leave the pool (marathon runs broke every uncapped multiplier)
    var pool = UPGRADES.filter(function (u) {
      return !u.cap || (taken[u.id] || 0) < u.cap;
    });
    while (chosen.length < 3 && pool.length > 0) {
      var idx = randInt(0, pool.length - 1);
      chosen.push(pool.splice(idx, 1)[0]);
    }
    // everything maxed: offer the endless trio so the draft never jams and
    // marathon levels stay a real heal-vs-damage-vs-crit decision
    if (chosen.length === 0) chosen = TRIBUTE_CARDS.slice();
    // build card rects
    var cardW = 120, cardH = 160, gap = 20;
    var totalW = chosen.length * cardW + (chosen.length - 1) * gap;
    var startX = (W - totalW) / 2;
    var cy = (H - cardH) / 2;
    game.cards = chosen.map(function (u, i) {
      return {
        upgrade: u,
        x: startX + i * (cardW + gap),
        y: cy,
        w: cardW, h: cardH
      };
    });
  }

  // raise toward a cap / lower toward a floor, never the wrong way: an
  // evolution can already be past a regular card's cap
  function capUp(v, inc, cap) { return Math.max(v, Math.min(cap, v + inc)); }
  function capDown(v, dec, floor) { return Math.min(v, Math.max(floor, v - dec)); }

  function applyUpgrade(u) {
    var p = game.player;
    p.upgradesTaken[u.id] = (p.upgradesTaken[u.id] || 0) + 1;
    switch (u.id) {
      // every upgrade carries a con; clamps keep heavy stacking survivable
      case 'multishot': p.projectiles = capUp(p.projectiles, 1, p.bulletstorm ? 7 : 5);
                        p.damage = Math.max(5, Math.round(p.damage * 0.88)); break;
      case 'atkspeed':  p.attackCooldown = capDown(p.attackCooldown, 0.1, 0.2);
                        p.shotSpeed = Math.max(100, Math.round(p.shotSpeed * 0.9)); break;
      case 'damage':    p.damage += 15;
                        p.attackCooldown = capUp(p.attackCooldown, 0.05, 1.6); break;
      case 'health':    p.maxHp += 30;
                        // heal half of what's missing — a real panic button
                        p.hp = Math.min(p.maxHp, p.hp + Math.round((p.maxHp - p.hp) * 0.5 * p.healMult));
                        p.speed = Math.max(40, p.speed - 5); break;
      case 'movespeed': p.speed += 20;
                        p.maxHp = Math.max(30, p.maxHp - 10);
                        p.hp = Math.min(p.hp, p.maxHp); break;
      case 'pierce':    p.pierce += 1;
                        p.damage = Math.max(5, Math.round(p.damage * 0.9)); break;
      case 'vampire':   p.vampire += 3;
                        p.maxHp = Math.max(30, p.maxHp - 15);
                        p.hp = Math.min(p.hp, p.maxHp); break;
      case 'xpmagnet':  p.xpMult = Math.min(3, p.xpMult * 1.2);
                        game.curseSpeedMult *= 1.04; break;
      case 'shotgun':   p.shotgun += 1;
                        p.attackCooldown = capUp(p.attackCooldown, 0.1, 1.6); break;
      case 'homing':    p.homing += 1;
                        p.shotSpeed = Math.max(100, Math.round(p.shotSpeed * 0.85)); break;
      case 'shield':    p.shield += 1; rebuildOrbs();
                        p.speed = Math.max(40, p.speed - 8); break;
      case 'frost':     p.frost += 1;
                        p.damage = Math.max(5, Math.round(p.damage * 0.9)); break;
      case 'crit':      p.critChance = capUp(p.critChance, 0.10, 0.6);
                        p.damage = Math.max(5, Math.round(p.damage * 0.95)); break;
      case 'armor':     p.armor = Math.min(0.5, p.armor + 0.10);
                        p.speed = Math.max(40, p.speed - 5); break;
      case 'static':    p.staticLvl += 1;
                        p.attackCooldown = capUp(p.attackCooldown, 0.05, 1.6); break;
      case 'velocity':  p.shotSpeed = Math.round(p.shotSpeed * 1.25);
                        p.maxHp = Math.max(30, p.maxHp - 10);
                        p.hp = Math.min(p.hp, p.maxHp); break;
      case 'heavyshot': p.projSize += 1;
                        p.attackCooldown = capUp(p.attackCooldown, 0.05, 1.6); break;
      // cursed upgrades — the downside is permanent for the rest of the run
      case 'lucky':       p.lucky += 1; game.curseHpMult *= 1.2; break;
      case 'darkpact':    p.pactLvl += 1; game.cultistLevel++; break;
      case 'executioner': p.critMult += 0.5; game.curseSpeedMult *= 1.10; break;
      case 'glasscannon': p.damage = Math.round(p.damage * 1.25);
                          p.maxHp = Math.max(30, p.maxHp - 20);
                          p.hp = Math.min(p.hp, p.maxHp); break;
      case 'hastepact': p.speed = Math.round(p.speed * 1.15);
                        p.attackCooldown = Math.min(p.attackCooldown, Math.max(0.2, p.attackCooldown * 0.87));
                        game.spawnHaste *= 1.15; break;
      case 'retribution': p.retribution += 1;
                        p.maxHp = Math.max(30, p.maxHp - 15);
                        p.hp = Math.min(p.hp, p.maxHp); break;
      // endless-run fallbacks: the pool is exhausted, small safe rewards
      case 'tribute':    p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.25 * p.healMult)); break;
      case 'bloodtithe': p.damage += 3; break;
      case 'deathsfavor':p.critChance = Math.min(0.9, p.critChance + 0.01); break;
      // evolutions
      case 'seekerswarm': p.seekerSwarm = 1;
                          p.shotSpeed = Math.max(100, Math.round(p.shotSpeed * 0.9)); break;
      case 'bladeorbit':  p.bladeOrbit = 1; rebuildOrbs();
                          p.speed = Math.max(40, p.speed - 5); break;
      case 'railgun':     p.railgun = 1; p.damage += 25;
                          p.attackCooldown = Math.min(1.9, p.attackCooldown + 0.3); break;
      case 'bulletstorm': p.bulletstorm = 1;
                          p.projectiles = Math.min(7, p.projectiles + 1);
                          p.attackCooldown = Math.max(0.15, p.attackCooldown - 0.1);
                          p.damage = Math.max(5, Math.round(p.damage * 0.9)); break;
