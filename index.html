      var p = game.particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      var ps = p.size || 2;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), ps, ps);
    }
    ctx.globalAlpha = 1;
  }

  function renderWorld() {
    ctx.save();
    // screen shake
    game.shakeX = game.shakeY = 0;
    if (game.shakeTimer > 0 && prefs.shake) {
      game.shakeX = randInt(-3, 3); game.shakeY = randInt(-3, 3);
      ctx.translate(game.shakeX, game.shakeY);
    }
    drawBackground();
    // spike-trap zones sit on the floor, under everything that walks on it
    for (var tz = 0; tz < game.zones.length; tz++) {
      var zone = game.zones[tz];
      var zAlpha = Math.min(0.35, zone.t * 0.35);
      ctx.fillStyle = 'rgba(125,187,66,' + zAlpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(zone.x, zone.y, zone.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(125,187,66,0.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // spikes around the rim
      ctx.fillStyle = '#dde4ec';
      for (var sp = 0; sp < 8; sp++) {
        var spa = (Math.PI * 2 / 8) * sp + zone.t;
        ctx.fillRect(Math.round(zone.x + Math.cos(spa) * (zone.r - 6)) - 1,
                     Math.round(zone.y + Math.sin(spa) * (zone.r - 6)) - 1, 2, 3);
      }
    }
    drawPickups();
    drawParticles();
    // draw enemies sorted by y for a touch of depth
    var sorted = game.enemies.slice().sort(function (a, b) { return a.y - b.y; });
    for (var i = 0; i < sorted.length; i++) drawEnemy(sorted[i]);
    drawPlayer();
    drawOrbs();
    drawProjectiles();
    // radiant beam: a fat ray of light that fades out fast
    for (var rb = 0; rb < game.beams.length; rb++) {
      var beam = game.beams[rb];
      var bAlpha = beam.t / 0.25;
      var bex = beam.x + Math.cos(beam.ang) * 600;
      var bey = beam.y + Math.sin(beam.ang) * 600;
      ctx.strokeStyle = 'rgba(255,243,160,' + (bAlpha * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(beam.x, beam.y); ctx.lineTo(bex, bey); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + bAlpha.toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(beam.x, beam.y); ctx.lineTo(bex, bey); ctx.stroke();
    }
    drawEdgeEffects();
    // static-burst lightning: jagged 3-segment bolts
    for (var zi2 = 0; zi2 < game.zaps.length; zi2++) {
      var z = game.zaps[zi2];
      ctx.strokeStyle = 'rgba(245,247,110,' + (z.t / 0.15) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(z.x1, z.y1);
      var zmx = (z.x1 + z.x2) / 2 + (z.jx || 0), zmy = (z.y1 + z.y2) / 2 + (z.jy || 0); // fixed per bolt: no flicker behind pause
      ctx.lineTo(zmx, zmy);
      ctx.lineTo(z.x2, z.y2);
      ctx.stroke();
    }
    drawFloatTexts();
    ctx.restore();

    drawEdgeTint();

    // virtual joystick overlay while a touch-drag is active
    if (touchCtl.active && touchCtl.moved) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(touchCtl.ox, touchCtl.oy, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(touchCtl.ox + touchCtl.vx * 18, touchCtl.oy + touchCtl.vy * 18, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // damage flash overlay
    if (game.damageFlash > 0) {
      ctx.fillStyle = 'rgba(255,0,0,0.2)';
      ctx.fillRect(0, 0, W, H);
    }
    // chrono freeze tint
    if (game.freezeTimer > 0) {
      ctx.fillStyle = 'rgba(120,200,255,0.10)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------------------------------------------------------------------------
  // HUD
  // ---------------------------------------------------------------------------
  // 10px pixel skull for the kill counter
  function drawSkullIcon(x, y) {
    ctx.fillStyle = '#dde4ec';
    ctx.fillRect(x + 1, y, 8, 6);
    ctx.fillRect(x + 2, y + 6, 6, 3);
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(x + 2, y + 2, 2, 2);
    ctx.fillRect(x + 6, y + 2, 2, 2);
    ctx.fillRect(x + 4, y + 6, 1, 3);
    ctx.fillRect(x + 6, y + 6, 1, 3);
  }

  // HUD (Vampire Survivors-style minimal layout): experience across the very
  // top, life in a small orb top-left plus a bar under the hero, the build
  // stacked down the left edge, kills and gold in a chip bottom-left, and the
  // ability in the bottom-right thumb corner.
  // touch players still need an on-screen pause; desktop has P / Esc
  var HUD_PAUSE = { x: 0, y: 0, w: 0, h: 0 };

  function hudUpgradeKeys(p) {
    return Object.keys(p.upgradesTaken).filter(function (uid) { return uid.indexOf('asc_') !== 0; });
  }
  function upgradeColor(id) {
    for (var u = 0; u < UPGRADES.length; u++) if (UPGRADES[u].id === id) return UPGRADES[u].color;
    for (var e = 0; e < EVOLUTIONS.length; e++) if (EVOLUTIONS[e].id === id) return EVOLUTIONS[e].color;
    return '#888888';
  }
  function isEvolutionId(id) {
    for (var e = 0; e < EVOLUTIONS.length; e++) if (EVOLUTIONS[e].id === id) return true;
    return false;
  }

  // one build slot: framed icon with its stack count in the corner
  function drawUpgradeSlot(id, count, x, y, size) {
    x = Math.round(x); y = Math.round(y);
    var evo = isEvolutionId(id);
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = evo ? '#7a2a68' : '#3b3550';
    ctx.fillRect(x, y, size, 1); ctx.fillRect(x, y + size - 1, size, 1);
    ctx.fillRect(x, y, 1, size); ctx.fillRect(x + size - 1, y, 1, size);
    ctx.fillStyle = '#14121c';
    ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
    var art = CARD_ART[id];
    var o = Math.floor((size - 12) / 2);
    if (art) drawPixelIcon(art, x + o, y + o, 1);
    else { ctx.fillStyle = upgradeColor(id); ctx.fillRect(x + 3, y + 3, size - 6, size - 6); }
    if (count > 1) text(String(count), x + size, y + size - 6, 6, '#ffffff', 'right');
  }

  // Liquid-filled glass orb (Diablo-style). ratio 0..1 is the fill level.
  function drawOrb(cx, cy, r, ratio, col, colDark) {
    ratio = clamp(ratio, 0, 1);
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx + 1, cy + 1, r + 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2c12';
    ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b08a2e';
    ctx.beginPath(); ctx.arc(cx, cy, r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1208';
    ctx.beginPath(); ctx.arc(cx, cy, r + 0.5, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#0c0608';
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    var top = cy + r - 2 * r * ratio;
    var g = ctx.createLinearGradient(0, cy - r, 0, cy + r);
    if (g && g.addColorStop) { g.addColorStop(0, col); g.addColorStop(1, colDark); ctx.fillStyle = g; }
    else ctx.fillStyle = col;
    ctx.fillRect(cx - r, top, r * 2, cy + r - top + 1);
    // sloshing surface line
    if (ratio > 0.02 && ratio < 0.98) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      for (var sx = -r; sx < r; sx += 1) {
        ctx.fillRect(cx + sx, top + Math.sin(sx * 0.35 + game.time * 3.5) * 0.9 - 0.5, 1, 1);
      }
    }
    // glass: dark rim + soft highlight
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.35, cy - r * 0.45, r * 0.38, r * 0.22, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // life orb with the numbers inside it (current big, max small)
  function drawHpOrb(p, cx, cy, r) {
    var ratio = clamp(p.hp / p.maxHp, 0, 1);
    if (ratio < 0.3) {
      ctx.globalAlpha = 0.25 + 0.25 * Math.sin(game.time * 8);
      ctx.fillStyle = '#ff2020';
      ctx.beginPath(); ctx.arc(cx, cy, r + 7, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawOrb(cx, cy, r, ratio, '#ff3b3b', '#6a0010');
    text(String(Math.max(0, Math.ceil(p.hp))), cx, cy - 5, 6, '#ffffff', 'center');
    var mx = '/' + Math.round(p.maxHp);
    text(mx, cx, cy + 2, mx.length > 4 ? 5 : 6, '#ffd0d0', 'center'); // 4-digit max HP: smaller, so it stays in the orb
  }

  // the ascendancy ability: a socket that charges up; locked until wave 10
  function drawAbilitySocket(p, x, y, s) {
    ABILITY_BTN.x = x; ABILITY_BTN.y = y; ABILITY_BTN.w = s; ABILITY_BTN.h = s;
    drawPanel(x, y, s, s, { fill: '#0b0910', border: '#3b3550', flat: true });
    if (!p.ascendancy) {
      drawIcon('lock', x + s / 2 - 4, y + s / 2 - 7, '#4a4560');
      text('W10', x + s / 2, y + s - 8, 6, '#6f6d8d', 'center');
      return;
    }
    var ready = p.abilityCd <= 0;
    var art = CARD_ART[p.ascendancy.id];
    if (art) {
      if (!ready) ctx.globalAlpha = 0.35;
      drawPixelIcon(art, x + Math.round((s - 24) / 2), y + Math.round((s - 24) / 2), 2);
      ctx.globalAlpha = 1;
    }
    if (!ready) {
      var cdRatio = clamp(p.abilityCd / (p.abilityMaxCd || 1), 0, 1);
      ctx.fillStyle = 'rgba(0,0,20,0.65)';
      ctx.fillRect(x + 1, y + 1, s - 2, Math.round((s - 2) * cdRatio));
      text(String(Math.ceil(p.abilityCd)), x + s / 2, y + s / 2 - 4, 8, '#ffffff', 'center');
    } else {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.time * 6);
      ctx.fillStyle = p.ascendancy.color;
      ctx.fillRect(x, y, s, 1); ctx.fillRect(x, y + s - 1, s, 1);
      ctx.fillRect(x, y, 1, s); ctx.fillRect(x + s - 1, y, 1, s);
      ctx.globalAlpha = 1;
    }
    if (showKeyHints()) drawKeycap('SPACE', x + s / 2, y - 11, 'center');
  }

  // kills + gold on one line, left-aligned at x; returns its width
  function ledgerWidth(size) {
    return 13 + measureText(String(game.score), size) + 10 + 10 + measureText(String(Math.round(game.coinsEarned)), size);
  }
  function drawLedger(x, y, size) {
    var lw = ledgerWidth(size);
    var lx = Math.round(x);
    drawSkullIcon(lx, y + Math.round((size - 9) / 2));
    text(String(game.score), lx + 13, y, size, '#ffffff');
    var cx = lx + 13 + measureText(String(game.score), size) + 10;
    drawCoinIcon(cx, y + Math.round((size - 7) / 2));
    text(String(Math.round(game.coinsEarned)), cx + 10, y, size, '#FFD700');
    return lw;
  }

  function drawBossBar(y) {
    if (!(game.bossWave && game.boss)) return;
    var bw2 = 220, bh2 = 8, bx2 = Math.round((W - bw2) / 2);
    text(game.boss.name || 'BOSS', W / 2, y, 8, game.boss.color, 'center');
    ctx.fillStyle = '#000';
    ctx.fillRect(bx2 - 2, y + 11, bw2 + 4, bh2 + 4);
    ctx.fillStyle = '#7a5a1a';
    ctx.fillRect(bx2 - 1, y + 12, bw2 + 2, bh2 + 2);
    ctx.fillStyle = '#2a0006';
    ctx.fillRect(bx2, y + 13, bw2, bh2);
    ctx.fillStyle = '#d4202a';
    ctx.fillRect(bx2, y + 13, Math.round(bw2 * clamp(game.boss.hp / game.boss.maxHp, 0, 1)), bh2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(bx2, y + 13, bw2, 2);
  }

  function drawWaveBanners() {
    if (game.endlessBanner > 0) {
      ctx.globalAlpha = Math.min(1, game.endlessBanner / 1.2);
      text('THE VAULT IS BROKEN', W / 2, 88, 10, '#c9a227', 'center');
      text('ENDLESS WAVES', W / 2, 108, 16, '#ff2d2d', 'center');
      text('HOW DEEP CAN YOU GO?', W / 2, 132, 6, '#bbbbbb', 'center');
      ctx.globalAlpha = 1;
    }
    if (game.waveBanner > 0) {
      ctx.globalAlpha = Math.min(1, game.waveBanner / 0.6);
      text('WAVE ' + pad(game.wave, 2), W / 2, 60, 16, '#FFD700', 'center');
      if (game.bossWave && game.boss) text(game.boss.name, W / 2, 82, 10, game.boss.color, 'center');
      else if (game.bossWave) text('! BOSS !', W / 2, 82, 8, '#ff2d2d', 'center');
      ctx.globalAlpha = 1;
    }
  }

  function drawTouchPause(x, y) {
    if (showKeyHints()) { HUD_PAUSE.w = 0; return; }
    HUD_PAUSE.x = x; HUD_PAUSE.y = y; HUD_PAUSE.w = 18; HUD_PAUSE.h = 18;
    drawPanel(x, y, 18, 18, { fill: 'rgba(0,0,0,0.55)', border: '#55557a', flat: true });
    ctx.fillStyle = '#d8d8e8';
    ctx.fillRect(x + 6, y + 5, 2, 8); ctx.fillRect(x + 10, y + 5, 2, 8);
  }

  function renderHUD() {
    var p = game.player;
    // experience across the very top, level chip on its right end
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = '#0a2a33';
    ctx.fillRect(1, 1, W - 2, 4);
    ctx.fillStyle = '#3fd2ff';
    ctx.fillRect(1, 1, Math.round((W - 2) * clamp(game.xp / xpForNext(), 0, 1)), 4);
    var lv = 'LVL ' + game.level;
    var lw = measureText(lv, 6) + 8;
    drawPanel(W - lw - 4, 4, lw, 11, { fill: '#082430', border: '#3fd2ff', flat: true });
    text(lv, W - 4 - lw / 2, 7, 6, '#cdf4ff', 'center');

    // life under the hero, where your eyes already are
    // (offset by the screen shake, like the hero it's attached to)
    var hbw = 24, hbx = Math.round(p.x - hbw / 2) + (game.shakeX || 0), hby = Math.round(p.y + p.h / 2 + 3) + (game.shakeY || 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(hbx - 1, hby - 1, hbw + 2, 5);
    ctx.fillStyle = '#3a0a10';
    ctx.fillRect(hbx, hby, hbw, 3);
    ctx.fillStyle = p.hp / p.maxHp < 0.3 && game.blinkOn ? '#ff8a8a' : '#ff3b3b';
    ctx.fillRect(hbx, hby, Math.round(hbw * clamp(p.hp / p.maxHp, 0, 1)), 3);
    // and the exact numbers in the orb, top-left
    drawHpOrb(p, 20, 26, 14);

    // wave + time up top
    text('WAVE ' + pad(game.wave, 2), W / 2, 10, 8, '#ffe600', 'center');
    text(fmtTime(game.time), W / 2, 21, 6, '#c8c8d8', 'center');
    // kills + gold: a chip bottom-left, mirroring the ability in the other corner
    var cw = ledgerWidth(8) + 14;
    drawPanel(4, H - 19, cw, 15, { fill: 'rgba(8,8,16,0.72)', border: '#2b2b48', flat: true });
    drawLedger(11, H - 15, 8);

    // build down the left edge: two columns, a third once the run is long
    var keys = hudUpgradeKeys(p);
    var bottom = H - 24;
    var maxRows = Math.max(1, Math.floor((bottom - 46) / 16));
    var cols = Math.max(2, Math.ceil(keys.length / maxRows));
    for (var k = 0; k < keys.length; k++) {
      var col = k % cols, row = Math.floor(k / cols);
      drawUpgradeSlot(keys[k], p.upgradesTaken[keys[k]], 4 + col * 16, 46 + row * 16, 14);
    }

    // ability in the right-thumb corner
    drawAbilitySocket(p, W - 34, H - 34, 28);
    drawBossBar(34);
    drawWaveBanners();
    drawTouchPause(W - 24, 20);
  }


  // ---------------------------------------------------------------------------
  // SCANLINES

  function drawScanlines() {
    if (!prefs.scanlines) return;
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var y = 0; y < H; y += 4) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
    }
    ctx.stroke();
  }

  function drawAnimatedScanlines(opacity) {
    if (!prefs.scanlines) return;
    ctx.strokeStyle = 'rgba(255,255,255,' + opacity + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var y = -4 + game.scanlineOffset; y < H; y += 4) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
    }
    ctx.stroke();
  }

  function drawIcon(name, x, y, color, s) {
    var rows = ICONS[name];
    if (!rows) return;
    s = s || 1;
    x = Math.round(x); y = Math.round(y);
    for (var pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass === 0 ? 'rgba(0,0,0,0.75)' : color;
      var o = pass === 0 ? s : 0;
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        for (var c = 0; c < row.length; c++) {
          if (row.charCodeAt(c) === 35) ctx.fillRect(x + c * s + o, y + r * s + o, s, s);
        }
      }
    }
  }

  function measureText(str, size) {
    ctx.font = size + 'px "Press Start 2P", monospace';
    return ctx.measureText(str).width;
  }

  // Panel with notched (rounded-pixel) corners and a soft drop shadow.
  function drawPanel(x, y, w, h, o) {
    o = o || {};
    x = Math.round(x); y = Math.round(y);
    if (!o.flat) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(x + 2, y + 2, w, h);
    }
    ctx.fillStyle = o.border || UI.line;
    ctx.fillRect(x + 1, y, w - 2, h);
    ctx.fillRect(x, y + 1, w, h - 2);
    ctx.fillStyle = o.fill || UI.panel;
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
    if (o.header) {
      ctx.fillStyle = o.headerFill || UI.panel2;
      ctx.fillRect(x + 1, y + 1, w - 2, o.header);
      ctx.fillStyle = o.border || UI.line;
      ctx.fillRect(x + 1, y + 1 + o.header, w - 2, 1);
    }
    if (o.accent) {
      ctx.fillStyle = o.accent;
      ctx.fillRect(x + 1, y + 1, w - 2, 2);
    }
  }

  // Big title text: black outline offset + coloured drop shadow + face.
  function drawTitleText(str, x, y, size, color, shadow, align) {
    ctx.font = size + 'px "Press Start 2P", monospace';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'top';
    var d = Math.max(1, Math.round(size / 8));
    ctx.fillStyle = '#000';
    ctx.fillText(str, x + d + 1, y + d + 1);
    ctx.fillStyle = shadow;
    ctx.fillText(str, x + d, y + d);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHeader(title, sub) {
    drawTitleText(title, W / 2, 10, 16, UI.gold, '#6b3a00');
    if (sub) text(sub, W / 2, 33, 6, UI.muted, 'center');
  }

  // keyboard key chip, returns its width
  function drawKeycap(label, x, y, align) {
    var w = Math.max(11, Math.ceil(measureText(label, 6)) + 6), h = 10;
    var lx = Math.round(align === 'right' ? x - w : (align === 'center' ? x - w / 2 : x));
    y = Math.round(y);
    ctx.fillStyle = '#000';
    ctx.fillRect(lx, y + 1, w, h);
    ctx.fillStyle = UI.lineHi;
    ctx.fillRect(lx, y, w, h);
    ctx.fillStyle = UI.panel2;
    ctx.fillRect(lx + 1, y + 1, w - 2, h - 3);
    text(label, lx + w / 2, y + 2, 6, UI.text, 'center');
    return w;
  }

  // centred row of [KEY] LABEL hints along the bottom; touch players get a
  // single plain line instead (or nothing)
  function drawHints(items, touchText, y) {
    y = y || H - 15;
    if (!showKeyHints()) {
      if (touchText) text(touchText, W / 2, y + 2, 6, UI.muted, 'center');
      return;
    }
    var parts = [], total = 0;
    for (var i = 0; i < items.length; i++) {
      var kw = Math.max(11, Math.ceil(measureText(items[i][0], 6)) + 6);
      var lw = Math.ceil(measureText(items[i][1], 6));
      parts.push([kw, lw]);
      total += kw + 4 + lw + (i ? 12 : 0);
    }
    var x = Math.round(W / 2 - total / 2);
    for (var j = 0; j < items.length; j++) {
      drawKeycap(items[j][0], x, y);
      text(items[j][1], x + parts[j][0] + 4, y + 2, 6, UI.muted);
      x += parts[j][0] + 4 + parts[j][1] + 12;
    }
  }

  function drawCoinIcon(x, y) {
    x = Math.round(x); y = Math.round(y);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 1, y + 1, 7, 7);
    ctx.fillStyle = '#b8900a';
    ctx.fillRect(x, y + 1, 7, 5);
    ctx.fillRect(x + 1, y, 5, 7);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(x + 1, y + 1, 5, 5);
    ctx.fillStyle = '#fff2a8';
    ctx.fillRect(x + 2, y + 2, 2, 2);
  }
  // coin icon + amount anchored at x ('left' | 'right' | 'center'); returns width
  function drawCoinAmount(x, y, amount, align, size, color) {
    size = size || 8;
    var s = String(amount);
    var w = 10 + measureText(s, size);
    var lx = Math.round(align === 'right' ? x - w : (align === 'center' ? x - w / 2 : x));
    drawCoinIcon(lx, y + Math.round((size - 7) / 2));
    text(s, lx + 10, y, size, color || UI.gold);
    return w;
  }
  // the balance chip in the top-right corner of shop-like screens
  function drawWallet() { drawCoinAmount(W - 10, 12, Math.round(runData.coins), 'right', 8); }

  // ON/OFF switch, right-aligned at xr and vertically centred on cy
  function drawToggle(xr, cy, on) {
    var w = 32, h = 11, x = Math.round(xr - w), y = Math.round(cy - 5);
    ctx.fillStyle = on ? UI.green : UI.lineHi;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = on ? '#123d24' : '#141424';
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
    if (on) {
      ctx.fillStyle = UI.green;
      ctx.fillRect(x + w - 9, y + 2, 7, h - 4);

      ctx.fillStyle = UI.dim;
      ctx.fillRect(x + 2, y + 2, 7, h - 4);

    }

  // ----- immediate-mode buttons with keyboard focus -----
  var uiButtons = [];        // registered by the screen drawn last frame
  var uiButtonsState = null; // the game state those buttons belong to
  var uiFocus = -1;          // focused button index (-1: use the default)
  var uiFocusState = null;
  var uiFocusMem = {};       // per-screen remembered focus (by button id)
  var uiWantId = null;
  var UI_NO_FOCUS_MEMORY = { title: 1, gameover: 1, paused: 1, feedback: 1, accountinfo: 1, nameentry: 1, login: 1 };
  var pauseEndArmed = false; // END RUN needs a second press

  function uiBegin() {
    var s = game.gameState;
    if (uiFocusState !== s) {
      // remember where the cursor was, unless it was BACK (Enter would then
      // leave the screen the moment it reopens)
      if (uiFocusState && uiButtons[uiFocus]) {
        if (uiButtons[uiFocus].id === 'back') delete uiFocusMem[uiFocusState];
        else uiFocusMem[uiFocusState] = uiButtons[uiFocus].id;
      }
      uiFocus = -1;
      uiWantId = UI_NO_FOCUS_MEMORY[s] ? null : (uiFocusMem[s] || null);
      uiFocusState = s;
      if (s === 'paused') pauseEndArmed = false;
    }
    uiButtons = [];
    uiButtonsState = s;
  }
  function uiEnd() {
    if (uiFocus >= uiButtons.length) uiFocus = -1;
    if (uiFocus >= 0) return;
    var i;
    if (uiWantId) {
      for (i = 0; i < uiButtons.length; i++) {
        if (uiButtons[i].id === uiWantId) { uiFocus = i; uiWantId = null; return; }
      }
    }
    for (i = 0; i < uiButtons.length; i++) if (uiButtons[i].isDefault) { uiFocus = i; return; }
    for (i = 0; i < uiButtons.length; i++) {
      if (uiButtons[i].nav !== false && uiButtons[i].id !== 'back') { uiFocus = i; return; }
    }
  }
  function uiIsHot(idx, b) {
    return uiFocus === idx || (uiFocus < 0 && !!b.isDefault);
  }
  function uiFocused() { return uiButtons[uiFocus] || null; }

  function uiHit(p) {
    for (var i = uiButtons.length - 1; i >= 0; i--) {
      var b = uiButtons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return { b: b, i: i };
    }
    return null;
  }
  function uiHoverAt(p) {
    if (uiButtonsState !== game.gameState) return;
    var hit = uiHit(p);
    if (hit && hit.b.nav !== false) uiFocus = hit.i;
  }
  // spatial navigation: jump to the nearest button in the pressed direction
  function uiNav(dx, dy) {
    if (uiButtonsState !== game.gameState || uiButtons.length === 0) return;
    if (uiFocus < 0) { uiEnd(); return; }
    var cur = uiButtons[uiFocus];
    var cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
    var best = -1, bestScore = 1e9;
    for (var i = 0; i < uiButtons.length; i++) {
      if (i === uiFocus) continue;
      var b = uiButtons[i];
      if (b.nav === false) continue;
      var ddx = b.x + b.w / 2 - cx, ddy = b.y + b.h / 2 - cy;
      var along = ddx * dx + ddy * dy;
      if (along <= 1) continue;
      var across = Math.abs(ddx * dy) + Math.abs(ddy * dx);
      var score = along + across * 2.2;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) {
      uiFocus = best;
      playUiMove();
      if (uiButtons[best].onFocus) uiButtons[best].onFocus();
    }
  }
  function uiActivate() {
    if (uiButtonsState !== game.gameState) return;
    if (uiFocus < 0) uiEnd();
    var b = uiButtons[uiFocus];
    if (b && !b.disabled && b.onClick) { playUiSelect(); b.onClick(); }
  }

  // b: { id, x, y, w, h, label, onClick, kind ('primary'|'danger'|normal),
  //      icon, iconColor, size, align ('center'), right(xr, cy, hot),
  //      disabled, isDefault, nav (false = mouse only), draw(b, hot),
  //      onFocus() (called when arrow keys land on it) }
  function uiButton(b) {
    var idx = uiButtons.length;
    uiButtons.push(b);
    var hot = !b.disabled && uiIsHot(idx, b);
    if (b.draw) { b.draw(b, hot); return hot; }
    var kind = b.kind || 'normal';
    var accent = kind === 'danger' ? UI.red : (b.accent || UI.gold);
    var fill, border;
    if (b.disabled) { fill = UI.panel; border = UI.line; }
    else if (kind === 'primary') { fill = hot ? UI.goldFillHi : UI.goldFill; border = hot ? UI.gold : UI.goldDim; }
    else if (kind === 'danger') { fill = hot ? '#2c1010' : UI.panel; border = hot ? UI.red : '#5a2a2a'; }
    else { fill = hot ? UI.panelHi : (b.fill || UI.panel); border = hot ? accent : (b.border || UI.line); }
    drawPanel(b.x, b.y, b.w, b.h, { fill: fill, border: border });
    if (hot) {
      ctx.fillStyle = accent;
      ctx.fillRect(Math.round(b.x) + 1, Math.round(b.y) + 2, 2, b.h - 4);
    }
    var size = b.size || 8;
    var ty = Math.round(b.y + (b.h - size) / 2);
    var labelColor = b.disabled ? UI.dim :
      (b.labelColor || (kind === 'primary' ? UI.gold : (kind === 'danger' ? (hot ? '#ffd6d6' : UI.red) : (hot ? '#ffffff' : UI.text))));
    var iconColor = b.disabled ? UI.dim : (b.iconColor || (hot ? accent : UI.muted));
    var iconW = b.icon ? 14 : 0;
    var lx;
    if (b.align === 'center') lx = Math.round(b.x + b.w / 2 - (measureText(b.label, size) + iconW) / 2);
    else lx = Math.round(b.x) + 9;
    if (b.icon) {
      drawIcon(b.icon, lx, Math.round(b.y + (b.h - 8) / 2), iconColor);
      lx += iconW;
    }
    text(b.label, lx, ty, size, labelColor);

  // ----- shared dungeon backdrop for every menu -----
  var frameDt = 1 / 60;  // set by the game loop; menu ambience moves by it
  var uiTime = 0;        // seconds since load; menus animate off this because
                         // game.time only advances while a run is playing
  var menuCritters = [];
  function initMenuBackdrop() {
    if (walls.length === 0) { walls = generateWalls(3); bgDirty = true; }
    menuCritters = [];
    var tiles = [TILE.skeleton, TILE.slime, TILE.orc, TILE.heroMage, TILE.slime, TILE.skeleton];
    for (var i = 0; i < 6; i++) {
      menuCritters.push({
        x: rand(30, W - 30), y: rand(30, H - 30),
        vx: rand(8, 16) * (Math.random() < 0.5 ? -1 : 1),
        vy: rand(6, 12) * (Math.random() < 0.5 ? -1 : 1),
        tile: tiles[i], flip: Math.random() < 0.5
      });
    }
  }

  // soft edge darkening, rendered once into a small buffer and stretched
  // (a full-resolution radial gradient every frame is surprisingly costly)
  var vignetteBuf = null;
  function drawVignette() {
    if (!vignetteBuf) {
      var vb = document.createElement('canvas');
      vb.width = W / 4; vb.height = H / 4;
      var vctx = vb.getContext('2d');
      var g = vctx.createRadialGradient(W / 8, H / 8, H * 0.3 / 4, W / 8, H / 8, W * 0.62 / 4);
      if (!g || !g.addColorStop) return;
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.6)');
      vctx.fillStyle = g;
      vctx.fillRect(0, 0, vb.width, vb.height);
      vignetteBuf = vb;
    }
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(vignetteBuf, 0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
  }

  // live dungeon floor + wandering critters under a dark veil
  function drawMenuBackdrop(veil) {
    drawBackground();   // cached floor + walls: one blit instead of ~500 tiles
    for (var ci = 0; ci < menuCritters.length; ci++) {
      var cr = menuCritters[ci];
      cr.x += cr.vx * frameDt;
      cr.y += cr.vy * frameDt;
      // bounce back inside (flipping in place after a long frame left them
      // flickering at the wall for good)
      if (cr.x < 16) { cr.x = 16; cr.vx = Math.abs(cr.vx); cr.flip = false; }
      else if (cr.x > W - 16) { cr.x = W - 16; cr.vx = -Math.abs(cr.vx); cr.flip = true; }
      if (cr.y < 16) { cr.y = 16; cr.vy = Math.abs(cr.vy); }
      else if (cr.y > H - 16) { cr.y = H - 16; cr.vy = -Math.abs(cr.vy); }
      if (!drawTile(cr.tile, Math.round(cr.x - 8), Math.round(cr.y - 8), 16, 16, cr.flip)) {
        ctx.fillStyle = '#666677';
        ctx.fillRect(Math.round(cr.x - 5), Math.round(cr.y - 5), 10, 10);
      }
    }
    ctx.fillStyle = 'rgba(4,4,12,' + veil + ')';
    ctx.fillRect(0, 0, W, H);
    drawVignette();
    drawAnimatedScanlines(0.04);
  }

  // short coin counts for tight spots: 149K, 30.2M (8 digits ran into labels)
  function fmtCoins(c) {
    c = Math.round(c);
    if (c >= 1e6) return (c >= 1e8 ? Math.round(c / 1e6) : Math.round(c / 1e5) / 10) + 'M';
    if (c >= 1e5) return Math.round(c / 1e3) + 'K';
    return '' + c;
  }
  function fmtKills(k) {
    if (k >= 1000) {
      var v = k / 1000;
      return (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10) + 'K';
    }
    return '' + k;
  }
  function fmtTime(t) {
    var mins = Math.floor(t / 60), secs = Math.floor(t % 60);
    return mins + ':' + pad(secs, 2);
  }

  // any skin the player could buy right now? (drives the NEW badge)
  function affordableSkinExists() {
    for (var ci = 0; ci < CLASSES.length; ci++) {
      var list = SKINS[CLASSES[ci].id] || [];
      for (var i = 0; i < list.length; i++) {
        var sk = list[i];
        if (skinOwned(sk.id) || !sk.price) continue;
        if (sk.tier === 'epic' && !epicUnlocked()) continue;
        if (runData.coins >= sk.price) return true;
      }
    }
    return false;
  }
  function skinCounts() {
    var owned = 0, total = 0;
    for (var ci = 0; ci < CLASSES.length; ci++) {
      var list = SKINS[CLASSES[ci].id] || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].tier === 'default') continue;
        total++;
        if (skinOwned(list[i].id)) owned++;
      }
    }
    return { owned: owned, total: total };
  }

      maybeRefreshLeaderboard();

  }

  // the frozen arena behind the results never changes, so it's drawn once
  // into a buffer and blitted every frame after that
  var gameOverBg = null;
  function renderGameOver() {
    if (!gameOverBg || gameOverBg.width !== canvas.width) {
      renderWorld();
      ctx.fillStyle = 'rgba(26,0,4,0.86)';
      ctx.fillRect(0, 0, W, H);
      drawVignette();
      var buf = document.createElement('canvas');
      buf.width = canvas.width; buf.height = canvas.height;
      var bctx = buf.getContext('2d');
      if (bctx && bctx.drawImage) { bctx.drawImage(canvas, 0, 0); gameOverBg = buf; }
    } else {
      ctx.drawImage(gameOverBg, 0, 0, W, H);
    }
    drawAnimatedScanlines(0.04);

    drawTitleText('YOU DIED', W / 2, 12, 24, '#ff3b3b', '#4a0000');
    if (game.newRecord) {
      var nr = 'NEW RECORD';
      var nw = measureText(nr, 8) + 30;
      drawPanel(W / 2 - nw / 2, 41, nw, 14, { fill: '#2a2206', border: UI.gold, flat: true });
      if (game.blinkOn) {
        drawIcon('star', W / 2 - nw / 2 + 5, 44, UI.gold);
        drawIcon('star', W / 2 + nw / 2 - 13, 44, UI.gold);
      }
      text(nr, W / 2, 44, 8, UI.gold, 'center');
    }

    // ----- stat tiles -----
    var stats = [
      { l: 'WAVE', v: pad(game.wave, 2) },
      { l: 'KILLS', v: '' + game.score },
      { l: 'LEVEL', v: pad(game.level, 2) },
      { l: 'TIME', v: fmtTime(game.time) }
    ];
    var tw = 96, tg = 8, tx0 = Math.round(W / 2 - (4 * tw + 3 * tg) / 2), ty = 62;
    for (var gi = 0; gi < 4; gi++) {
      var tx = tx0 + gi * (tw + tg);
      drawPanel(tx, ty, tw, 36, { fill: 'rgba(16,10,18,0.95)', border: '#3e2a3a' });
      text(stats[gi].l, tx + tw / 2, ty + 6, 6, UI.muted, 'center');
      text(stats[gi].v, tx + tw / 2, ty + 18, 12, '#ffffff', 'center');
    }

    // ----- class + coins earned -----
    var rx = tx0, rw = 4 * tw + 3 * tg, ry = 104;
    drawPanel(rx, ry, rw, 22, { fill: 'rgba(16,10,18,0.95)', border: '#3e2a3a' });
    drawHeroIcon(currentClass, rx + 6, ry + 3, 16);
    text(classDef(currentClass).name, rx + 28, ry + 8, 8, classTextColor(currentClass));
    var cew = drawCoinAmount(rx + rw - 8, ry + 7, '+' + Math.round(game.coinsEarned), 'right', 8);
    text('COINS EARNED', rx + rw - 8 - cew - 6, ry + 9, 6, UI.muted, 'right'); // clear of a 7-digit amount

    // ----- damage attribution: what actually carried the run -----
    var dy = 132;
    if (game.dmgDealt > 0) {
      var order = ['shot', 'orb', 'static', 'bomb', 'ability', 'pact', 'other'];
      var labels = { shot: 'SHOTS', orb: 'ORBS', static: 'STATIC', bomb: 'BOMB', ability: 'ABILITY', pact: 'BLASTS', other: 'OTHER' };
      var cols = { shot: '#ffe600', orb: '#00e5ff', static: '#f5f76e', bomb: '#ff9f1c', ability: '#ff2dd0', pact: '#9b59b6', other: '#9fb0c0' };
      var parts = [];
      for (var di = 0; di < order.length; di++) {
        var v = game.dmgBySource[order[di]] || 0;
        if (v > 0) parts.push({ k: order[di], pct: Math.round(100 * v / game.dmgDealt) });
      }
      drawPanel(rx, dy, rw, 42, { fill: 'rgba(16,10,18,0.95)', border: '#3e2a3a' });
      text('DAMAGE DEALT', rx + 8, dy + 6, 6, UI.muted);
      text(String(Math.round(game.dmgDealt)), rx + rw - 8, dy + 6, 6, UI.text, 'right');
      var barX = rx + 8, barY = dy + 16, barW = rw - 16, barH = 8, sx = barX;
      ctx.fillStyle = '#000'; ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      ctx.fillStyle = '#1a1420'; ctx.fillRect(barX, barY, barW, barH);
      for (var si = 0; si < parts.length; si++) {
        var segW = (si === parts.length - 1) ? (barX + barW - sx) : Math.round(barW * parts[si].pct / 100);
        ctx.fillStyle = cols[parts[si].k];
        ctx.fillRect(sx, barY, segW, barH);
        sx += segW;
      }
      // all seven sources don't fit one line (it ran off both screen edges):
      // fold the smallest into OTHER until the legend fits the panel
      var legendW = function (ps) {
        var w = -12;
        for (var q = 0; q < ps.length; q++) w += 9 + measureText(labels[ps[q].k] + ' ' + ps[q].pct + '%', 6) + 12;
        return w;
      };
      while (parts.length > 2 && legendW(parts) > rw - 16) {
        var mi = -1;
        for (var q = 0; q < parts.length; q++) if (parts[q].k !== 'other' && (mi < 0 || parts[q].pct < parts[mi].pct)) mi = q;
        var gone = parts.splice(mi, 1)[0], oth = null;
        for (q = 0; q < parts.length; q++) if (parts[q].k === 'other') oth = parts[q];
        if (oth) oth.pct += gone.pct; else parts.push({ k: 'other', pct: gone.pct });
      }
      var lstrs = parts.map(function (pp) { return labels[pp.k] + ' ' + pp.pct + '%'; });
      var lw = 0;
      for (var li = 0; li < lstrs.length; li++) lw += 9 + measureText(lstrs[li], 6) + 12;
      lw -= 12;
      var lx = Math.round(W / 2 - lw / 2);
      for (var lj = 0; lj < parts.length; lj++) {
        ctx.fillStyle = cols[parts[lj].k];
        ctx.fillRect(lx, dy + 30, 5, 5);
        text(lstrs[lj], lx + 9, dy + 30, 6, UI.text);
        lx += 9 + measureText(lstrs[lj], 6) + 12;
      }
    }

    // ----- best + leaderboard submission -----
    text('YOUR BEST: WAVE ' + pad(runData.bestWave, 2) + ', ' + runData.bestKills + ' KILLS, LVL ' + pad(runData.bestLevel, 2),
         W / 2, 180, 6, UI.muted, 'center');
    if (leaderboard.submitState === 'sending') {
      text('SUBMITTING SCORE...', W / 2, 192, 6, UI.dim, 'center');
    } else if (leaderboard.submitState === 'done') {
      text('SCORE SUBMITTED AS ' + playerTag(), W / 2, 192, 6, UI.green, 'center');
    } else if (leaderboard.submitState === 'error') {
      text('COULD NOT SUBMIT. ARE YOU OFFLINE?', W / 2, 192, 6, UI.red, 'center');
    }

    var locked = game.overLock > 0;
    uiButton({ id: 'again', x: W / 2 - 124, y: 208, w: 120, h: 26, kind: 'primary', icon: 'retry', label: 'PLAY AGAIN',
      align: 'center', isDefault: true, disabled: locked, onClick: function () { leaveGameOver(true); } });
    uiButton({ id: 'menu', x: W / 2 + 4, y: 208, w: 120, h: 26, icon: 'home', label: 'MAIN MENU',
      align: 'center', disabled: locked, onClick: function () { leaveGameOver(false); } });
    drawHints([['ENTER', 'SELECT'], ['ESC', 'MAIN MENU']]);
  }

  // ----- PAUSE -----
  var PAUSE_PANEL = { x: 150, y: 54, w: 180, h: 158 };
  function renderPaused() {
    renderWorld();
    renderHUD();
    ctx.fillStyle = 'rgba(2,2,10,0.72)';
    ctx.fillRect(0, 0, W, H);
    var pp = PAUSE_PANEL;
    drawPanel(pp.x, pp.y, pp.w, pp.h, { fill: 'rgba(14,14,27,0.97)', accent: UI.gold });
    drawTitleText('PAUSED', W / 2, pp.y + 12, 16, UI.gold, '#6b3a00');
    text('WAVE ' + pad(game.wave, 2) + ', ' + game.score + ' KILLS, ' + fmtTime(game.time),
         W / 2, pp.y + 34, 6, UI.muted, 'center');
    var bx = pp.x + 14, bw = pp.w - 28, bh = 22, by = pp.y + 48;
    uiButton({ id: 'resume', x: bx, y: by, w: bw, h: bh, kind: 'primary', icon: 'play', label: 'RESUME',
      isDefault: true, onClick: function () { game.gameState = 'playing'; } });
    uiButton({ id: 'music', x: bx, y: by + 27, w: bw, h: bh, icon: 'music', label: 'MUSIC', onClick: toggleMute,
      right: function (xr, cy) { drawToggle(xr, cy, !musicMuted); } });
    uiButton({ id: 'sfx', x: bx, y: by + 54, w: bw, h: bh, icon: 'sfx', label: 'SOUND FX', onClick: toggleSfx,
      right: function (xr, cy) { drawToggle(xr, cy, !sfxMuted); } });
    uiButton({ id: 'endrun', x: bx, y: by + 81, w: bw, h: bh, kind: 'danger', icon: 'cross',
      label: pauseEndArmed ? 'CONFIRM END?' : 'END RUN',
      onClick: function () {
        if (!pauseEndArmed) { pauseEndArmed = true; return; }
        pauseEndArmed = false;
        endRun();
      } });
    drawHints([['P / ESC', 'RESUME'], ['ENTER', 'SELECT']], 'TAP OUTSIDE TO RESUME');
  }

  // ----- LEVEL UP -----
  // the draft locks for a moment so a held key or a mid-fight tap can't
  // pick a card the player never saw
  var DRAFT_LOCK = 0.4;
  function draftIntro() { return clamp(1 - (game.draftLock || 0) / DRAFT_LOCK, 0, 1); }

  function renderLevelUp() {
    renderWorld();
    renderHUD();
    ctx.fillStyle = 'rgba(0,0,10,0.78)';
    ctx.fillRect(0, 0, W, H);

    drawTitleText('LEVEL UP!', W / 2, 10, 12, UI.gold, '#6b3a00');
    text('CHOOSE AN UPGRADE', W / 2, 27, 6, UI.muted, 'center');

    var intro = draftIntro();
    var slide = Math.round((1 - intro) * 10);
    ctx.globalAlpha = 0.35 + 0.65 * intro;
    for (var i = 0; i < game.cards.length; i++) {
      var c = game.cards[i];
      var cy = c.y + slide;
      var hover = intro >= 1 && game.cardFocus === i;

      var cursed = !!c.upgrade.cursed;
      var evo = !!c.upgrade.evolution;
      var tierColor = evo ? '#ff2dd0' : (cursed ? '#9b59b6' : '#FFD700');
      var cx2 = c.x + c.w / 2;
      var lift = hover ? 3 : 0;
      cy -= lift;

      if (hover) {
        ctx.fillStyle = evo ? 'rgba(255,45,208,0.45)' : (cursed ? 'rgba(155,89,182,0.45)' : 'rgba(255,215,0,0.35)');
        ctx.fillRect(c.x - 4, cy - 4, c.w + 8, c.h + 8);
      }
      ctx.fillStyle = tierColor;
      ctx.fillRect(c.x - 2, cy - 2, c.w + 4, c.h + 4);
      ctx.fillStyle = evo ? '#1f1018' : (cursed ? '#16101f' : '#1a1a2e');
      ctx.fillRect(c.x, cy, c.w, c.h);

      // tier banner across the top — the at-a-glance rarity signal
      ctx.fillStyle = tierColor;
      ctx.fillRect(c.x, cy, c.w, 11);
      text(evo ? 'EVOLUTION' : (cursed ? 'CURSED' : 'STANDARD'), cx2, cy + 3, 6, '#0d0d1a', 'center');
      if (showKeyHints()) drawKeycap(String(i + 1), c.x + 1, cy + 1);
      var owned = game.player.upgradesTaken[c.upgrade.id] || 0;
      if (owned > 0) text('x' + owned, c.x + c.w - 3, cy + 3, 6, '#0d0d1a', 'right');

      wrapText(c.upgrade.name, cx2, cy + 17, 8, '#ffffff', c.w - 8);

      var artX = cx2 - 28, artY = cy + 30;
      ctx.fillStyle = tierColor;
      ctx.fillRect(artX - 1, artY - 1, 58, 58);
      ctx.fillStyle = '#0a0a14';
      ctx.fillRect(artX, artY, 56, 56);
      var art = CARD_ART[c.upgrade.id];
      if (art) {
        drawPixelIcon(art, artX + 4, artY + 4, 4);
      } else {
        ctx.fillStyle = c.upgrade.color;
        ctx.fillRect(artX + 12, artY + 12, 32, 32);
      }

      // recipe hint: is this card an ingredient of an evolution not yet owned?
      var recipeHint = null, completesRecipe = false;
      if (!evo) {
        for (var re = 0; re < EVOLUTIONS.length; re++) {
          var rEvo = EVOLUTIONS[re];
          if (game.player.upgradesTaken[rEvo.id]) continue;
          if (rEvo.needs.indexOf(c.upgrade.id) === -1) continue;
          if (game.player.upgradesTaken[c.upgrade.id]) continue; // already have this half
          var otherIng = rEvo.needs[0] === c.upgrade.id ? rEvo.needs[1] : rEvo.needs[0];
          if (game.player.upgradesTaken[otherIng]) {
            recipeHint = 'UNLOCKS: ' + rEvo.name;
            completesRecipe = true;
            break;
          }
          if (!recipeHint) recipeHint = 'RECIPE 1/2: ' + rEvo.name;
        }
      }
      if (completesRecipe && game.blinkOn) {
        ctx.fillStyle = 'rgba(255,45,208,0.4)';
        ctx.fillRect(c.x - 5, cy - 5, c.w + 10, 3);
        ctx.fillRect(c.x - 5, cy + c.h + 2, c.w + 10, 3);
        ctx.fillRect(c.x - 5, cy - 5, 3, c.h + 10);
        ctx.fillRect(c.x + c.w + 2, cy - 5, 3, c.h + 10);
      }

      // effect (white), downside (red), rules text (dim) or recipe hint (gold),
      // each block starting below the previous one
      var ty = cy + 91;
      ty += wrapText(c.upgrade.desc.toUpperCase(), cx2, ty, 6, '#ffffff', c.w - 8) * 9 + 4;
      if (c.upgrade.con) {
        ty += wrapText('BUT: ' + c.upgrade.con, cx2, ty, 6, '#ff6b6b', c.w - 8) * 9 + 4;
      }
      if (recipeHint) {
        wrapText(recipeHint, cx2, ty, 6, completesRecipe ? '#ff5bd8' : '#FFD700', c.w - 8);
      } else if (c.upgrade.detail) {
        wrapText(c.upgrade.detail, cx2, ty, 6, '#9a98b8', c.w - 8);
      }

      ctx.fillStyle = c.upgrade.color;
      ctx.fillRect(c.x, cy + c.h - 4, c.w, 4);
    }
    ctx.globalAlpha = 1;
    drawHints([['1-3', 'PICK'], ['ARROWS', 'BROWSE'], ['ENTER', 'TAKE']], 'TAP A CARD');
  }

  // Ascendancy draft: two mutually-exclusive subclass cards after the first
  // boss falls. Same visual family as level-up cards, but grander.
  function renderAscend() {
    renderWorld();
    renderHUD();
    ctx.fillStyle = 'rgba(0,0,10,0.82)';
    ctx.fillRect(0, 0, W, H);

    text((game.lastBossName || 'THE BOSS') + ' FALLS', W / 2, 8, 8, '#ff4d4d', 'center');
    drawTitleText('CHOOSE YOUR ASCENDANCY', W / 2, 20, 10, UI.gold, '#6b3a00');
    if (game.blinkOn) text('THIS CHOICE IS FOREVER', W / 2, 35, 6, UI.purple, 'center');

    var intro = draftIntro();
    var slide = Math.round((1 - intro) * 10);
    ctx.globalAlpha = 0.35 + 0.65 * intro;
    for (var i = 0; i < game.cards.length; i++) {
      var c = game.cards[i];
      var a = c.asc;
      var hover = intro >= 1 && game.cardFocus === i;
      var cy = c.y + slide - (hover ? 3 : 0);
      var cx2 = c.x + c.w / 2;

      if (hover) {
        ctx.fillStyle = 'rgba(255,215,0,0.4)';
        ctx.fillRect(c.x - 4, cy - 4, c.w + 8, c.h + 8);
      }
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(c.x - 2, cy - 2, c.w + 4, c.h + 4);
      ctx.fillStyle = '#141020';
      ctx.fillRect(c.x, cy, c.w, c.h);

      ctx.fillStyle = a.color;
      ctx.fillRect(c.x, cy, c.w, 12);
      text('ASCENDANCY', cx2, cy + 3, 6, '#0d0d1a', 'center');
      if (showKeyHints()) drawKeycap(String(i + 1), c.x + 1, cy + 1);

      text(a.name, cx2, cy + 19, 10, '#ffffff', 'center');

      var artX = cx2 - 26, artY = cy + 34;
      ctx.fillStyle = a.color;
      ctx.fillRect(artX - 1, artY - 1, 54, 54);
      ctx.fillStyle = '#0a0a14';
      ctx.fillRect(artX, artY, 52, 52);
      var art = CARD_ART[a.id];
      if (art) drawPixelIcon(art, artX + 2, artY + 2, 4);

      var ay = cy + 94;
      ay += wrapText(a.active.toUpperCase(), cx2, ay, 6, '#ffffff', c.w - 12) * 9 + 3;
      text('COOLDOWN ' + a.cd + 'S', cx2, ay, 6, '#9a98b8', 'center');
      wrapText(a.passive.toUpperCase(), cx2, ay + 13, 6, '#1dd1a1', c.w - 12);
      text('SPACE OR TAP TO CAST', cx2, cy + c.h - 14, 6, '#9fb0c0', 'center');

      ctx.fillStyle = a.color;
      ctx.fillRect(c.x, cy + c.h - 4, c.w, 4);
    }
    ctx.globalAlpha = 1;
    drawHints([['1-2', 'PICK'], ['ARROWS', 'BROWSE'], ['ENTER', 'TAKE']], 'TAP A CARD');
  }

  // ----- CLASS SELECT: hero roster on the left, the chosen hero's sheet on the right -----
  var classSelFocus = 0;     // the hero whose sheet is showing
  var classSelArmed = -1;    // hero clicked once this visit; a second click starts
  var classInfoOpen = false; // (i) toggles exact numbers + description

  function drawStatBars(cls, x, y) {
    var labels = ['HP', 'SPD', 'PWR'];
    for (var s = 0; s < 3; s++) {
      var sy = y + s * 11;
      text(labels[s], x, sy, 6, UI.muted);
      for (var sg = 0; sg < 5; sg++) {
        ctx.fillStyle = sg < cls.bars[s] ? cls.color : '#26263a';
        ctx.fillRect(x + 26 + sg * 10, sy, 8, 6);
      }
    }
  }

  // exact numbers, same footprint as the bars
  function drawStatNumbers(cls, x, y) {
    var fire = cls.cooldown.toFixed(cls.cooldown < 1 ? 2 : 1) + 'S';
    var rows = [['HP', cls.hp], ['SPEED', cls.speed], ['DAMAGE', cls.damage],
                ['FIRE', fire], ['PIERCE', cls.pierce || 0]];
    for (var r = 0; r < rows.length; r++) {
      var cx = x + (r < 3 ? 0 : 84), cy = y + (r % 3) * 11;
      text(rows[r][0], cx, cy, 6, UI.muted);
      text(String(rows[r][1]), cx + 70, cy, 6, UI.text, 'right');
    }
  }

  // keyboard: the sheet already follows the cursor, so Enter starts.
  // mouse/touch: the first click shows the hero, the second starts the run.
  function selectRosterHero(idx) {
    if (lastInput === 'key' || classSelArmed === idx) { selectClassByIndex(idx); return; }
    classSelFocus = idx;
    classSelArmed = idx;
    classUnlockPending = null;
  }

  function renderClassSelect() {
    drawMenuBackdrop(0.86);
    drawHeader('CHOOSE YOUR HERO', null);
    drawWallet();

    var top = 50, ph = 154;
    // ----- roster: 2 x 3 portraits, the odd hero out centred on the last row -----
    var gx = 18, gw = 168, tileW = 74, tileH = 42, gap = 6;
    drawPanel(gx, top, gw, ph, { fill: 'rgba(14,14,27,0.92)' });
    var tx0 = gx + Math.round((gw - (2 * tileW + gap)) / 2);
    var ty0 = top + Math.round((ph - (3 * tileH + 2 * gap)) / 2);
    for (var i = 0; i < CLASSES.length; i++) {
      var tx = tx0 + (i % 2) * (tileW + gap), ty = ty0 + Math.floor(i / 2) * (tileH + gap);
      var lastAlone = i === CLASSES.length - 1 && CLASSES.length % 2 === 1;
      if (lastAlone) tx = gx + Math.round((gw - tileW) / 2);
      (function (idx, x, y) {
        var cls = CLASSES[idx];
        uiButton({ id: 'roster_' + cls.id, x: x, y: y, w: tileW, h: tileH, isDefault: idx === classSelFocus,
          onClick: function () { selectRosterHero(idx); },
          onFocus: function () { classSelFocus = idx; classUnlockPending = null; },
          draw: function (b, hot) {
            var sel = classSelFocus === idx, owned = classOwned(cls);
            drawPanel(b.x, b.y, b.w, b.h, { fill: sel ? '#1b1b33' : '#0d0d18', border: hot ? UI.gold : (sel ? cls.color : UI.line), flat: true });
            if (!owned) ctx.globalAlpha = 0.4;
            drawHeroIcon(cls.id, b.x + b.w / 2 - 14, b.y + 3, 28);
            ctx.globalAlpha = 1;
            if (!owned) drawIcon('lock', b.x + b.w - 11, b.y + 3, UI.gold);
            if (showKeyHints()) text(String(idx + 1), b.x + 4, b.y + 3, 6, UI.dim);
            text(cls.name, b.x + b.w / 2, b.y + 32, 6, sel ? '#ffffff' : UI.muted, 'center');
            if (sel) { ctx.fillStyle = cls.color; ctx.fillRect(b.x + 1, b.y + b.h - 3, b.w - 2, 2); }
          } });
      })(i, tx, ty);
    }

    // ----- hero sheet -----
    var c = CLASSES[classSelFocus], owned = classOwned(c);
    var px = 194, pw = W - px - 18;
    drawPanel(px, top, pw, ph, { fill: 'rgba(14,14,27,0.95)', accent: c.color });
    drawPanel(px + 12, top + 12, 72, 72, { fill: '#0a0a14', border: UI.line, flat: true });
    if (!owned) ctx.globalAlpha = 0.45;
    drawHeroIcon(c.id, px + 16, top + 16, 64);
    ctx.globalAlpha = 1;
    drawTitleText(c.name, px + 96, top + 16, 12, classTextColor(c.id), '#000', 'left');
    text(CLASS_BLURB[c.id], px + 96, top + 34, 6, classTextColor(c.id));
    if (classInfoOpen) drawStatNumbers(c, px + 96, top + 52);
    else drawStatBars(c, px + 96, top + 52);

    // (i): numbers and the description, for players who want them
    uiButton({ id: 'info', x: px + pw - 22, y: top + 10, w: 14, h: 14, nav: false,
      onClick: function () { classInfoOpen = !classInfoOpen; },
      draw: function (b) {
        drawPanel(b.x, b.y, b.w, b.h, { fill: classInfoOpen ? UI.goldFillHi : '#0b0b16', border: classInfoOpen ? UI.gold : UI.lineHi, flat: true });
        text('i', b.x + 7, b.y + 4, 6, classInfoOpen ? UI.gold : UI.text, 'center');
      } });

    // what it grows into at wave 10
    var ay = top + 94;
    text('AT WAVE 10 YOU PICK ONE', px + 12, ay, 6, UI.dim);
    var pair = ASCENDANCIES[c.id] || [];
    var cw = Math.floor((pw - 30) / 2);
    for (var ai = 0; ai < pair.length; ai++) {
      var a = pair[ai], ax = px + 12 + ai * (cw + 6);
      drawPanel(ax, ay + 10, cw, 20, { fill: '#0b0b16', border: hexToRgba(a.color, 0.7), flat: true });
      var art = CARD_ART[a.id];
      if (art) drawPixelIcon(art, ax + 4, ay + 14, 1);
      text(a.name, ax + 20, ay + 17, 6, a.color);
    }
    if (classInfoOpen) {
      wrapText(CLASS_DESC[c.id], px + 12, ay + 37, 6, UI.text, pw - 24, 'left');
    } else if (!owned) {
      text('UNLOCK FOR', px + 12, ay + 40, 6, UI.muted);
      drawCoinAmount(px + 12 + measureText('UNLOCK FOR ', 6), ay + 39, c.price, 'left', 8, runData.coins >= c.price ? UI.gold : '#c05050');
    }

    uiButton({ id: 'skins', x: W / 2 - 124, y: 214, w: 120, h: 22, icon: 'skins', label: 'SKINS', align: 'center',
      iconColor: chromaColor(), onClick: function () { openWardrobe('classselect', c.id); } });
    uiButton({ id: 'start', x: W / 2 + 4, y: 214, w: 120, h: 22, kind: 'primary', icon: owned ? 'play' : 'lock',
      label: owned ? 'START RUN' : (classUnlockPending === c.id ? 'CONFIRM' : 'UNLOCK'), align: 'center',
      onClick: function () { selectClassByIndex(classSelFocus); } });
    drawHints([['ARROWS', 'BROWSE'], ['I', 'INFO'], ['ENTER', 'START'], ['ESC', 'BACK']], 'TAP A HERO, THEN START');
  }



  // Small colored "tome" book icon (distinct colour per tome).
  function drawTomeIcon(color, x, y, s) {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(x - 1, y - 1, s + 2, s + 2);   // outline
    ctx.fillStyle = color;
    ctx.fillRect(x, y, s, s);                    // cover
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x, y, 3, s);                    // spine shadow
    ctx.fillStyle = '#f0ead8';
    ctx.fillRect(x + s - 2, y + 1, 2, s - 2);    // page edge
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(x + 5, y + 4, s - 8, 1);        // emblem lines
    ctx.fillRect(x + 5, y + 6, s - 10, 1);
  }

  // ----- THE VAULT (permanent tomes) -----
  function renderShop() {
    drawMenuBackdrop(0.86);
    drawHeader('THE VAULT', 'UPGRADES HERE ARE PERMANENT. TAKE ' + MAX_EQUIPPED_TOMES + ' TOMES INTO EACH RUN');
    drawWallet();

    // equipped slots
    var slotsW = 3 * 18 - 4, sx0 = Math.round(W / 2 - (measureText('EQUIPPED', 6) + 8 + slotsW) / 2);
    text('EQUIPPED', sx0, 47, 6, UI.muted);
    var slx = sx0 + measureText('EQUIPPED', 6) + 8;
    for (var sl = 0; sl < MAX_EQUIPPED_TOMES; sl++) {
      var tid = runData.equippedTomes[sl];
      var titem = null;
      for (var si = 0; si < SHOP_ITEMS.length; si++) if (SHOP_ITEMS[si].id === tid) titem = SHOP_ITEMS[si];
      drawPanel(slx + sl * 18, 42, 14, 14, { fill: '#0a0a14', border: titem ? titem.color : UI.line, flat: true });
      if (titem) drawTomeIcon(titem.color, slx + sl * 18 + 2, 44, 10);
    }

    var x = 24, w = 432, upW = 88;
    for (var i = 0; i < SHOP_ITEMS.length; i++) {
      (function (item, idx, ry) {
        var lvl = runData.shop[item.id] || 0;
        var equipped = isTomeEquipped(item.id);
        var maxed = lvl >= 5;
        var price = maxed ? 0 : SHOP_PRICES[lvl];
        var affordable = !maxed && runData.coins >= price;

        uiButton({ id: 'equip_' + item.id, x: x, y: ry, w: w - upW - 4, h: 30,
          onClick: function () { toggleTomeEquip(idx); },
          draw: function (b, hot) {
            var fill = hot ? UI.panelHi : (equipped ? mixHex(item.color, UI.panel, 0.12) : 'rgba(14,14,27,0.95)');
            drawPanel(b.x, b.y, b.w, b.h, { fill: fill, border: hot ? UI.gold : (equipped ? item.color : UI.line) });
            if (equipped || hot) { ctx.fillStyle = hot ? UI.gold : item.color; ctx.fillRect(b.x + 1, b.y + 2, 2, b.h - 4); }
            drawTomeIcon(item.color, b.x + 10, b.y + 8, 14);
            text(item.name, b.x + 32, b.y + 6, 8, lvl > 0 ? UI.text : UI.muted);
            text(item.desc, b.x + 32, b.y + 18, 6, UI.muted);
            var px = b.x + 194;
            for (var pip = 0; pip < 5; pip++) {
              ctx.fillStyle = pip < lvl ? item.color : '#26263a';
              ctx.fillRect(px + pip * 10, b.y + 7, 8, 6);
            }
            text('LV ' + lvl + '/5', px, b.y + 18, 6, UI.dim);
            var xr = b.x + b.w - 8;
            if (equipped) {
              text('EQUIPPED', xr, b.y + 12, 6, UI.green, 'right');
              drawIcon('check', xr - measureText('EQUIPPED', 6) - 12, b.y + 10, UI.green);
            } else if (lvl < 1) {
              text('NOT OWNED', xr, b.y + 12, 6, UI.dim, 'right');
            } else {
              text('EQUIP', xr, b.y + 12, 6, hot ? '#ffffff' : UI.muted, 'right');
            }
          } });

        uiButton({ id: 'buy_' + item.id, x: x + w - upW, y: ry, w: upW, h: 30,
          onClick: function () { tryBuyShopItem(idx); },
          draw: function (b, hot) {
            var border = hot ? UI.gold : (maxed ? '#2f6b47' : (affordable ? UI.goldDim : '#4a2626'));
            drawPanel(b.x, b.y, b.w, b.h, { fill: hot ? UI.goldFillHi : (affordable ? UI.goldFill : 'rgba(14,14,27,0.95)'), border: border });

              text('MAXED', b.x + b.w / 2, b.y + 11, 8, UI.green, 'center');
            } else {
              text(lvl === 0 ? 'BUY' : 'UPGRADE', b.x + b.w / 2, b.y + 6, 6, UI.muted, 'center');

          } });
      })(SHOP_ITEMS[i], i, 62 + i * 34);

    drawHints([['ENTER', 'EQUIP / BUY'], ['1-5', 'QUICK BUY'], ['ESC', 'BACK']], 'TAP A TOME TO EQUIP IT, OR ITS PRICE TO BUY');
  }

  // ---------------------------------------------------------------------------
  // WARDROBE — hero skin gallery (cosmetics, separate from The Vault's power)
  // ---------------------------------------------------------------------------
  // draw a class hero sprite with a skin applied, at (x,y,size)
  function drawSkinPreview(classId, skin, x, y, size) {
    if (classId === 'bombardier') {
      var bv = skin.chroma ? chromaColor() : (skin.tint || '#ff8c1a');
      drawBombardierAt(x + size / 2, y + size / 2, size / 16, 1, bv);
      return;
    }
    var tile = classDef(classId).tile;
    var tint = skin.chroma ? chromaColor() : skin.tint;
    if (tint) {
      if (skin.chroma) {
        var a0 = ctx.globalAlpha;   // keep the caller's dimming (locked skins)
        ctx.globalAlpha = a0 * (0.28 + 0.15 * Math.sin(uiTime * 6));
        drawTintedTile(tile, x - 2, y - 2, size + 4, size + 4, false, tint, 1);
        ctx.globalAlpha = a0;
      }
      if (!drawTintedTile(tile, x, y, size, size, false, tint, skin.chroma ? 0.62 : 0.5)) {
        ctx.fillStyle = tint; ctx.fillRect(x, y, size, size);
      }
    } else if (!drawTile(tile, x, y, size, size, false)) {
      ctx.fillStyle = classDef(classId).color; ctx.fillRect(x, y, size, size);
    }
  }

  function skinAccent(skin) {
    return skin.tier === 'epic' ? (skin.chroma ? chromaColor() : '#ffd24a')
         : (skin.tier === 'basic' ? '#54a0ff' : '#8890a0');
  }

  function drawSkinCard(b, hot) {
    var skin = b.skin;
    var owned = skinOwned(skin.id);
    var equipped = equippedSkinId(wardrobeClass) === skin.id;
    var pending = skinPending === skin.id;
    var locked = skin.tier === 'epic' && !epicUnlocked();
    var accent = skinAccent(skin);
    var x = b.x, w = b.w, h = b.h, y = b.y - (hot ? 3 : 0);
    if (hot) {
      ctx.fillStyle = 'rgba(255,215,0,0.2)';
      ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
    }
    drawPanel(x, y, w, h, { fill: hot ? '#17172c' : 'rgba(14,14,27,0.95)', border: equipped ? UI.green : (hot ? UI.gold : accent) });
    ctx.fillStyle = accent;
    ctx.fillRect(x + 1, y + 1, w - 2, 12);
    text(skin.tier.toUpperCase(), x + w / 2, y + 4, 6, '#101018', 'center');

    if (locked) ctx.globalAlpha = 0.35;
    drawSkinPreview(wardrobeClass, skin, Math.round(x + w / 2 - 24), y + 24, 48);
    ctx.globalAlpha = 1;

    text(skin.name, x + w / 2, y + 82, 8, '#ffffff', 'center');

    var cy = y + 112;
    if (equipped) {
      var ew = measureText('EQUIPPED', 8) + 12;
      drawIcon('check', x + w / 2 - ew / 2, cy - 1, UI.green);
      text('EQUIPPED', x + w / 2 + 6, cy, 8, UI.green, 'center');
    } else if (owned) {
      text('OWNED', x + w / 2, cy - 6, 6, UI.dim, 'center');
      text('EQUIP', x + w / 2, cy + 6, 8, hot ? '#ffffff' : UI.muted, 'center');
    } else if (locked) {
      drawIcon('lock', x + w / 2 - 4, cy - 8, UI.red);
      text('REACH WAVE ' + EPIC_SKIN_WAVE, x + w / 2, cy + 6, 6, '#ff8888', 'center');
    } else {
      var aff = runData.coins >= skin.price;
      if (pending) text('TAP AGAIN TO BUY', x + w / 2, cy - 8, 6, UI.green, 'center');
      drawCoinAmount(x + w / 2, cy + (pending ? 4 : 0), skin.price, 'center', 10, aff ? UI.gold : '#c05050');
    }
  }

  function renderWardrobe() {
    drawMenuBackdrop(0.86);
    drawHeader('SKINS', 'LOOKS ONLY. YOUR STATS STAY THE SAME');
    drawWallet();

    // character tabs, aligned with the class-select card grid
    var tabW = 84, gap = 6, tx0 = Math.round(W / 2 - (CLASSES.length * tabW + (CLASSES.length - 1) * gap) / 2);

  // ----- RECIPE CODEX -----
  var CODEX_TIPS = [
    'DMG BOOST IS IN TWO RECIPES, SO IT IS A SAFE EARLY PICK',
    'FROST + FAST FIRE = A PERMANENT SLOW FIELD',

    'HOMING SHOT IS IN TWO RECIPES TOO: SHOTGUN AND KEEN EDGE'
  ];
  function upgradeById(id) {
    for (var i = 0; i < UPGRADES.length; i++) if (UPGRADES[i].id === id) return UPGRADES[i];
    return null;
  }
  function drawRecipeChip(id, name, color, x, y, w, h, evo) {

    if (art) drawPixelIcon(art, x + 4, y + Math.round((h - 12) / 2), 1);
    else { ctx.fillStyle = color; ctx.fillRect(x + 5, y + Math.round((h - 10) / 2), 10, 10); }
    text(name, x + 20, y + Math.round((h - 6) / 2), 6, evo ? '#ff8fe6' : UI.text);
  }

  function renderCodex() {
    drawMenuBackdrop(0.86);

          draw: function (b, hot) {

            drawRecipeChip(evo.needs[0], a.name, a.color, b.x + 4, b.y + 3, 124, rh - 6, false);

            drawRecipeChip(evo.needs[1], b2.name, b2.color, b.x + 148, b.y + 3, 124, rh - 6, false);
            text('=', b.x + 282, b.y + 7, 8, UI.muted, 'center');
            drawRecipeChip(evo.id, evo.name, evo.color, b.x + 292, b.y + 3, b.w - 296, rh - 6, true);
          } });
      })(EVOLUTIONS[i], 58 + i * 25);

    // details for the focused recipe
    var f = uiFocused();

    drawPanel(x, dy, w, 34, { fill: 'rgba(14,14,27,0.95)', accent: UI.pink });

    var tip = CODEX_TIPS[Math.floor(uiTime / 5) % CODEX_TIPS.length];
    text('TIP: ' + tip, W / 2, 228, 6, UI.dim, 'center');
    drawHints([['ARROWS', 'BROWSE'], ['ESC', 'BACK']], 'TAP A RECIPE FOR DETAILS');
  }

  // ----- FEEDBACK (post-first-death nudge: itch ratings make the game visible) -----
  function renderFeedback() {
    drawMenuBackdrop(0.86);
    drawHeader('ENJOYING KRYPTVAULT?', null);
    drawPanel(80, 50, 320, 66, { fill: 'rgba(14,14,27,0.96)' });
    text('SMALL FREE GAMES GET FOUND THROUGH', W / 2, 62, 8, UI.text, 'center');
    text('RATINGS AND COMMENTS ON ITCH.IO', W / 2, 76, 8, UI.text, 'center');
    text('IT TAKES 20 SECONDS AND REALLY HELPS', W / 2, 96, 6, UI.muted, 'center');
    uiButton({ id: 'rate', x: 140, y: 128, w: 200, h: 26, kind: 'primary', icon: 'star', label: 'RATE IT ON ITCH.IO',
      align: 'center', isDefault: true, onClick: function () {
        window.open(ITCH_URL, '_blank');
        game.gameState = 'title';
        maybeRefreshLeaderboard();
      } });
    uiButton({ id: 'later', x: 140, y: 160, w: 200, h: 22, label: 'MAYBE LATER', align: 'center',
      onClick: function () { game.gameState = 'title'; maybeRefreshLeaderboard(); } });
    drawHints([['ENTER', 'SELECT'], ['ESC', 'SKIP']]);
  }

  // Toast popups, drawn over every screen.
  function drawToasts() {
    var y0 = game.gameState === 'title' ? 54 : 40;
    for (var i = 0; i < game.toasts.length; i++) {
      var t = game.toasts[i];
      var alpha = t.t < 0.25 ? t.t / 0.25 : (t.t > 2.4 ? Math.max(0, 1 - (t.t - 2.4) / 0.6) : 1);
      ctx.globalAlpha = alpha;
      var tw = Math.min(W - 20, Math.ceil(measureText(t.txt, 8)) + 22);
      var tx = Math.round((W - tw) / 2), ty = y0 + i * 19;
      drawPanel(tx, ty, tw, 16, { fill: '#1d1806', border: UI.goldDim });
      ctx.fillStyle = UI.gold;
      ctx.fillRect(tx + 1, ty + 2, 2, 12);
      text(t.txt, W / 2, ty + 4, 8, UI.gold, 'center');
      ctx.globalAlpha = 1;
    }
  }

  function renderWaveIntro() {
    // frozen world behind a translucent overlay
    renderWorld();
    renderHUD();
    ctx.fillStyle = 'rgba(0,0,10,0.6)';
    ctx.fillRect(0, 0, W, H);

    var cw = 240, ch = 100, cx = (W - cw) / 2, cy = (H - ch) / 2;
    drawPanel(cx, cy, cw, ch, { fill: 'rgba(13,13,26,0.97)', border: UI.gold, accent: UI.gold });

    text('WAVE', W / 2, cy + 12, 8, UI.gold, 'center');
    drawTitleText(pad(game.wave, 2), W / 2, cy + 26, 24, UI.gold, '#6b3a00');

    if (game.bossWave) {
      if (game.blinkOn) {
        text('! BOSS WAVE !', W / 2, cy + 64, 8, '#ff4d4d', 'center');
      }
      // tease the incoming boss by name (kind rotation is deterministic)
      var upKind = BOSS_KINDS[(Math.round(game.wave / 10) - 1 + 300) % 3];
      text(BOSS_DEFS[upKind].name, W / 2, cy + 80, 6, BOSS_DEFS[upKind].color, 'center');
    } else {
      text('~' + game.waveTarget + ' ENEMIES', W / 2, cy + 64, 8, '#ffffff', 'center');
      // announce the biome on the first wave after each boss (11, 21, 31...)
      if (game.wave > 10 && game.wave % 10 === 1) {
        text('ENTERING ' + currentBiome().name, W / 2, cy + 80, 6, '#ffb347', 'center');
      }
    }
  }

  // word-wrap renderer, centred on x unless align is 'left'; returns line count
  function wrapText(str, cx, y, size, color, maxW, align) {
    ctx.font = size + 'px "Press Start 2P", monospace';
    var words = str.split(' ');
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    for (var l = 0; l < lines.length; l++) {
      text(lines[l], cx, y + l * (size + 3), size, color, align || 'center');
    }
    return lines.length;
  }

  // ---------------------------------------------------------------------------
  // MAIN RENDER
  // ---------------------------------------------------------------------------
  function render() {
    // every frame starts from the logical 480x270 space scaled up to the canvas
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // once we leave a typed screen, dismiss the mobile keyboard
    if (game.gameState !== 'nameentry' && document.activeElement === nameInput) {
      nameInput.blur();
    }
    if (game.gameState !== 'login' && document.activeElement === loginInput) {
      loginInput.blur();
    }

    uiBegin();
    var s = game.gameState;
    if (s === 'title') renderTitle();
    else if (s === 'nameentry') renderNameEntry();
    else if (s === 'settings') renderSettings();
    else if (s === 'account') renderAccount();
    else if (s === 'login') renderLogin();
    else if (s === 'accountinfo') renderAccountInfo();
    else if (s === 'classselect') renderClassSelect();
    else if (s === 'shop') renderShop();
    else if (s === 'wardrobe') renderWardrobe();
    else if (s === 'codex') renderCodex();
    else if (s === 'feedback') renderFeedback();
    else if (s === 'gameover') renderGameOver();
    else if (s === 'levelup') renderLevelUp();
    else if (s === 'ascend') renderAscend();
    else if (s === 'waveintro') renderWaveIntro();
    else if (s === 'paused') renderPaused();
    else {
      renderWorld();
      renderHUD();
    }
    if (s !== 'title' && s !== 'gameover') drawScanlines();

    // shared back button on every menu screen
    if (BACK_STATES[s]) drawBackButton();
    uiEnd();

    // boss-death white flash, drawn on top of everything for a few frames
    if (game.whiteFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(0, 0, W, H);
    }

    drawToasts();
  }

  // ---------------------------------------------------------------------------
  // GAME LOOP
  // ---------------------------------------------------------------------------
  fetchLeaderboard();
  initMenuBackdrop();
  syncProgressDown(); // catch up with progress made on other devices
  // migrate pre-account players: claim a tag for the locally saved name
  if (runData.name && runData.name.length === 3 && !runData.playerDisc) {
    registerAccount(true);
  }

  var lastTime = performance.now();
  var frameErrors = 0;
  function frameError(err) {
    if (++frameErrors <= 5) console.error('KRYPTVAULT frame error:', err);
    reportError(err, 'frame');
  }
  function loop(ts) {
    // book the next frame first and catch anything that throws: one bad frame
    // used to stop the loop for good, which players saw as a frozen game
    requestAnimationFrame(loop);
    var dt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (dt > 0.05) dt = 0.05; // cap to avoid spiral of death
    frameDt = dt;
    uiTime += dt;
    try { update(dt); } catch (err) { frameError(err); }
    try { render(); } catch (err) {
      frameError(err);
      // a draw that threw can skip its restore(): unwind the stack so a stray
      // clip or fade can't stick to every frame after (empty stack = no-op)
      for (var rs = 0; rs < 32; rs++) ctx.restore();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  requestAnimationFrame(loop);

})();
</script>
